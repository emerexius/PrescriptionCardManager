/* ====================================================================================================
   TOASTS AND PAYING COSTS
   ==================================================================================================== */

let tt;
let toastMs = 3800;

// Show a small notice (skipped while the AI is only simulating).
function toast(title, detail = "", kind = ""){
  if (SIM) return;
  const el = $("#toast");
  el.classList.toggle("info", kind === "info");
  el.innerHTML = `<b>${esc(title)}</b>${detail ? `<span>${esc(detail)}</span>` : ""}`;
  el.classList.add("on");
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove("on"), toastMs);
}

// The list a card zone refers to (discard pile or hand).
const zl = z => z === "discard" ? play.discard : play.hand;
// true: playing a card spends its Blood / Dry Blood; false: it only has to be affordable.
const SPEND_COST = true; // true: playing a card spends its Blood / Dry Blood. false: it only checks that you have enough.
// Pack surcharge: a Pack character in hand costs 2 extra for each Pack character already in play.
const packSur = (id, zone) => (zone === "hand" && byId[id] && byId[id].type === "character" && byId[id].pack && !byId[id].token) ? packCount() * 2 : 0;

// Why a card can't be played right now, or a falsy value if it can.
function costLack(id, zone){
  if (play.noPlay) return ["No more cards this turn", "You sacrificed a character, so no cards can be played this turn."];
  const c = byId[id], z0 = blood0(id), sur = z0 ? 0 : packSur(id, zone), base = z0 ? 0 : (+c.blood_cost || 0), b = base + sur, d = +c.dry_blood_cost || 0, hb = (play.blood || 0) + (play.dryCur || 0), ht = play.dry || 0;
  const lb = b > hb, ld = d > ht;
  if (!lb && !ld) return null;
  const t = lb && ld ? "Insufficient Blood and Tokens" : lb ? "Insufficient Blood" : "Insufficient Tokens";
  const det = [lb && `needs ${b} Blood${sur ? `, ${base} + ${sur} Pack surcharge` : ""} (you have ${play.blood || 0} Blood + ${play.dryCur || 0} Dry Blood)`, ld && `needs ${d} Token${d > 1 ? "s" : ""} (you have ${ht})`].filter(Boolean).join(" · ");
  return [t, `${c.name} ${det}`];
}

// Floating '+1 Blood' style note when a resource changes.
function bnote(k, d, why){
  if (SIM) return;
  const box = $("#bnotes");
  if (!box || !d) return;
  const el = document.createElement("div");
  el.className = "bn " + k;
  el.innerHTML = `${d > 0 ? "+" : "−"}${Math.abs(d)} ${k === "dry" ? "Token" : k === "dryc" ? "Dry Blood" : "Blood"}${why ? `<small>${esc(why)}</small>` : ""}`;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// Change a resource (Blood, Dry Blood, Token, points) and show a note.
function addTk(k, d, why){
  const key = k === "dryc" ? "dryCur" : k;
  const old = play[key] || 0, nv = Math.max(0, old + d);
  if (nv === old) return;
  play[key] = nv;
  if (k === "blood" && nv > old) ms(m => { m.blood += nv - old; });
  bnote(k, nv - old, why);
}

// Raise or lower the Dry Blood maximum (capped by DRY_CAP).
function addDryMax(d, why){
  const o = play.dryMax || 0, nv = Math.min(DRY_CAP, Math.max(0, o + d));
  if (nv === o) return;
  play.dryMax = nv;
  addTk("dryc", nv - o, why);
  if ((play.dryCur || 0) > nv) play.dryCur = nv;
}

// Top Dry Blood back up to its maximum (start of each of your turns).
function refillDry(why){ const d = (play.dryMax || 0) - (play.dryCur || 0); if (d > 0){ play.dryCur = play.dryMax; bnote("dryc", d, why || "Dry Blood refilled"); } }

// Spend the cost of a card being played.
function payCost(id, zone){
  ms(m => { m.played++; (m.cards || (m.cards = {}))[id] = (m.cards[id] || 0) + 1; });
  play.turnPlays = (play.turnPlays || 0) + 1;
  if (!SPEND_COST) return;
  const c = byId[id], b = blood0(id) ? 0 : (+c.blood_cost || 0) + packSur(id, zone);
  const d = +c.dry_blood_cost || 0;
  const fromDry = Math.min(b, play.dryCur || 0);
  if (fromDry) addTk("dryc", -fromDry, "Played " + c.name);
  if (b - fromDry) addTk("blood", -(b - fromDry), "Played " + c.name);
  if (d) addTk("dry", -d, "Played " + c.name);
}
/* ---- turns, clocks, combat ---- */
const inGame = () => net.mode === "online" && !!net.g && net.g.phase === "play";
// Display name of a player id.
const pname = id => id === me() ? net.name : ((net.players[id] || {}).name || "Opponent");
// Id of the (first) opponent.
const oppId = () => Object.keys(net.players)[0];
// Has someone reached the 30-point limit?
const isOver = () => Math.abs(net.score) >= SC_MAX;

// Is it my turn and are no menus / battles blocking me?
function canAct(){
  if (net.mode !== "online") return true;
  return inGame() && net.g.who === me() && !net.cb && !(play && play.ts) && !isOver();
}

// Turn number an infliction ends on (this turn if cast on my own card during my turn, otherwise the next); undefined outside a game.
const expFor = mineT => { if (!inGame()) return undefined; return (mineT && net.g.who === me()) ? net.g.n : net.g.n + 1; };

// Host only: send the game state to everyone and apply it locally.
function pushGame(){ if (net.role !== "host") return; bcast({ t: "game", g: net.g, score: net.score }); applyGame(net.g); }

// Apply a game-state update from the host (phase, whose turn, clocks).
function applyGame(g){
  const sn = net.seen || (net.seen = { phase: "lobby", n: 0 });
  const ph = sn.phase, on = sn.n; sn.phase = g.phase; sn.n = g.n;
  net.tEnd = (g.phase === "play" && !g.paused && g.secs > 0) ? Date.now() + g.remain + (g.coin ? 2600 : 0) : null;
  if (g.phase === "play" && ph !== "play"){ startLocal(g); return; }
  if (g.phase !== "play" && ph === "play"){ net.cb = null; net.rp = null; if (play){ play.ts = false; play.atkSel = null; } }
  else if (g.phase === "play" && g.n !== on) turnChanged(g, on);
  renderPlay();
}

// Start an online game on this side: reset the board and build the deck (the AI makes its own random deck).
function startLocal(g){
  net.cb = null; net.rp = null;
  if (BOT) aiNewDeck();
  newGame();
  if (!play) return;
  for (let i = 0; i < g.hc; i++) if (play.pile.character.length) play.hand.push(play.pile.character.pop());
  for (let i = 0; i < g.ho; i++) if (play.pile.other.length) play.hand.push(play.pile.other.pop());
  play.fresh = { from: 0 };
  const el = $("#coin");
  el.innerHTML = `<div class="cn"></div><h2>${esc(pname(g.who))} goes first</h2>`;
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 2600);
  if (g.who === me()) setTimeout(beginMyTurn, 2650);
  renderPlay();
}

// Start of my turn: clear damage, reset the per-turn flags, refill Dry Blood.
function beginMyTurn(){
  if (!play || !inGame() || net.g.who !== me() || play.turnN === net.g.n) return;
  if (isOver()) return; // someone already won: no new turn, no draw popup
  play.turnN = net.g.n;
  ms(m => { m.turns++; });
  play.inplay.forEach(e => { if (gOf(e.id) === "character") e.dmg = 0; });
  play.turnPlays = 0; play.sacUsed = false; play.noPlay = false; play.persuade = false;
  refillDry("Dry Blood refilled");
  addTk("blood", 1, "Start of turn");
  const pumps = play.inplay.filter(e => e.id === "item-blood-pump" && !e.dying).length;
  if (pumps) addTk("blood", pumps, pumps === 1 ? "Blood Pump" : pumps + " Blood Pumps");
  play.ts = true;
  renderPlay();
}

// Remove inflictions that have run out.
function expireInf(n){
  play.inplay.forEach(e => {
    const keep = [];
    (e.inf || []).forEach(x => {
      if (x.exp !== undefined && x.exp <= n){ if (x.by === me()) pushDiscard(x.id); else sendCmd(x.by, { k: "infend", id: x.id }); }
      else keep.push(x);
    });
    e.inf = keep;
  });
}

// React to the turn passing: close menus, expire effects, start my turn if it's mine.
function turnChanged(g, oldN){
  net.cb = null; closeAct(); cmI = null; viewD = null;
  if (play){ play.tgt = null; play.pick = null; play.atkSel = null; play.ts = false; play.cl = null; play.control = false; expireInf(oldN); if (g.who !== me()) endOfMyTurn(oldN); }
  ms(m => { m.tl.push(myPts()); });
  if (g.who === me()) beginMyTurn();
}

// My turn just ended: Ignite kills what could not attack, Intimidate runs down, and a character that neither attacked nor blocked this round thaws one Frozen.
function endOfMyTurn(n){
  if (!play) return;
  if ((play.ignN || []).includes(n)){
    play.inplay.forEach(e => { if (gOf(e.id) === "character" && !e.dying && !summoned(e) && effOf(e).noAttack){ toast("Ignite", `${byId[e.id].name} could not attack and was killed.`, "info"); startDeath(e, true); } });
  }
  play.inplay.forEach(e => {
    if (gOf(e.id) !== "character" || e.dying) return;
    if (e.intim){
      if (e.atkd) e.intim.hit = true;
      e.intim.left--;
      if (e.intim.left <= 0){
        if (!e.intim.hit && e.att.length){ toast("Intimidate", `${byId[e.id].name} never attacked: its ${e.att.length} attached card${e.att.length === 1 ? " was" : "s were"} banished.`, "info"); e.att = []; }
        e.intim = null;
      }
    }
    if (!e.atkd && !e.blkd){ const i = (e.cond || []).indexOf("Frozen"); if (i >= 0){ e.cond.splice(i, 1); toast("Frozen", `${byId[e.id].name} thawed one Frozen.`, "info"); } }
    e.atkd = false; e.blkd = false;
  });
}

// Host only: hand the turn to the other player.
function hostEndTurn(){
  const g = net.g; if (!g || g.phase !== "play") return;
  if (isOver()) return;
  const gst = Object.keys(net.conns)[0]; if (!gst) return;
  g.who = g.who === "host" ? gst : "host"; g.n++; g.paused = false; g.coin = false; g.remain = g.secs * 1000;
  pushGame();
}

// End my turn (the host does it directly, a guest asks the host).
function endTurn(){
  if (ignActive() && play.atkTurn !== net.g.n && ignEligible().length && !net.cb){ toast("Ignite", "Every character must attack before the turn can end."); return; }
  if (net.role === "host") hostEndTurn();
  else if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: "endturn" });
}

// Host only: pause or resume the turn clock.
function hostPause(){
  const g = net.g; if (!g || g.phase !== "play" || g.paused) return;
  g.remain = net.tEnd ? Math.max(0, net.tEnd - Date.now()) : g.remain; g.paused = true; pushGame();
}

// Pause the turn clock (host does it directly, guest asks).
function pauseTurn(){
  if (net.role === "host") hostPause();
  else if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: "pause" });
}

// Host only: start the game once both players are in the room.
function hostStart(){
  const gst = Object.keys(net.conns)[0]; if (!gst || net.g.phase !== "lobby") return;
  const g = net.g;
  if (net.ranked){
    const o = net.players[gst];
    if (!(ACC.user && ACC.name && o && o.uid)){ toast("Ranked", "Both players need to be signed in to play ranked."); return; }
    if (o.uid === ACC.user.id){ toast("Ranked", "You can't play ranked against yourself."); return; }
  }
  g.mid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  g.first = Math.random() < 0.5 ? "host" : gst; g.who = g.first; g.n = 1; g.phase = "play"; g.paused = false; g.coin = true; g.remain = g.secs * 1000;
  net.score = 0; pushGame();
}

// Return everyone to the room lobby.
function toLobby(){
  if (net.role !== "host"){ if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: "tolobby" }); return; }
  net.g.phase = "lobby"; net.g.paused = false; net.score = 0; pushGame();
}

// Format milliseconds as m:ss.
const fmtT = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };

// Update the turn clocks every moment; the host ends the turn when time runs out.
function tickClocks(){
  if (net.role === "host" && inGame() && net.tEnd && !isOver() && Date.now() >= net.tEnd) hostEndTurn();
  const g = net.g;
  document.querySelectorAll(".clk[data-p]").forEach(el => {
    if (!g || !g.secs){ el.textContent = "∞"; return; }
    const p = el.dataset.p, act = g.who === p;
    const ms = act ? (net.tEnd ? Math.max(0, net.tEnd - Date.now()) : g.remain) : g.secs * 1000;
    el.textContent = fmtT(ms);
    el.classList.toggle("on", act);
    el.classList.toggle("low", act && ms <= 10000);
  });
}
setInterval(tickClocks, 250);

// HTML for the turn bar (whose turn, clocks, Attack / End turn).
function turnBarHTML(){
  const g = net.g, mid = me(), oid = oppId(), mine = g.who === mid;
  const clk = id => `<span class="clk" data-p="${id}" title="${esc(pname(id))}'s turn clock">0:00</span>`;
  const btns = canAct() ? `<button class="go" data-attack="1" ${play.inplay.some(e => gOf(e.id) === "character" && !e.dying && !summoned(e) && !effOf(e).noAttack) ? "" : "disabled"}>Attack</button><button data-endturn="1">End turn</button>` : "";
  return `<div class="tbar"><span class="tn">Turn ${g.n}: <span class="${mine ? "mine" : "theirs"}">${esc(mine ? "Your turn" : pname(g.who) + "'s turn")}</span></span>${g.secs ? `You ${clk(mid)} ${esc(pname(oid))} ${clk(oid)}` : ""}${ignActive() ? `<span class="ign" title="Ignite: every character must attack this turn">🔥 Ignite</span>` : ""}<span class="fl"></span>${btns}${play.atkSel ? "" : ""}</div>`;
}

// Lobby 'waiting' screen shown before the game starts.
function renderWait(){
  const g = net.g, host = net.role === "host", n = Object.keys(net.players).length;
  $("#zones").innerHTML = `<div class="waitp"><h2>${net.ai ? "Playing the AI" : "Room " + esc(net.code)}</h2>${net.ai ? "" : `<button class="mini" data-copy="1">Copy code</button>`}
    ${net.ranked ? `<p class="rkl">Ranked match</p><p class="stat">Rules are fixed for ranked: 2 minutes per turn, 3 Character and 2 Other cards to start. Leaving mid-game counts as a loss.</p>` : ""}<div class="pl">Players: <b>${esc(net.name)}</b> (you)${Object.values(net.players).map(p => `, <b>${esc(p.name)}</b>`).join("")}</div>
    ${n < 1 ? `<p class="stat">${net.ai ? "The AI is getting its deck ready…" : "The game can't start until another player joins. Share the code above."}</p>` : `<p class="stat">${host ? "Everyone's here. Set the rules and start when ready." : "Waiting for the host to start the game…"}</p>`}
    <div class="set"><label for="gs-secs">Seconds per turn (0 = no timer)</label><input type="number" id="gs-secs" min="0" max="3600" value="${g.secs}" ${host && !net.ranked ? "" : "disabled"}>
      <label for="gs-hc">Starting character cards</label><input type="number" id="gs-hc" min="0" max="10" value="${g.hc}" ${host && !net.ranked ? "" : "disabled"}>
      <label for="gs-ho">Starting other cards</label><input type="number" id="gs-ho" min="0" max="10" value="${g.ho}" ${host && !net.ranked ? "" : "disabled"}></div>
    ${host ? `<button class="go big" data-gstart="1" ${n < 1 ? "disabled" : ""}>Start game (coin flip decides who goes first)</button>` : ""}
    <div class="lrow"><button data-leave="1">Leave room</button></div></div>`;

}

// Start-of-turn menu (draw a card), shown at the start of my turn.
function renderTs(){
  const m = $("#ts");
  if (!play || !play.ts || !inGame() || isOver()){ m.classList.remove("on"); return; }
  const c = play.pile.character.length, o = play.pile.other.length;
  m.querySelector(".box").innerHTML = `<h2>Your turn</h2><p class="stat">You gained 1 Blood. Now choose one:</p>
    <div class="emg"><button data-tsd="character" ${c ? "" : "disabled"}>Draw a card<small>Character deck (${c})</small></button><button data-tsd="other" ${o ? "" : "disabled"}>Draw a card<small>Other deck (${o})</small></button></div>
    <div class="row" style="justify-content:center"><button class="go" data-tsb="1">Gain 1 more Blood</button></div>`;
  m.classList.add("on");
}

// Enter attack mode: choose which characters will attack.
function beginAtkSel(){ play.atkSel = ignActive() ? ignEligible().map(e => e.uid) : []; renderPlay(); }

// Select / deselect one of my characters as an attacker.
function toggleAtk(si){
  const e = play.inplay[si]; if (!e || gOf(e.id) !== "character" || e.dying) return;
  const o = effOf(e);
  if (o.noAttack) return toast("Enfeebled", `${byId[e.id].name} cannot attack this turn.`);
  if (summoned(e)) return toast("Just arrived", `${byId[e.id].name} can't attack on its first turn in play.`);
  const i = play.atkSel.indexOf(e.uid);
  if (i >= 0 && ignActive()) return toast("Ignite", "Every character must attack this turn.");
  if (i >= 0) play.atkSel.splice(i, 1); else play.atkSel.push(e.uid);
  renderPlay();
}

// Send the chosen attackers to the opponent so they can pick blockers.
function declareAttack(){
  const opp = oppId();
  if (!play.atkSel.length) return toast("Choose attackers", "Click your characters in the order they should attack.");
  const att = play.atkSel.map(u => play.inplay.find(e => e.uid === u)).filter(Boolean).map(e => ({ uid: e.uid, id: e.id }));
  const ctl = !!play.control; play.control = false;
  play.atkTurn = inGame() ? net.g.n : -1;
  net.cb = { role: "att", phase: ctl ? "assign" : "wait", ctl, opp, uids: att.map(a => a.uid), asg: att.map(() => null) };
  play.atkSel = null;
  pauseTurn();
  sendCmd(opp, { k: "attack", att, control: ctl });
  renderPlay();
}

// Ignite: is it active for the current turn, and which of my characters can still be forced to attack?
const ignActive = () => !!play && inGame() && (play.ignN || []).includes(net.g.n);
const ignEligible = () => play.inplay.filter(e => gOf(e.id) === "character" && !e.dying && !summoned(e) && !effOf(e).noAttack);
// Was this card played this turn? (It can't attack yet.)
const summoned = e => inGame() && e.born === net.g.n;
// Does the card have this innate enchantment?
const hasEns = (o, n) => (o.innate_enchantment || []).includes(n);

// Can this blocker block this attacker? (Flying attackers can only be blocked by some cards.)
function blockOK(attO, bEnt, bO){
  if (!hasEns(attO, "Flight")) return true;
  return gOf(bEnt.id) === "character" && (hasEns(bO, "Flight") || hasEns(bO, "Reach"));
}

// The blocking choices open to the defender for one attacker.
function defOptions(cb, i){
  const o = net.players[cb.from], aEnt = o && o.st && o.st.inplay.find(e => e.uid === cb.att[i].uid);
  const aO = aEnt ? withField(o.st.inplay, () => effOf(aEnt)) : {};
  return { aEnt, aO, opts: play.inplay.filter(e => !e.dying && !effOf(e).noBlock).map(e => { const bO = effOf(e), w = (bO.when || []).find(x => x.key === "blk"); return { e, bO, ok: blockOK(aO, e, bO), atk: w ? w.attack : (bO.attack || 0), hp: w ? w.health : (bO.health || 0) }; }).filter(x => x.ok) };
}

// How many attackers one blocker may take on (items take any number; Shield changes it for characters).
const capOf = (bO, e) => e && gOf(e.id) !== "character" ? 99 : hasEns(bO, "Shield") ? 1 + ((bO.en_n || {}).Shield || 1) : 1;

// The combat dialog: attackers waiting, defender choosing blocks, or the result.
function renderCb(){
  const m = $("#cbm"), cb = net.cb, b = m.querySelector(".box");
  if (ANIM){ m.classList.remove("on"); return; }
  if (isOver()){ m.classList.remove("on"); return; }
  if (cb && cb.role === "att" && cb.phase === "assign"){
    const o = net.players[cb.opp], theirs = o && o.st ? o.st.inplay : [];
    const rows = cb.uids.map((u, i) => {
      const A = play.inplay.find(e => e.uid === u); if (!A) return "";
      const aO = effOf(A), w = (aO.when || []).find(x => x.key === "atk"), atk = w ? w.attack : (aO.attack || 0);
      const opts = theirs.filter(e => !e.dying && byId[e.id]).map(e => ({ e, bO: withField(theirs, () => effOf(e)) })).filter(x => !x.bO.noBlock && blockOK(aO, x.e, x.bO));
      return `<div class="dfrow"><img src="${esc(img(byId[A.id]))}" alt=""><div><b>${i + 1}. ${esc(byId[A.id].name)} attacks (ATK ${atk}${hasEns(aO, "Flight") ? ", Flight" : ""})</b>
        <select data-ctli="${i}"><option value="">No block (${atk} to the points ticker)</option>${opts.map(x => { const w2 = (x.bO.when || []).find(y => y.key === "blk"); return `<option value="${esc(x.e.uid)}" ${cb.asg[i] === x.e.uid ? "selected" : ""}>${esc(byId[x.e.id].name)} ${gOf(x.e.id) === "character" ? `[ATK ${w2 ? w2.attack : (x.bO.attack || 0)} / HP ${w2 ? w2.health : (x.bO.health || 0)}]` : "[Item]"}</option>`; }).join("")}</select></div></div>`;
    }).join("");
    b.innerHTML = `<h2>Control</h2><p class="stat">You choose how ${esc(pname(cb.opp))}'s characters block. Each enemy character must block at least once.</p>${rows}<div class="row" style="justify-content:center"><button class="go" data-ctlgo="1">Resolve attack</button></div>`;
    m.classList.add("on"); return;
  }
  if (cb && cb.role === "att"){ b.innerHTML = `<h2>Attack declared</h2><p class="stat">Waiting for ${esc(pname(cb.opp))} to choose how to defend…</p>`; m.classList.add("on"); return; }
  if (cb && cb.role === "def" && cb.phase === "wait"){ b.innerHTML = cb.ctl ? `<h2>Control!</h2><p class="stat">${esc(pname(cb.from))} is choosing how your characters block…</p>` : `<h2>Defense chosen</h2><p class="stat">Waiting for the attack to resolve…</p>`; m.classList.add("on"); return; }
  if (cb && cb.role === "def"){
    const rows = cb.att.map((a, i) => {
      const { aO, opts } = defOptions(cb, i), c = byId[a.id], w = (aO.when || []).find(x => x.key === "atk"), atk = w ? w.attack : (aO.attack || 0);
      return `<div class="dfrow"><img src="${esc(img(c))}" alt=""><div><b>${i + 1}. ${esc(c.name)} attacks (ATK ${atk} / HP ${w ? w.health : (aO.health || 0)}${hasEns(aO, "Flight") ? ", Flight" : ""}${hasEns(aO, "Swift") ? ", Swift" : ""})</b>
        <select data-dfi="${i}"><option value="">Let it through (${atk} damage goes past your characters)</option>${opts.map(x => `<option value="${esc(x.e.uid)}" ${cb.asg[i] === x.e.uid ? "selected" : ""}>${esc(byId[x.e.id].name)} ${gOf(x.e.id) === "character" ? `[ATK ${x.atk} / HP ${x.hp}]` : `[Item HP ${x.hp}]`}</option>`).join("")}</select></div></div>`;
    }).join("");
    b.innerHTML = `<h2>${esc(pname(cb.from))} is attacking</h2><p class="stat">Choose a defender for each attack, in order, or let the damage through. A character blocks once (Shield: twice); an item can block any number of attacks, but once it is destroyed the rest go through.</p>${rows}<div class="row" style="justify-content:center"><button class="go" data-dfgo="1">Confirm defense</button></div>`;
    m.classList.add("on"); return;
  }
  if (net.rp){
    b.innerHTML = `<h2>Combat report</h2><div class="rpl">${net.rp.lines.map(l => `<div>${esc(l)}</div>`).join("") || "<div>Nothing happened.</div>"}</div><div class="row" style="justify-content:center"><button class="go" data-rpclose="1">Close</button></div>`;
    m.classList.add("on"); return;
  }
  m.classList.remove("on");
}

// Pure combat simulator: resolves every attack in order and returns damage, deaths, points, Blood and an event list for the animation.
function simulate(att, asg, mine, theirs, theirPer){
  // R collects everything the fight produces: animation events (ev), damage dealt and taken, points, Blood, cards sent to hands, deaths and conditions.
  const R = { ev: [], dealt: {}, pts: {}, kills: {}, lines: [], md: {}, td: {}, toDef: 0, toAtt: 0, mb: 0, tb: 0, mh: [], th: [], mStolen: [], tStolen: [], dead: new Set(), mc: {}, tc: {}, rend: new Set() };
  // Is MY side protected by Persuade (damage turns into Blood)?
  const mineP = !!(play && play.persuade);
  // `cur` is the animation event for the attack being resolved right now.
  let cur = null;
  // stepStart / stepEnd wrap each attack into one animation event.
  const stepStart = o => { cur = Object.assign({ lines: [], dead: [], items: [], conds: {}, tkA: 0, tkD: 0, blA: 0, blD: 0, l0: R.lines.length }, o); R.ev.push(cur); };
  const stepEnd = () => { if (cur){ cur.lines = R.lines.slice(cur.l0); delete cur.l0; } cur = null; };
  const nm = e => byId[e.id].name;
  // stat: a card's attack and health for this fight, including damage already taken and Attacking / Blocking bonuses.
  const stat = (e, own, mode) => {
    const dm = own ? R.md : R.td;
    const c = Object.assign({}, e, { dmg: (e.dmg || 0) + (dm[e.uid] || 0) });
    const o = withField(own ? mine : theirs, () => effOf(c));
    const w = (o.when || []).find(x => x.key === mode);
    return { o, atk: w ? w.attack : (o.attack || 0), hp: w ? w.health : (o.health || 0), ens: o.innate_enchantment || [], red: o.red_points || 0 };
  };
  // cr: credit damage to the attacker's tally; deal: record damage a card takes.
  const cr = (u, n) => { if (n > 0) R.dealt[u] = (R.dealt[u] || 0) + n; };
  const deal = (e, own, n) => { const m = own ? R.md : R.td; m[e.uid] = (m[e.uid] || 0) + n; };
  // per: is this side's Persuade active?
  const per = own => own ? mineP : !!theirPer;
  // Under Persuade, damage becomes Blood for the protected side.
  const toBlood = (own, n, what) => { if (own) R.mb += n; else R.tb += n; if (cur) cur[own ? "blA" : "blD"] += n; R.lines.push(`Persuade: ${n} ${what} became Blood.`); };
  // tick: send points to the ticker (or to Blood under Persuade).
  const tick = (own, n) => { if (!n) return; if (per(own)) toBlood(own, n, "point damage"); else { if (cur) cur[own ? "tkA" : "tkD"] += n; if (own) R.toAtt += n; else R.toDef += n; } };
  // Items soak damage oldest-first.
  const oldestItem = own => (own ? mine : theirs).find(e => gOf(e.id) !== "character" && !e.dying && !R.dead.has(e.uid) && stat(e, own, "blk").hp > 0);
  // hitItem: damage one item (a Bear Trap afflicts the attacker); returns whatever is left after the item is destroyed.
  const hitItem = (it, own, n, A) => {
    if (A && n > 0 && it.id === "item-bear-trap"){ const m = own ? R.tc : R.mc; if (!(m[A.uid] || []).includes("Beartrap")){ m[A.uid] = [...(m[A.uid] || []), "Beartrap"]; if (cur) (cur.conds[A.uid] = (cur.conds[A.uid] || []).concat("Beartrap")); R.lines.push(`Bear Trap snaps on ${nm(A)}: Beartrap (Health −1).`); } }
    const b = stat(it, own, "blk"), over = Math.max(0, n - b.hp);
    if (cur) cur.items.push({ u: it.uid, n, x: n >= b.hp });
    if (A) cr(A.uid, n);
    deal(it, own, n);
    R.lines.push(`${nm(it)} (item, HP ${b.hp}) took ${n} damage.`);
    if (n >= b.hp){ R.dead.add(it.uid); R.lines.push(`${nm(it)} was destroyed.`); }
    return over;
  };
  // damage that got past the characters: oldest item first, else (unblocked only) the points ticker
  // Only an attack the defender chose not to block reaches the items: oldest item first, and anything left after
  // it is destroyed carries on to the next item, then to the points ticker. A blocked attack never damages items
  // (leftover damage after a block is absorbed; Poison sends it to the ticker instead).
  const spill = (own, n, unblocked, A) => {
    if (n <= 0 || !unblocked) return;
    let it;
    while (n > 0 && (it = oldestItem(own))){
      n = hitItem(it, own, n, A);
      if (n > 0) R.lines.push(`${n} damage carries on to the next item.`);
    }
    if (n > 0) tick(own, n);
  };
  // kill: record a defeat and any on-kill effects (Gruesome Blood, Terror takes the victim, plus what Undead / Parasitic would leave behind).
  const kill = (killer, kOwn, vic, vOwn, kS) => {
    if (cur) cur.dead.push(vic.uid);
    R.dead.add(vic.uid); R.lines.push(`${nm(vic)} was defeated by ${nm(killer)}.`);
    if (gOf(vic.id) === "character") R.kills[killer.uid] = (R.kills[killer.uid] || 0) + 1;
    if (gOf(vic.id) === "character"){
      if (kS.ens.includes("Gruesome") && kS.red > 0){ const gb = kS.red * ((kS.o.en_n || {}).Gruesome || 1); if (kOwn) R.mb += gb; else R.tb += gb; R.lines.push(`Gruesome: ${nm(killer)}'s owner gains ${gb} Blood.`); }

  (cmd.blk || []).forEach(u => { const e = play.inplay.find(x => x.uid === u); if (e && gOf(e.id) === "character"){ e.blkd = true; if (e.enf){ e.enf = false; toast("Enfeeble", `${byId[e.id].name} blocked: Enfeeble is lifted.`, "info"); } } });
  (cmd.rend || []).forEach(u => { const e = play.inplay.find(x => x.uid === u); if (e) e.rend = 0; });
  (cmd.ts || []).forEach(u => { const e = play.inplay.find(x => x.uid === u); if (e) e.stolen = true; });
  Object.entries(cmd.tc || {}).forEach(([u, names]) => { const e = play.inplay.find(x => x.uid === u); if (e){ giveConds(e, names.filter(n => n !== "Beartrap"), "Combat", true); if (names.includes("Beartrap")) giveConds(e, ["Beartrap"], "Bear Trap", true); } });
  if (cmd.tb) addTk("blood", cmd.tb, "Blood from battle");
  (cmd.th || []).forEach(id => play.hand.push(id));
  msCombat(cmd, false, (net.players[oppId()] && net.players[oppId()].st ? net.players[oppId()].st.inplay : []));
  settleBattle(cmd.dead ? new Set(cmd.dead) : null);
  net.cb = null; net.rp = { lines: cmd.lines || [] };
  renderPlay();
  };
  playBattle(cmd.ev || [], true, () => isOver()).then(fin, fin);
}
/* ---- points ticker (shared, 30 either way) ---- */
const SC_MAX = 30;
// Am I the guest (not the room host)?
const isGuest = () => net.mode === "online" && net.role === "guest";
// Points that have gone toward ME (30 = I lose); the guest sees the score mirrored.
const myPts = () => isGuest() ? -net.score : net.score; // points that have gone toward YOU (30 = you lose)

// Set the shared score, tell the other side, redraw.
function setScore(s, send){
  net.score = Math.max(-SC_MAX, Math.min(SC_MAX, s));
  if (send && net.mode === "online" && net.ready){
    if (net.role === "host") bcast({ t: "score", s: net.score });
    else if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: "score", s: net.score });
  }
  if (play) renderPlay();
}

// Move the score by a number of points toward me.
function bumpPts(dm){ const m = Math.max(-SC_MAX, Math.min(SC_MAX, myPts() + dm)); setScore(isGuest() ? -m : m, true); }

// The opponent's name (remembered after they leave).
function oppName(){ const p = Object.values(net.players)[0]; if (p) net.lastOpp = p.name; return p ? p.name : (net.lastOpp || "Opponent"); }

// HTML for the points ticker bar.
function ptsHTML(){
  const m = myPts(), left = 50 - m / SC_MAX * 50;
  const txt = m > 0 ? `${m} toward you` : m < 0 ? `${-m} toward ${esc(oppName())}` : "Even";
  return `<div class="pts"><div class="ph">Points ticker</div><div class="pbar"><span>You</span><div class="ptrack"><i style="left:${left}%"></i></div><span>${esc(net.mode === "online" ? oppName() : "Opp.")}</span></div>
    <div class="pv">${txt} <span class="stat">(${SC_MAX} loses)</span></div>
    ${net.mode === "online" ? "" : `<div class="pbt"><button data-sc="1">◀ Toward you</button><button data-sc="-1">Toward opp. ▶</button></div><button class="mini rs" data-screset="1">Reset points</button>`}</div>`;
}
/* ---------- match summary ---------- */
let MS = null;
// Run a match-summary update (skipped when the AI is simulating).
const ms = f => { if (MS && !SIM) f(MS); };

// Start a fresh match summary.
function msReset(){ MS = { t0: Date.now(), t1: 0, turns: 0, played: 0, blood: 0, dealt: 0, taken: 0, ptsFor: 0, ptsAgainst: 0, kills: 0, lost: 0, sacs: 0, stolen: 0, combats: 0, bigHit: 0, units: {}, cards: {}, tl: [0], worst: 0, best: 0, maxAtk: { v: 0, name: "" }, maxHp: { v: 0, name: "" }, maxHand: 0, stacked: false, last: 0 }; }

// Sum the numbers in an object.
const msSum = o => Object.values(o || {}).reduce((t, n) => t + (+n || 0), 0);

// Match-summary record for one board card.
function msUnit(u) {
  const e = play.inplay.find(x => x.uid === u);
  if (!e || gOf(e.id) !== "character") return null;
  return MS.units[u] || (MS.units[u] = { id: e.id, dealt: 0, pts: 0, kills: 0 });
}
// R: a combat result (from simulate, or the "res" message); mine: true when I was the attacker
function msCombat(R, mine, theirUnits){
  if (!MS || SIM) return;
  const dealtToThem = mine ? msSum(R.td) : msSum(R.md), takenFromThem = mine ? msSum(R.md) : msSum(R.td);
  MS.dealt += dealtToThem; MS.taken += takenFromThem; MS.combats++;
  MS.bigHit = Math.max(MS.bigHit, dealtToThem);
  const dead = new Set(mine ? [...R.dead] : (R.dead || []));
  MS.kills += (theirUnits || []).filter(e => dead.has(e.uid) && byId[e.id] && gOf(e.id) === "character").length;
  MS.stolen += (mine ? R.mh : R.th || []).length;
  Object.entries(R.dealt || {}).forEach(([u, n]) => { const m = msUnit(u); if (m) m.dealt += n; });
  Object.entries(R.pts || {}).forEach(([u, n]) => { const m = msUnit(u); if (m) m.pts += n; });
  Object.entries(R.kills || {}).forEach(([u, n]) => { const m = msUnit(u); if (m) m.kills += n; });
}

// Track the score swing and Blood each time the board redraws.
function msTrack(){
  if (!MS || SIM || !play || net.mode !== "online") return;
  const pts = myPts();
  if (pts !== MS.last){ if (pts > MS.last) MS.ptsAgainst += pts - MS.last; else MS.ptsFor += MS.last - pts; MS.last = pts; }
  MS.worst = Math.max(MS.worst, pts); MS.best = Math.min(MS.best, pts);
  MS.maxHand = Math.max(MS.maxHand, play.hand.length);
  play.inplay.forEach(e => {
    if (gOf(e.id) !== "character" || e.dying) return;
    const o = effOf(e), nm = byId[e.id].name;
    if ((o.attack || 0) > MS.maxAtk.v) MS.maxAtk = { v: o.attack || 0, name: nm };
    if ((o.health || 0) > MS.maxHp.v) MS.maxHp = { v: o.health || 0, name: nm };
    if (e.att.length >= MAX_ATT) MS.stacked = true;
  });
  if (Math.abs(pts) >= SC_MAX && !MS.t1){ MS.t1 = Date.now(); MS.tl.push(pts); MS.endBlood = play.blood || 0; }
}

// Pick the fun awards shown on the end screen.
function msAccolades(win){
  const m = MS, out = [];
  const add = (n, d) => out.push([n, d]);
  if (m.maxAtk.v >= 10) add("Powerhouse", `${m.maxAtk.name} reached ${m.maxAtk.v} ATK.`);
  if (m.maxHp.v >= 10) add("Iron Wall", `${m.maxHp.name} reached ${m.maxHp.v} Health.`);
  if (m.stacked) add("Fully Loaded", "A character carried the maximum number of attachments.");
  if (win && m.ptsAgainst === 0) add("Flawless", "You won without a single point going toward you.");
  if (win && m.worst >= 12 && m.worst < SC_MAX) add("Comeback Kid", `You won after trailing by ${m.worst}.`);
  if (win && m.worst >= 27 && m.worst < SC_MAX) add("Edge of Defeat", `You survived at ${m.worst} of ${SC_MAX} and still won.`);
  if (win && m.turns <= 6) add("Blitz", `Won in ${m.turns} of your turns.`);
  if (win && m.lost === 0) add("Untouched Field", "You won without losing a character.");
  if (m.kills >= 6) add("Exterminator", `${m.kills} enemy characters defeated.`);
  if (m.bigHit >= 15) add("Heavy Hitter", `One attack dealt ${m.bigHit} damage.`);
  if (m.blood >= 25) add("Blood Baron", `${m.blood} Blood earned.`);
  if (m.played >= 25) add("Card Shark", `${m.played} cards played.`);
  if (m.stolen >= 3) add("Thief", `${m.stolen} cards taken with Terror.`);
  if (m.sacs >= 2) add("Martyr", `${m.sacs} characters sacrificed.`);
  if (m.turns >= 5 && m.combats === 0) add("Pacifist", "You never attacked or blocked.");
  if (m.lost - m.sacs >= 6) add("Meat Grinder", `${m.lost - m.sacs} of your characters fell in battle.`);
  if (m.maxHand >= 10) add("Librarian", `You held ${m.maxHand} cards at once.`);
  if ((m.endBlood || 0) >= 10) add("Hoarder", `${m.endBlood} Blood left unspent.`);
  if (win && m.turns >= 15) add("Long Game", `A ${m.turns}-turn grind.`);
  return out;
}

// HTML for the match summary.
function msHTML(win){
  const m = MS; if (!m) return "";
  const dur = Math.max(1, Math.round(((m.t1 || Date.now()) - m.t0) / 1000)), dm = Math.floor(dur / 60) + ":" + String(dur % 60).padStart(2, "0");
  const units = Object.values(m.units).map(u => Object.assign({ sc: u.dealt + 2 * u.pts + 4 * u.kills }, u)).sort((a, b) => b.sc - a.sc);
  const mvp = units[0] && units[0].sc > 0 ? units[0] : null;
  const stat = (k, v) => `<div class="msi"><b>${v}</b><span>${k}</span></div>`;
  const tl = m.tl.length > 1 ? m.tl : [0, 0];
  const W = 300, H = 70, xs = i => (i / (tl.length - 1)) * W, ys = v => H / 2 + (v / SC_MAX) * (H / 2 - 4);
  const spark = `<svg viewBox="0 0 ${W} ${H}" class="mss" role="img" aria-label="Points ticker over the match"><line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="3 3"/><polyline fill="none" stroke="currentColor" stroke-width="2" points="${tl.map((v, i) => xs(i).toFixed(1) + "," + ys(v).toFixed(1)).join(" ")}"/></svg>`;
  const acc = msAccolades(win);
  return `<div class="msw">
    <div class="msg">
      ${stat("Turns you took", m.turns)}${stat("Match length", dm)}${stat("Points you inflicted", m.ptsFor)}${stat("Points you took", m.ptsAgainst)}
      ${stat("Damage dealt", m.dealt)}${stat("Damage sustained", m.taken)}${stat("Enemy characters defeated", m.kills)}${stat("Your characters lost", m.lost)}
      ${stat("Blood earned", m.blood)}${stat("Cards played", m.played)}${stat("Biggest single attack", m.bigHit + " dmg")}${stat("Cards taken (Terror)", m.stolen)}
    </div>
    <div class="msf">
      <div><h3>Strongest card</h3><p>${m.maxAtk.v ? esc(m.maxAtk.name) + " · " + m.maxAtk.v + " ATK" : "none"}</p></div>
      <div><h3>Toughest card</h3><p>${m.maxHp.v ? esc(m.maxHp.name) + " · " + m.maxHp.v + " HP" : "none"}</p></div>
      <div><h3>MVP</h3><p>${mvp ? esc(byId[mvp.id].name) + `<small>${mvp.dealt} damage · ${mvp.pts} points · ${mvp.kills} kill${mvp.kills === 1 ? "" : "s"}</small>` : "no one stood out"}</p></div>
    </div>
    <h3>Points ticker (your side is up)</h3>${spark}
    <h3>Accolades</h3>
    <div class="msa">${acc.length ? acc.map(([n, d]) => `<div class="acc"><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join("") : `<p class="stat">None this time.</p>`}</div>
  </div>`;
}
/* The end screen is held outside the play screen: it stays up until the player closes it, even if the other player (or the host) leaves or returns to the room. */

/* ====================================================================================================
   END SCREEN: win / lose overlay
   ==================================================================================================== */

let END = null, END_SEEN = false;

// Show the end screen once the game is over and no battle animation is still playing.
function endCheck(){
  // Already dismissed for this result: only reset once the score drops back.
  if (END_SEEN){ if (!isOver()) END_SEEN = false; return; }
  if (SIM || BOT || END || ANIM || !net.mode || !isOver()) return;
  // Build the end screen: did I lose, and the match summary.
  const lose = myPts() >= SC_MAX, on = net.mode === "online";
  END = { lose, on, opp: on ? oppName() : "", ms: on && MS ? msHTML(!lose) : "", left: "", hostGone: false, rk: "" };
  if (on && !net.ai) recordMatch(lose);
  endDraw();
}

// After the winning hit: fade the whole field to black (the end screen then fades in on top of it). Resolves when the screen is black.
function endFade(skip){
  let b = document.getElementById("endblack");
  const white = !!b && !!b.dataset.w;   // coming from the white-out
  if (!b){ b = document.createElement("div"); b.id = "endblack"; b.style.opacity = "0"; document.body.appendChild(b); }
  setTimeout(() => { if (!END && b.isConnected) b.remove(); }, 9000);   // safety net: never leave a black screen behind if no end screen follows
  if (white){
    b.style.clipPath = "none";
    if (skip){ b.style.background = "#000"; return Promise.resolve(); }
    return b.animate([{ backgroundColor: "#fff", offset: 0 }, { backgroundColor: "#fff", offset: .25 }, { backgroundColor: "#000", offset: 1 }], { duration: 2000, easing: "ease-in-out", fill: "forwards" }).finished.catch(() => {}).then(() => { b.style.background = "#000"; });   // the white holds a moment, then dims to black
  }
  if (skip){ b.style.opacity = "1"; return Promise.resolve(); }
  return b.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1300, easing: "ease-in", fill: "forwards" }).finished.catch(() => {});
}

// Draw (or remove) the end overlay.
function endDraw(){
  let el = document.getElementById("endhold");
  if (!END){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement("div"); el.id = "endhold"; el.className = "endin"; document.body.appendChild(el); }   // "endin" fades it in once, not on every redraw
  const E = END, btn = !E.on ? "Reset points" : (E.hostGone ? "Leave room" : "Back to the room");
  el.innerHTML = `<div class="ov scoreov on ${E.lose ? "lose" : "win"}${E.ms ? " ms" : ""}" role="alertdialog"><h2>${E.lose ? "You lose" : (E.on ? esc(E.opp) + " loses" : "Opponent side loses")}</h2><p>${E.lose ? "30 points went toward you." : "30 points went toward them. You win!"}</p>${E.left ? `<p class="stat">${esc(E.left)} left the room.</p>` : ""}${E.rk ? `<p class="rkl">${E.rk}</p>` : ""}${E.ms}<div class="row"><button class="go big" data-endclose="1">${btn}</button></div></div>`;
}

// Close the end screen.
function endClose(){
  const E = END; if (!E) return;
  const blk = document.getElementById("endblack"); if (blk) blk.remove();
  END = null; END_SEEN = true; endDraw();
  if (!E.on){ setScore(0, true); return; }
  if (E.hostGone){ leaveRoom(); return; }
  if (net.g && net.g.phase === "play") toLobby();
}

// Old score overlay (kept as a no-op; the end screen replaced it).
function scoreOvHTML(){ return ""; }
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("[data-endclose]")) endClose(); });
/* hand: cards overlap more the more there are; hovering one lifts it out */

/* ====================================================================================================
   RENDERING THE PLAY AREA
   ==================================================================================================== */

function fanHand(){
  const h = document.getElementById("myhand"); if (!h) return;
  const cs = [...h.children].filter(c => c.classList.contains("c")), n = cs.length; if (!n) return;
  // ov = how far each card overlaps the one before it (tighter with more cards).
  const w = cs[0].offsetWidth || 124, avail = h.clientWidth, gap = 10;
  const ov = n > 1 ? Math.max(-(w - 34), Math.min(gap, (avail - n * w) / (n - 1))) : 0;
  // Each card tilts a little and sags toward the edges to make a fan.
  const spread = Math.min(2, 8 / n), mid = (n - 1) / 2;
  cs.forEach((c, k) => { c.style.marginLeft = k ? ov.toFixed(1) + "px" : "0"; c.style.setProperty("--rot", ((k - mid) * spread).toFixed(2) + "deg"); c.style.setProperty("--ty", (Math.abs(k - mid) ** 2 * (n > 7 ? 0.5 : 1.2)).toFixed(1) + "px"); c.style.zIndex = k + 1; });
}

// Redraw the whole play area (board, hand, opponent, menus). Deferred while a battle animation runs.
function renderPlay(){
  // Not while the AI is only trying moves on copies.
  if (SIM) return;
  // A battle animation is playing: redraw once it ends.
  if (ANIM){ ANIM.dirty = true; return; }
  if (!net.mode) return;
  // Per-redraw bookkeeping: match stats, end screen, music.
  msTrack();
  endCheck();
  musCheck();
  // An invalid deck can't be played: show why instead of the board.
  const pr = problems();
  if (pr.length){
    closeModals();
    $("#msg").textContent = "";
    $("#zones").innerHTML = `<div class="picker"><h2 style="margin-top:0">This deck can't be played yet</h2><ul>${pr.map(t => `<li>${esc(t)}</li>`).join("")}</ul><button id="gb" class="go">Back to deck builder</button> <button data-leave="1">Change mode</button></div>`;
    return;
  }
  if (!play){ closeModals(); return; }
  // In the lobby: show the waiting screen instead of the board.
  if (net.mode === "online" && net.g && net.g.phase === "lobby"){ renderWait(); $("#ts").classList.remove("on"); $("#cbm").classList.remove("on"); renderRoomBar(); return; }
  // Clean up first: destroyed items go, characters at 0 Health start dying.
  for (let i = play.inplay.length - 1; i >= 0; i--){ const it = play.inplay[i]; if (gOf(it.id) !== "character" && (it.dmg || 0) > 0 && (effOf(it).health || 0) <= 0){ toast("Destroyed", `${byId[it.id].name} was destroyed.`, "info"); resolveDeath(i); } }
  play.inplay.forEach(e => { if (!e.dying && gOf(e.id) === "character" && (effOf(e).health || 0) <= 0) startDeath(e, true); });
  // A change in Pack size triggers the grow / shrink glow.
  const pn = packCount(), pp = play.lastPacks || 0;
  play.packFx = null;
  if (pn > pp && pn >= 2) play.packFx = { k: "grow", from: packScale(pp), peak: +(packScale(pn) + packBoost(pn)).toFixed(3) };
  else if (pn < pp && pn >= 1) play.packFx = { k: "shrink", from: packScale(pp), peak: +Math.max(0.8, packScale(pn) - packBoost(pn + 1) * 0.8).toFixed(3) };
  play.lastPacks = pn;
  play.aura = allPack();
  // The manual +/- resource buttons only exist offline.
  const lk = net.mode === "online" ? "disabled" : "";
  const tk = (k,label) => `<div class="tk ${k}"><span class="l">${label}</span><button data-t="${k}" data-d="-1" ${lk} aria-label="Decrease ${label}">−</button><b>${play[k] || 0}</b><button data-t="${k}" data-d="1" ${lk} aria-label="Increase ${label}">+</button></div>`;
  const grp = g => `<div class="dgrp">
      <button class="deck ${play.pile[g].length ? "" : "none"}" data-draw="${g}" aria-label="Draw from the ${gl(g).toLowerCase()} deck"><span class="dn">${gl(g)}</span><b>${play.pile[g].length}</b><span class="dh">${inGame() ? "turn start only" : "click to draw"}</span></button>
      <button class="mini" data-shuf="${g}">Shuffle deck</button></div>`;
  // The board: room bar, opponent, turn bar, my characters and items, my hand, and the right-hand panel (decks, resources, log).
  $("#zones").innerHTML = `<div class="arena${net.mode === "online" && inGame() && !canAct() ? " waiting" : ""}">
    <div class="roombar" id="roombar"></div>
    <div class="acenter">
      <div id="opps"></div>
      <div class="tbarrow" id="turnrow"></div>
      ${play.tgt ? `<div class="pickbar tg"><span>${esc(tgtPrompt())}</span><button data-tgtcancel="1">Cancel</button></div>` : ""}
      ${play.atkSel ? `<div class="pickbar atk"><span>Choose attackers in the order they should attack (${play.atkSel.length} chosen). After attacking, your turn ends.</span><button class="go" data-atkgo="1" ${play.atkSel.length ? "" : "disabled"}>Declare attack</button><button data-atkcancel="1">Cancel</button></div>` : ""}
      ${play.pick ? `<div class="pickbar"><span>Choose a character in play to attach <b>${esc(byId[zl(play.pick.zone)[play.pick.i]].name)}</b> to.</span><button data-pickcancel="1">Cancel</button></div>` : ""}
      <div class="sub">${net.mode === "online" ? "Your side" : "In Play"}</div>
      <div class="fieldrow"><div class="table">${play.inplay.map((e,i) => gOf(e.id) === "character" ? slotHTML(e,i) : "").join("")}${eslots(play.inplay.filter(e => gOf(e.id) === "character").length, itemCount() > 0)}</div>
      <div class="items" title="Items are only hit by attacks you don't block; oldest (left) first"><span class="il">Items ${itemCount()}/${MAX_ITEMS}</span>${play.inplay.map((e,i) => [e,i]).filter(([e]) => gOf(e.id) !== "character").map(([e,i]) => slotHTML(e,i)).join("")}${islots(itemCount())}</div></div>
      <div class="sub">Hand (${play.hand.length})</div>
      <div class="hand" id="myhand">${play.hand.map((id,i) => cardHTML(id,i,"hand")).join("") || `<span class="empty">Your hand is empty. Click a deck to draw.</span>`}</div>
    </div>
    <aside class="aright">
    <div class="aleft">${grp("character")}${grp("other")}
      <div class="dgrp"><button class="disc" data-view="1" aria-label="Discard pile"><span>Discard</span><b>${play.discard.length}</b></button></div>
      <div class="tickers">${tk("blood","Blood")}<div class="tk dryc"><span class="l">Dry Blood</span><button data-t="dryc" data-d="-1" ${lk} aria-label="Decrease Dry Blood">−</button><b>${play.dryCur || 0}<small>/${play.dryMax || 0}</small></b><button data-t="dryc" data-d="1" ${lk} aria-label="Increase Dry Blood">+</button>${net.mode === "online" ? "" : `<button data-refill="1" title="Refill Dry Blood">↻</button>`}</div>${tk("dry","Token")}</div>
      <div class="drawn">${play.doubleNext ? `<span class="chip2">Double armed</span>` : ""}${play.control ? `<span class="chip2">Control armed</span>` : ""}${play.persuade ? `<span class="chip2">Persuade active</span>` : ""}${net.mode === "online" ? "" : `<label class="stat">Cards per draw<br><input type="number" id="n" value="${play.drawN || 1}" min="1" max="15" style="width:70px"></label><button id="reset" class="danger mini">New game</button><button data-newturn="1" class="mini">Next turn (solo)</button>`}</div>
    </div>
    ${net.mode === "online" ? "" : ptsHTML()}<div id="evlog"></div></aside>
  </div>${scoreOvHTML()}`;
  // Then the pop-ups and panels that sit on top of the board.
  updateLock();
  renderEm();
  renderTs();
  renderCb();
  renderDiscard();
  renderCm();
  renderClone();
  renderRoomBar(); renderOpps(); renderLog();
  // Lay out the hand fan and fit the cards to the window.
  fanHand(); fitSoon();
  // One-shot animation flags are used up.
  play.fresh = null;
  play.shake = null;
  // Tell the other player what my board looks like now.
  netQueue();
}

// Card detail modal.
function renderCm(){
  const m = $("#cm"), e = (cmI !== null && play) ? play.inplay[cmI] : null;
  if (!e || !(e.cond || []).length){ cmI = null; m.classList.remove("on"); return; }
  const c = byId[e.id], o = effOf(e), cd = e.cond || [];
  m.querySelector(".box").innerHTML = `<h2>${esc(c.name)}: Conditions</h2>`
    + [...new Set(cd)].map(n => { const q = cd.filter(x => x === n).length; return `<div class="cmi"><div><b>${esc(n)}${q > 1 ? " ×" + q : ""}</b><span>${esc(condText(n, e, o))}</span></div></div>`; }).join("")
    + `<div class="row"><button data-cmclose="1">Close</button></div>`;
  m.classList.add("on");
}

// List of readable condition descriptions for a card.
function condTexts(e){
  const cd = e.cond || [], o = effOf(e);
  return [...new Set(cd)].map(n => [n + (cd.filter(x => x === n).length > 1 ? " ×" + cd.filter(x => x === n).length : ""), condText(n, e, o)]);
}

/* ====================================================================================================
   CONDITIONS, INFLICTIONS AND THE ACTION MENU
   ==================================================================================================== */

function giveConds(ent, names, why, quiet){
  const o = effOf(ent), nm = byId[ent.id].name, added = [], blocked = [];
  names = names.filter(n => n !== "Beartrap" || why === "Bear Trap");
  names.forEach(n => { if (immuneTo(o, n)) blocked.push(n); else { ent.cond = ent.cond || []; ent.cond.push(n); added.push(n); } });
  if (added.length){ play.gloom = { i: play.inplay.indexOf(ent), t: Date.now() }; if (!quiet) toast(why, `${nm} is now afflicted with ${[...new Set(added)].map(n => n + (added.filter(x => x === n).length > 1 ? " ×" + added.filter(x => x === n).length : "")).join(", ")}.`, "info"); }
  if (blocked.length && !added.length && !quiet) toast("Immune", `${nm} is immune to ${[...new Set(blocked)].join(", ")}.`);
  if (added.length){
    sparkMold(ent.uid);
    const cnt = {}; added.forEach(n => { cnt[n] = (cnt[n] || 0) + 1; });
    netEvent({ k: "cond", id: ent.id, conds: Object.entries(cnt).map(([n, k]) => k > 1 ? n + " ×" + k : n), why });
  }
  if (blocked.length && !added.length) netEvent({ k: "immune", id: ent.id, conds: [...new Set(blocked)] });
}
/* A character that is immune to a condition (e.g. from a prescription like Vaccine) can't be carrying it: purge matching conditions. */
function purgeImmune(e, quiet){
  if (!e || !(e.cond || []).length) return [];
  const o = effOf(e), gone = [];
  e.cond = e.cond.filter(n => { if (immuneTo(o, n)){ gone.push(n); return false; } return true; });
  if (gone.length && !quiet){ toast("Cured", `${byId[e.id].name} was cured of ${[...new Set(gone)].join(", ")}.`, "info"); netEvent({ k: "cure", id: e.id, conds: [...new Set(gone)] }); }
  return gone;
}

// Queue the mold animation on a card.
function sparkMold(u){ play.moldq = { uid: u, t: Date.now() }; }

// Release inflictions on a card that is leaving the board (return them to their owners).
function dropInf(e){
  (e.inf || []).forEach(x => { if (x.by === me()) pushDiscard(x.id); else sendCmd(x.by, { k: "infend", id: x.id }); });
  e.inf = [];
}

// Give a character the conditions its prescription card carries (condition_add), skipping duplicates and anything it is immune to.
function applyHostCond(aid, e, si){
  const eo = effOf(e), name = byId[e.id].name, pn = byId[aid].name, added = [], blocked = [];
  asArr(byId[aid].condition_add).map(cnorm).filter(n => n && n !== "Beartrap").forEach(n => {
    if ((e.cond || []).includes(n)) return;
    if (immuneTo(eo, n)) blocked.push(n); else { e.cond = e.cond || []; e.cond.push(n); added.push(n); }
  });
  if (added.length) play.gloom = { i: si, t: Date.now() };
  if (blocked.length) toast("Immune", `${name} is immune to ${blocked.join(", ")}, so ${pn} did not afflict it.`);
  else if (added.length) toast(pn, `${name} is now afflicted with ${added.join(", ")}.`, "info");
}

// Open the action menu for the selected hand / board card.
function openAct(){
  let id, entry = null;
  if (act.zone === "inplay"){ entry = play.inplay[act.i]; id = entry && entry.id; }
  else if (act.zone === "att"){ const p = play.inplay[act.p]; id = p && p.att[act.i]; }
  else id = zl(act.zone)[act.i];
  if (!id) return closeAct();
  const c = byId[id];
  const quick = isQuick(id);
  const opts = {
    hand: [[quick ? "activate" : "play", quick ? "Activate" : "Play"]],
    inplay: [...(c.type === "character" ? [["sacrifice","Sacrifice"]] : [])],
    att: [],
    discard: [...(c.type === "enchantment" ? [] : [["hand","Back to hand"]]),[quick ? "activate" : "play", quick ? "Activate" : "Play"]]
  }[act.zone];
  const attl = (entry && entry.att.length) ? `<div class="attl"><h3>Attached cards (${entry.att.length})</h3>${entry.att.map((a,k) => `<button data-att="${k}"><img src="${esc(img(byId[a]))}" alt=""><span>${esc(byId[a].name)} <span class="stat">${cap(byId[a].type)}</span></span></button>`).join("")}</div>` : "";
  let cg = "";
  let infl = "";
  if (entry && (entry.inf || []).length) infl = `<div class="attl"><h3>Inflictions</h3>${entry.inf.map((x, k) => `<div class="infr"><div><b>${esc(inflName(x.id))}${x.by === me() ? "" : " (cast by " + esc(((net.players[x.by] || {}).name) || "an opponent") + ")"}</b><span>${esc(INFL[inflName(x.id)] || "")}</span></div>${x.by === me() && x.exp === undefined ? `<button class="mini" data-do="infoff:${k}">Turn off &amp; discard</button>` : ""}</div>`).join("")}</div>`;
  const note2 = entry && entry.att.length ? `<p class="stat" style="margin:6px 0 0;font-size:12px">If this card leaves play, its attached cards go to the discard pile.</p>` : "";
  $("#am .box").innerHTML = `<img src="${esc(img(c))}" alt="${esc(c.name)}"><h2>${esc(c.name)}</h2><div class="sw">${statsHTML(c, entry ? effOf(entry) : null, act.zone === "att" ? 0 : packSur(id, act.zone))}</div>${attl}${infl}${cg}
    <div class="row">${opts.map(([k,l]) => `<button data-do="${k}" class="${k === "play" || k === "activate" ? "go" : ""}">${l}</button>`).join("")}${act.zone === "att" ? `<button data-do="back">Back</button>` : ""}<button data-do="close">Cancel</button></div>${note2}`;
  $("#am").classList.add("on");
}

// Close the action menu.
function closeAct(){ act = null; $("#am").classList.remove("on"); }

// Run a button from the action menu (play, attach, discard, sacrifice, etc.).
function doAct(k){
  if (k === "close") return closeAct();
  if (k === "back"){ act = { zone: "inplay", i: act.p }; return openAct(); }
  const z = act.zone;
  const fail = (title, detail) => { play.shake = { zone: z, i: act.i }; toast(title, detail); closeAct(); renderPlay(); };
  if (k === "sacrifice"){
    const ent = play.inplay[act.i];
    if (z !== "inplay" || !ent || gOf(ent.id) !== "character" || ent.dying) return closeAct();
    if (play.sacUsed) return fail("Already sacrificed", "You can only sacrifice once per turn.");
    if ((play.turnPlays || 0) > 0) return fail("Too late to sacrifice", "You can only sacrifice before playing any card this turn.");
    play.sacUsed = true; play.noPlay = true; ms(m => m.sacs++);
    toast("Sacrifice", `${byId[ent.id].name} was sacrificed. No cards can be played for the rest of this turn.`, "info");
    startDeath(ent, false); closeAct(); renderPlay(); return;
  }
  if (k.startsWith("infoff:")){
    const ent = play.inplay[act.i], x = ent && (ent.inf || [])[+k.slice(7)];
    if (x && x.by === me()){ ent.inf.splice(+k.slice(7), 1); pushDiscard(x.id); toast(inflName(x.id), `Turned off on ${byId[ent.id].name} and discarded.`, "info"); }
    closeAct(); renderPlay(); return;
  }
  if (k.startsWith("uncond:")){
    const ent = play.inplay[act.i];
    closeAct(); renderPlay(); return;
  }
  if (z === "att"){
    const p = play.inplay[act.p];
    if (!p) return closeAct();
    sendTo(p.att.splice(act.i, 1)[0], k);
    closeAct(); renderPlay(); return;
  }
  const list = zl(z);
  if (z === "inplay"){
    const ent = play.inplay[act.i], eo = ent && gOf(ent.id) === "character" ? effOf(ent) : {}, ens = eo.innate_enchantment || [];
    if (k === "discard" && ens.includes("Parallel")) return fail("Parallel", "A character with Parallel can't be discarded from the field.");
    if (k === "die"){
      if (!ent) return closeAct();
      if (ent.dying) return closeAct();
      if (gOf(ent.id) === "character"){ startDeath(ent, false); closeAct(); renderPlay(); }
      else { resolveDeath(act.i); closeAct(); renderPlay(); }
      return;
    }
    const e = play.inplay.splice(act.i, 1)[0];
    sendTo(e.id, k);
    e.att.forEach(pushDiscard);
    dropInf(e);
    closeAct(); renderPlay(); return;
  }
  const id = list[act.i];
  if (k === "activate" && byId[id].type === "infliction"){
    if (play.tgt) return fail("Already choosing", "Finish or cancel the current infliction first.");
    const lack = costLack(id);
    if (lack) return fail(lack[0], lack[1]);
    if (!tgtAny(id)) return fail("No target", inflKey(id) === "hypnotize" ? "Hypnotize needs an enemy character in play." : "Put a character in play to afflict first.");
    play.tgt = { zone: z, i: act.i, id };
    closeAct(); viewD = null; renderPlay(); return;
  }
  if (k === "activate"){
    if (play.cast) return fail("Wait for the current card", "Let the current effect finish first.");
    const lack = costLack(id);
    if (lack) return fail(lack[0], lack[1]);
    if (byId[id].type === "envision"){ const chk = envCheck(id, z, act.i); if (chk) return fail(chk[0], chk[1]); }
    payCost(id);
    list.splice(act.i, 1);
    netEvent({ k: "cast", id });
    if (byId[id].type === "envision") envApply(id);
    closeAct(); startCast(id); renderPlay(); return;
  }
  if (k === "play"){
    if (isAttach(id)){
      if (!hasChar()) return fail(`Can not play ${cap(byId[id].type)} without a viable character card`, "Play a character card first.");
      if (!play.inplay.some(e => gOf(e.id) === "character" && e.att.length < MAX_ATT)) return fail("No character can take it", `Every character in play already has ${MAX_ATT} attachments.`);
      const lack = costLack(id);
      if (lack) return fail(lack[0], lack[1]);
      play.pick = { zone: z, i: act.i };
      closeAct(); viewD = null; renderPlay(); return;
    }
    if (byId[id].type === "item"){
      if (itemCount() >= MAX_ITEMS) return fail("Item slots are full", `Only ${MAX_ITEMS} item cards can be in play at once.`);
      if (charCount() > 3) return fail("Too many characters", "With an item in play you can have at most 3 characters. Remove one first.");
    } else if (gOf(id) === "character" && charCount() >= maxChars()) return fail("Field is full", `You can have ${maxChars()} characters in play${itemCount() ? " while you have an item (4 with no items)" : ""}.`);
    const lack = costLack(id, z);
    if (lack) return fail(lack[0], lack[1]);
    payCost(id, z);
    list.splice(act.i, 1);
    play.inplay.push({ id, att: [], cond: [], inf: [], uid: uid(), born: inGame() ? net.g.n : -1 });
    netEvent({ k: "play", id });
  } else {
    list.splice(act.i, 1);
    sendTo(id, k);
  }
  closeAct(); renderPlay();
}
/* ---- draws + envision cards ---- */
function drawn(id){
  play.hand.push(id); play.lastDrawn = id; sfxCardDraw();
  if (play.doubleNext){ play.doubleNext = false; play.hand.push(id); toast("Double", `${byId[id].name} was duplicated.`, "info"); }
}

// Find cards in the draw piles that match a test; returns their positions, or null if there are none.
function takeFrom(pred){
  const c = [];
  ["character","other"].forEach(g => play.pile[g].forEach((id, i) => { if (byId[id] && pred(byId[id])) c.push([g, i]); }));
  if (!c.length) return null;
  const [g, i] = c[Math.random() * c.length | 0];
  return play.pile[g].splice(i, 1)[0];
}

// How many cards in the decks match a condition.
const countPile = pred => ["character","other"].reduce((t, g) => t + play.pile[g].filter(id => byId[id] && pred(byId[id])).length, 0);
// Choices for the Decide envision card.
const DECIDE = [["c1","Character ★", c => c.type === "character" && c.tier === 1 && !c.token],["c2","Character ★★", c => c.type === "character" && c.tier === 2 && !c.token],["c3","Character ★★★", c => c.type === "character" && c.tier === 3 && !c.token],["enchantment","Enchantment", c => c.type === "enchantment"],["infliction","Infliction", c => c.type === "infliction"],["envision","Envision", c => c.type === "envision"],["prescription","Prescription", c => c.type === "prescription"]];
// A card's Blood + Dry Blood cost together (Retaliate compares these).
const cardCost = id => (+byId[id].blood_cost || 0) + (+byId[id].dry_blood_cost || 0);
// Match cards of the same type / tier.
const sameKind = c0 => c => c.type === c0.type && (c0.type !== "character" || c.tier === c0.tier) && !c.token;

// Index in the hand of the most recently drawn card (Backtrack puts it back), ignoring index `skip`.
function backIdx(skip){ const h = play.hand; for (let i = h.length - 1; i >= 0; i--) if (h[i] === play.lastDrawn && i !== skip) return i; return -1; }

// Opponents whose boards are known.
function peerTargets(){ return Object.keys(net.players).filter(pid => net.players[pid].st); }

// Can this Envision / Infliction card be used right now? Returns the reason if not.
function envCheck(id, z, i){
  const k = inflKey(id.replace("envision-", "infliction-"));
  const skip = z === "hand" ? i : -1;
  if (k === "backtrack"){
    if (!play.lastDrawn) return ["Nothing to backtrack", "You haven't drawn a card yet."];
    const bi = backIdx(skip);
    if (bi < 0) return ["Nothing to backtrack", `${byId[play.lastDrawn].name} (your last draw) is no longer in your hand.`];
    if (!countPile(sameKind(byId[play.lastDrawn]))) return ["No replacement", "Your decks have no card of the same type left."];
  }
  if (k === "decide" && !DECIDE.some(d => countPile(d[2]))) return ["Decks are empty", "There's nothing left to choose from."];
  if (k === "control" && !inGame()) return ["Needs a match", "Control only works in an online match, where there's an enemy team to block."];
  if (k === "control" && play.control) return ["Already armed", "Control is already active for this turn's attack."];
  if (k === "persuade" && play.persuade) return ["Already active", "Persuade is already protecting you this turn."];
  if (k === "double" && play.doubleNext) return ["Already armed", "Your next draw is already set to duplicate."];
  if (k === "peer" && !peerTargets().length) return ["No one to peer at", "Peer needs an opponent in the room."];
  if (k === "plague" && !(play.inplay.some(e => gOf(e.id) === "character") || oppChars().length)) return ["No characters", "There are no characters in play to infect."];
  if (k === "promote" && !play.inplay.some(e => gOf(e.id) === "character" && byId[e.id].tier === 1 && !e.dying)) return ["No Tier 1 characters", "You have no active Tier 1 characters."];
  if (k === "reset" && !play.discard.some(x => byId[x] && byId[x].type !== "character")) return ["No Other cards discarded", "There are no discarded Other cards to reshuffle."];
  if (k === "dissolve" && !peerTargets().length) return ["No one to dissolve", "Dissolve needs an opponent in the room."];
  if (k === "ignite" && !inGame()) return ["Needs a match", "Ignite only works in an online match."];
  if (k === "ignite" && ignActive()) return ["Already burning", "Ignite is already active this turn."];
  if (k === "forsee" && !play.pile.character.length && !play.pile.other.length) return ["Decks are empty", "There are no cards left to see."];
  if (k === "retaliate" && !play.inplay.length && !Object.values(net.players).some(o => o.st && o.st.inplay.length)) return ["Nothing in play", "No active cards to discard."];
  return null;
}

// Plague: give every character a condition.
function applyPlague(n, quiet){
  play.inplay.forEach(e => { if (gOf(e.id) === "character" && !e.dying && (n === "Parasitic" || !(e.cond || []).includes(n))) giveConds(e, [n], "Plague", true); });
}

// Discard a board card without it 'dying' (Retaliate): attachments go too, and a 3-upgrade character still pays out its Dry Blood.
function discardEnt(e){
  /* Retaliate discards (not kills), but a character that would give Dry Blood on death still gives it */
  const bc = byId[e.id];
  if (bc && bc.type === "character" && !bc.token && (+bc.blood_cost || 0) > 0 && !hasInf(e, "reduce") && e.att.length >= MAX_ATT){ addDryMax(1, bc.name + " had 3 upgrades"); addTk("dry", 1, bc.name + " had 3 upgrades"); }
  pushDiscard(e.id); e.att.forEach(pushDiscard); dropInf(e);
}

// Apply an Envision card's effect.
function envApply(id){
  const k = id.replace("envision-", ""), nm = byId[id].name;
  if (k === "backtrack"){
    const bi = backIdx(-1), old = play.hand.splice(bi, 1)[0];
    const nid = takeFrom(sameKind(byId[old]));
    pushDiscard(old);
    if (nid){ const b0 = play.hand.length; drawn(nid); play.fresh = { from: b0 }; toast(nm, `Discarded ${byId[old].name} and drew ${byId[nid].name}.`, "info"); }
  } else if (k === "control"){ play.control = true; toast(nm, "Your next attack this turn: you choose how the enemy blocks.", "info"); }
  else if (k === "decide"){ play.em = { k: "decide" }; }
  else if (k === "double"){ play.doubleNext = true; toast(nm, "Your next draw will be duplicated.", "info"); }
  else if (k === "peer"){ peerTargets().forEach(pid => sendCmd(pid, { k: "peer" })); toast(nm, "Looking at your opponent's hand…", "info"); }
  else if (k === "persuade"){ play.persuade = true; toast(nm, "Until your next turn, damage against you and your characters becomes Blood (damage you deal still goes through).", "info"); }
  else if (k === "plague"){
    const plagueable = CONDS.filter(x => x !== "Beartrap"), n = plagueable[Math.random() * plagueable.length | 0];
    applyPlague(n);
    Object.keys(net.players).forEach(pid => sendCmd(pid, { k: "plague", n }));
    toast(nm, `Every character in play was afflicted with ${n} (unless immune).`, "info");
  } else if (k === "promote"){
    const n = play.inplay.filter(e => gOf(e.id) === "character" && byId[e.id].tier === 1 && !e.dying).length;
    addTk("blood", n, `Promote: ${n} Tier 1 character${n === 1 ? "" : "s"}`);
  } else if (k === "reset"){
    const ch = play.discard.filter(x => byId[x] && byId[x].type !== "character");
    play.discard = play.discard.filter(x => !(byId[x] && byId[x].type !== "character"));
    ch.forEach(x => play.pile.other.push(x)); shuffle(play.pile.other);
    toast(nm, `${ch.length} discarded Other card${ch.length === 1 ? "" : "s"} reshuffled into the deck.`, "info");
  } else if (k === "dissolve"){
    peerTargets().forEach(pid => sendCmd(pid, { k: "dissolve" }));
    toast(nm, "Their Blood is reduced by the number of cards in their hand.", "info");
  } else if (k === "ignite"){
    play.ignN = [net.g.n]; Object.keys(net.players).forEach(pid => sendCmd(pid, { k: "ignite", n: net.g.n + 1 }));
    toast(nm, "Every character must attack this turn (and on the opponent's next turn). Those that can't are killed.", "info");
  } else if (k === "taste"){
    let n = play.inplay.filter(e => gOf(e.id) === "character" && !e.dying && (e.cond || []).length).length + oppChars().filter(o => (o.e.cond || []).length).length;
    addTk("blood", n, `Taste: ${n} afflicted character${n === 1 ? "" : "s"}`);
  } else if (k === "forsee"){
    play.em = { k: "forsee", ch: play.pile.character.slice(-3).reverse(), ot: play.pile.other.slice(-3).reverse() };
  } else if (k === "retaliate"){
    const sides = [];
    const top = (arr, f) => { if (!arr.length) return []; const m = Math.max(...arr.map(x => cardCost(x.id))); return arr.filter(x => cardCost(x.id) === m); };
    const mine = top(play.inplay.filter(e => !e.dying));
    if (mine.length) sides.push({ owner: "me", label: "Your team", c: mine.map(e => ({ uid: e.uid, id: e.id })), pick: mine.length === 1 ? 0 : null });
    Object.entries(net.players).forEach(([pid, o]) => { if (!o.st) return; const t = top(o.st.inplay.filter(e => !e.dying && byId[e.id])); if (t.length) sides.push({ owner: pid, label: o.name + "'s team", c: t.map(e => ({ uid: e.uid, id: e.id })), pick: t.length === 1 ? 0 : null }); });
    play.em = { k: "retaliate", sides };
    if (sides.every(sd => sd.pick !== null)) retaliateGo();
  }
}

// Resolve Retaliate: discard the most expensive card (Blood + Token cost) from each team.
function retaliateGo(){
  const em = play.em; play.em = null;
  const out = [];
  em.sides.forEach(sd => {
    const t = sd.c[sd.pick];
    if (sd.owner === "me"){ const i = play.inplay.findIndex(e => e.uid === t.uid); if (i >= 0){ const e = play.inplay.splice(i, 1)[0]; discardEnt(e); out.push(byId[e.id].name); } }
    else { sendCmd(sd.owner, { k: "rdisc", uid: t.uid }); const o = net.players[sd.owner]; if (o && o.st) o.st.inplay = o.st.inplay.filter(e => e.uid !== t.uid); out.push(byId[t.id].name); }
  });
  toast("Retaliate", out.length ? "Discarded: " + out.join(", ") + "." : "Nothing was discarded.", "info");
  if (act) closeAct();
  renderPlay();
}

// Envision prompt dialog (Decide, Persuade, Peer, Retaliate...).
function renderEm(){
  const m = $("#em"), em = play && play.em;
  if (em && em.leaving) return;
  if (!em){ m.classList.remove("on"); return; }
  const b = m.querySelector(".box"); b.classList.remove("shimmer");
  if (em.k === "decide"){
    b.innerHTML = `<h2>Decide</h2><p class="stat">Choose the type of card to draw.</p><div class="emg">${DECIDE.map(([key, lab, f]) => { const n = countPile(f); return `<button data-emd="${key}" ${n ? "" : "disabled"}>${lab}<small>${n ? n + " in decks" : "none left"}</small></button>`; }).join("")}</div>`;
  } else if (em.k === "persuade"){
    b.innerHTML = `<h2>Persuade</h2><p class="stat">Damage against you and your characters becomes Blood. How much Blood do you receive?</p><div class="emn"><button data-emn="-1">−</button><b>${em.n}</b><button data-emn="1">+</button></div><div class="row" style="justify-content:center"><button class="go" data-emok="1">Receive ${em.n} Blood</button></div>`;
  } else if (em.k === "peer"){
    const card = id => byId[id] ? `<div class="pc"><img src="${esc(img(byId[id]))}" alt="${esc(byId[id].name)}"><span>${esc(byId[id].name)}</span></div>` : "";

    b.innerHTML = `<h2>Forsee</h2><div class="ems"><h3>Character deck: top ${em.ch.length} (next draw first)</h3><div class="phand">${em.ch.map(card).join("") || `<span class="stat">Empty</span>`}</div></div><div class="ems"><h3>Other deck: top ${em.ot.length} (next draw first)</h3><div class="phand">${em.ot.map(card).join("") || `<span class="stat">Empty</span>`}</div></div><div class="row" style="justify-content:center"><button data-emclose="1">Close</button></div>`;

$("#em").onclick = e => {
