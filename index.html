<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131921">
<title>Prescription Deck Manager</title>
<!--
  Prescription Deck Manager: a single-file web app for a custom card game.

  Layout of this file:
    1. style block   all CSS (base, deck builder, play area, effects, theme, play layout)
    2. body          page structure: menu, deck builder, play screen, rules, overlays
    3. script block all JavaScript, in this order:
         basics + saved data -> card data -> deck builder -> card rules and text ->
         stats (effOf) -> card HTML -> board slots -> turns and combat (simulate, playBattle) ->
         points + end screen -> rendering -> envision / infliction cards -> menu, music, fit, settings ->
         online play (PeerJS) -> events -> AI opponent (runs in a hidden copy of this page)

  Data lives next to this file: cards.json, art/ and music/. Decks and settings are kept in localStorage.
-->
<style>

/* ===== Base: colour variables, reset, buttons, header and nav ===== */
:root{color-scheme:dark;--paper:#131921;--panel:#1c2531;--ink:#dce4ec;--mute:#8d9bab;--line:#2f3b4a;--amber:#d99a45;--red:#e8786f;--teal:#3fa793}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
h1{font:700 22px Georgia,serif;margin:0}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--teal)}
button.go{background:var(--teal);border-color:var(--teal);color:#fff}
button.danger{color:var(--red)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;border-bottom:2px solid var(--ink);background:var(--panel)}
header .sp{flex:1}
nav button{border-radius:0;margin-left:-1px}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select,input[type=text],input[type=number],input[type=search]{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 8px}

/* ===== Page layout: deck builder grid and side panel ===== */
main{padding:20px;position:relative;z-index:1}
.build{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.build{grid-template-columns:1fr}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;position:sticky;top:10px}
@media(max-width:760px){.side{position:static}}
.side h2{font:700 17px Georgia,serif;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dl{list-style:none;margin:8px 0;padding:0;max-height:340px;overflow:auto;border-top:1px solid var(--line)}
.dl li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.dl .t{color:var(--mute);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.chips button.on{background:var(--amber);border-color:var(--amber);color:#fff}

/* ===== Deck builder: card grid, card tiles, copy counters ===== */
.gh{grid-column:1/-1;margin:10px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line);font:700 15px Georgia,serif}
.pk{margin-left:6px;color:var(--teal);font:700 11px "Segoe UI",sans-serif;letter-spacing:.5px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.c{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.c.in{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.c img{display:block;width:100%;height:auto;cursor:zoom-in;background:#d5ddd8;min-height:60px}
.meta{padding:6px 8px}
.nm{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.ct button{padding:2px 10px}
.ct b{min-width:1.5em;text-align:center}
.play .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.stat{color:var(--mute)}
#msg{min-height:1.4em;color:var(--red);margin:4px 0 12px}

/* ===== Play area basics: headings, hand, resource tickers ===== */
.play h2{font:700 17px Georgia,serif;margin:18px 0 8px}
.hand{display:flex;flex-wrap:wrap;gap:12px}
.hand .c{width:150px}
.hand.small .c{width:100px}
.hand .meta{display:flex;gap:6px;flex-direction:column}
.empty{color:var(--mute);font-style:italic}
button:disabled{opacity:.4;cursor:not-allowed}
.warn{color:var(--red)}
.sub{color:var(--mute);margin:12px 0 6px}
.zone{margin-bottom:28px}
.st{display:block;color:var(--amber);font-size:12px;min-height:1.2em;letter-spacing:1px}
.req{list-style:none;margin:8px 0;padding:0;font-size:13px}
.req li{margin:2px 0}
.ok{color:var(--teal)}
.tickers{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px}
.tk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:#fff}
.tk.blood{background:#b3201a}
.tk.dry{background:#111}
.tk .l{font-weight:600}
.tk b{font-size:26px;min-width:1.6em;text-align:center}
.tk button{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.45);color:#fff;font-size:18px;padding:2px 12px}
.tk button:hover{background:rgba(255,255,255,.3)}

/* ===== Card faces: art, holo / sheen / glow effects and their keyframes ===== */
.c{position:relative;transition:transform .2s ease,box-shadow .2s ease}
.im{position:relative;overflow:hidden}
.im::before,.im::after{content:"";position:absolute;pointer-events:none}
.im::before{top:0;bottom:0;left:-60%;width:50%;z-index:2;opacity:0;transform:skewX(-20deg);background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent)}
.im::after{inset:0;z-index:1;opacity:0}
.c.t3 .im::after{opacity:.3;mix-blend-mode:screen;background:linear-gradient(115deg,transparent 15%,rgba(255,60,170,.8) 32%,rgba(60,220,255,.8) 48%,rgba(150,255,110,.7) 64%,transparent 82%);background-size:260% 260%;animation:holo 5s ease-in-out infinite}
.c.fx-sheen .im::before{animation:sheen .9s .3s ease-out 1 both}
.c.fx-pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
.c.fx-glow{animation:pop .45s cubic-bezier(.2,.9,.3,1.2),glow 1.5s ease-out}
.sp{position:absolute;z-index:3;left:var(--x);top:var(--y);width:12px;height:12px;pointer-events:none;opacity:0;background:radial-gradient(#fff,#ffe9a0);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:spark 1.3s var(--d) ease-out 1 both}
@keyframes pop{0%{transform:scale(.4) translateY(30px);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes sheen{0%{left:-60%;opacity:1}100%{left:120%;opacity:1}}
@keyframes glow{0%{box-shadow:0 0 0 rgba(255,215,90,0)}30%{box-shadow:0 0 22px 6px rgba(255,215,90,.85)}100%{box-shadow:0 0 0 rgba(255,215,90,0)}}
@keyframes spark{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.5) rotate(90deg)}100%{opacity:0;transform:scale(0) rotate(180deg)}}
@keyframes holo{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes wobble{0%{transform:scale(1.06) rotate(0)}25%{transform:scale(1.06) rotate(-2.5deg)}50%{transform:scale(1.06) rotate(2deg)}75%{transform:scale(1.06) rotate(-1deg)}100%{transform:scale(1.06) rotate(0)}}

/* ===== Play area v1: top bar, deck piles, discard pile, resource tickers ===== */
.topbar{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.dgrps{display:flex;flex-wrap:wrap;gap:30px}
.dgrp{display:grid;grid-template-columns:auto auto;gap:8px 12px;align-items:end}
.dgrp .mini{grid-column:1/-1}
.deck{position:relative;width:118px;height:164px;border-radius:8px;border:2px solid var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:repeating-linear-gradient(45deg,#1f5c52 0 10px,#23685c 10px 20px);box-shadow:3px 3px 0 #17423b,6px 6px 0 #0f2e29;transition:transform .15s}
.deck:hover{transform:translateY(-4px)}
.deck.none{opacity:.5}
.deck .dn{font:700 16px Georgia,serif;letter-spacing:.5px}
.deck b{font-size:32px;line-height:1}
.deck .dh{font-size:11px;opacity:.85}
.disc{width:70px;height:98px;border:2px dashed var(--mute);border-radius:8px;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:12px;padding:0}
.disc b{font-size:20px;color:var(--ink)}
.disc:hover{border-color:var(--amber);color:var(--amber)}
.mini{padding:3px 10px;font-size:13px}
.topbar .tickers{flex-direction:column;margin:0}
.table{min-height:240px;border:2px solid var(--teal);border-radius:12px;background:rgba(31,92,82,.1);padding:14px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin-bottom:6px}
.table .empty{align-self:center}
.table .c{width:150px;flex:0 0 150px}
.c.click{cursor:pointer}
.c.click:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ===== Overlays and modal boxes (.ov / .box) ===== */
.ov{position:fixed;inset:0;background:rgba(20,28,25,.82);display:none;align-items:center;justify-content:center;z-index:7;padding:20px}
.ov.on{display:flex}
#profile{max-width:940px;margin:0 auto}
.pf-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:16px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(0,0,0,.28)}
.pf-av{width:104px;height:104px;border-radius:50%;border:3px solid var(--rk,#aab4c3);background:#1b1f27;display:flex;align-items:center;justify-content:center;font:700 40px Georgia,serif;color:#e8e6df;flex:0 0 auto;overflow:hidden}
.pf-av img{width:100%;height:100%;object-fit:cover;display:block}
.pf-name{font:700 28px/1.1 Georgia,serif;margin:0}
.pf-rank{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:700}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
.pf-card{border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px;background:rgba(0,0,0,.25)}
.pf-card small{display:block;opacity:.7;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pf-card b{font-size:22px}
.pf-card .stat{font-size:12px;margin-top:2px}
.pf-sec{margin:20px 0 8px;font:700 18px Georgia,serif}
.pf-badges{display:flex;flex-wrap:wrap;gap:8px}
.pf-badge{padding:5px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.2);font-size:13px;opacity:.38}
.pf-badge.on{opacity:1;border-color:#e0b040;color:#ffd77a}
.pf-log{display:flex;flex-direction:column;gap:6px}
.pf-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(0,0,0,.2)}
.pf-res{font-weight:800;text-align:center;padding:4px 0;border-radius:6px}
.pf-res.w{background:#12301f;color:#8fe0b6}.pf-res.l{background:#3a1612;color:#ff8b7c}
.pf-fav{display:flex;gap:10px;align-items:center}
.pf-fav img{width:46px;height:64px;object-fit:cover;border-radius:5px;border:1px solid rgba(255,255,255,.2)}
.pf-bio{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pf-bio input{flex:1 1 220px;min-width:0}
.rkb{display:flex;align-items:center;gap:10px;margin:8px 0}
.rkl{font-weight:700;margin:8px 0}
.rkl svg{vertical-align:middle;margin-right:4px}
#ac .box{width:min(420px,92vw)}
#ac .arow{display:flex;flex-direction:column;gap:3px;margin:10px 0}
#ac .arow input{width:100%;box-sizing:border-box}
#ac .amsg{min-height:1.4em;margin:8px 0;font-size:13px}
#ac .amsg.err{color:#ff8b7c}#ac .amsg.ok{color:#8fe0b6}
#ac .alink{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px;opacity:.8}
#am{z-index:8}
#st{z-index:20}
.box{background:var(--panel);border-radius:10px;padding:16px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.box h2{font:700 18px Georgia,serif;margin:0 0 8px}
#am .box{width:auto;max-width:360px;text-align:center}
#am .box img{display:block;margin:0 auto 8px;max-width:100%;max-height:55vh;border-radius:6px}
#am .row{justify-content:center}
@media (hover:hover){.c:hover{transform:scale(1.06);z-index:5;animation:wobble .6s ease-in-out 1}}

/* ===== Board slots: a card on the table, attachments ===== */
.slot{position:relative;width:150px;flex:0 0 150px;padding-bottom:calc(var(--n,0) * 28px)}
#cast{z-index:10;overflow:hidden;cursor:pointer;animation-name:castfade;animation-timing-function:linear;animation-fill-mode:both}

/* ===== Cast overlay: Envision / Infliction animation ===== */
#cast.env{background:radial-gradient(circle at 50% 50%,rgba(255,150,40,.45),rgba(28,12,2,.94) 72%)}
#cast.inf{background:radial-gradient(ellipse at 50% 50%,rgba(40,92,40,.5),rgba(4,11,5,.96) 72%)}
@keyframes castfade{0%{opacity:0}9%{opacity:1}88%{opacity:1}100%{opacity:0}}
.cc{position:relative;z-index:3;animation:castin .85s cubic-bezier(.2,.9,.3,1.1) both}
.cc img{display:block;position:relative;z-index:2;height:min(68vh,560px);width:auto;max-width:82vw;border-radius:10px}
@keyframes castin{0%{transform:scale(.5) translateY(46px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.cast-label{position:absolute;bottom:18px;left:0;right:0;z-index:4;text-align:center;color:#fff;opacity:.8;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
.cp{position:absolute;left:var(--x);bottom:-14px;width:var(--s);height:var(--s);border-radius:50%;opacity:0;--sw:26px;animation:cpr var(--t) linear var(--d) infinite}
.cp:nth-child(odd){--sw:-30px}
@keyframes cpr{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--sw),-105vh);opacity:0}}
.env .cp{background:radial-gradient(#fff3c4,#ff9a26);box-shadow:0 0 9px #ffa63a}
.env .cc{animation:castin .85s cubic-bezier(.2,.9,.3,1.1) both,floaty 3s ease-in-out .85s infinite}
.env .cc img{animation:envglow 1.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes envglow{0%,100%{box-shadow:0 0 26px 6px rgba(255,140,30,.7),0 0 70px 14px rgba(255,120,20,.35)}50%{box-shadow:0 0 52px 16px rgba(255,190,80,.95),0 0 110px 30px rgba(255,140,30,.5)}}
.rune{position:absolute;inset:0;margin:auto;width:min(96vmin,820px);height:min(96vmin,820px);z-index:1;opacity:0;filter:drop-shadow(0 0 6px rgba(255,160,40,.95));animation:runein 1.1s ease-out .1s both}
.rune *{fill:none;stroke:#ffb040;stroke-width:.8}
.rune .r1{transform-origin:0 0;animation:spin 16s linear infinite}
.rune .r2{transform-origin:0 0;animation:spin 11s linear infinite reverse}
@keyframes runein{0%{opacity:0;transform:scale(.55) rotate(-40deg)}100%{opacity:.85;transform:scale(1) rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.inf .cp{background:radial-gradient(#d3eca4,#4c8a2a);box-shadow:0 0 7px #6ab04c;animation-duration:calc(var(--t) * 1.5)}

/* ===== Infliction effects: vines, mold, rot ===== */
.inf::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 32%,rgba(0,8,0,.92) 100%);animation:creep 2.6s ease-out both}
@keyframes creep{from{opacity:0}to{opacity:1}}
.vines{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.vines path{fill:none;stroke:#1d5a24;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:vgrow 2.8s ease-out forwards}
.vines path:nth-child(even){stroke:#33803a;stroke-width:1}
.vines path:nth-child(n+5){stroke-width:.7}
@keyframes vgrow{to{stroke-dashoffset:0}}
.rot{position:absolute;inset:-16px;z-index:1;background:#12301a;border-radius:20px;filter:url(#erode);opacity:0;animation:rotin 2.6s ease-out .3s both}
@keyframes rotin{0%{opacity:0;transform:scale(.9)}100%{opacity:.95;transform:scale(1.05)}}
.mold{position:absolute;inset:0;z-index:3;border-radius:10px;pointer-events:none;opacity:0;mix-blend-mode:multiply;background:radial-gradient(circle at 0 0,rgba(10,44,14,.95),transparent 38%),radial-gradient(circle at 100% 0,rgba(10,44,14,.9),transparent 34%),radial-gradient(circle at 0 100%,rgba(10,44,14,.95),transparent 40%),radial-gradient(circle at 100% 100%,rgba(10,44,14,.9),transparent 36%);animation:moldin 3s ease-out .4s both}
@keyframes moldin{0%{opacity:0}100%{opacity:.75}}
.inf .cc img{animation:rotimg 3s ease-out .4s both}
@keyframes rotimg{0%{filter:none}100%{filter:saturate(.65) hue-rotate(32deg) brightness(.88)}}
.slot{transform:scale(var(--ps,1));transition:transform .3s ease}

/* ===== Slot hover pop-out, attachments list, pick-a-target highlights ===== */
.slot:hover{z-index:50}
.slot.pk-grow{animation:pkgrow .75s cubic-bezier(.2,.9,.3,1.15) 1}
.slot.pk-shrink{animation:pkshrink .75s ease-in-out 1}
@keyframes pkgrow{0%{transform:scale(var(--from));filter:none}45%{transform:scale(var(--peak));filter:drop-shadow(0 0 12px rgba(255,196,70,.95))}100%{transform:scale(var(--ps));filter:none}}
@keyframes pkshrink{0%{transform:scale(var(--from));filter:none}45%{transform:scale(var(--peak));filter:brightness(.8) saturate(.7)}100%{transform:scale(var(--ps,1));filter:none}}
.slot .c.main,.slot .c.main:hover{z-index:30}
.slot .c.att{position:absolute;left:calc(var(--k) * 6px + 6px);top:calc((var(--k) + 1) * 28px + var(--S,28px));width:150px;pointer-events:none;filter:brightness(.82)}
.badge{position:absolute;top:6px;right:6px;z-index:4;background:var(--amber);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pop{display:none;position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:170px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.pop h4{margin:0 0 6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.pi{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.pi img{width:34px;height:auto;border-radius:3px;display:block}
.pi .t{display:block;color:var(--mute);font-size:11px}
@media (hover:hover){.slot:hover .pop{display:block}}
.slot.pick .c.main{outline:3px solid var(--amber);outline-offset:2px;cursor:pointer;animation:pickpulse 1s ease-in-out infinite}
.pickbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff6e0;border:2px solid var(--amber);border-radius:8px;padding:8px 12px;margin:6px 0 10px}
.attl{margin:8px 0 4px;text-align:left}
.attl h3{margin:0 0 6px;font:700 13px "Segoe UI",sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.attl button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:4px}
.attl img{width:30px;height:auto;margin:0;border-radius:3px;max-height:none}
.c.fx-no{animation:nope .6s ease-in-out 1!important;box-shadow:0 0 0 3px var(--red),0 0 18px 4px rgba(163,52,46,.7)}
@keyframes nope{0%,100%{transform:rotate(0) translateX(0)}15%{transform:rotate(-7deg) translateX(-6px)}35%{transform:rotate(6deg) translateX(6px)}55%{transform:rotate(-4deg) translateX(-4px)}75%{transform:rotate(3deg) translateX(3px)}}
@keyframes pickpulse{0%,100%{outline-color:var(--amber)}50%{outline-color:#f3c47a}}
.decks{display:flex;flex-wrap:wrap;gap:34px;margin:6px 0 18px}

/* ===== Deck piles, table, card selection ===== */
.dgrp{display:flex;gap:14px;align-items:flex-end}
.deck{width:110px;aspect-ratio:5/7;padding:0;border-radius:8px;border:2px solid var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink),6px 6px 0 var(--line);transition:transform .15s;background:repeating-linear-gradient(45deg,var(--teal),var(--teal) 8px,#18483f 8px,#18483f 16px)}
.deck.other{background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 8px,#8f5614 8px,#8f5614 16px)}
.deck:hover{transform:translateY(-4px)}
.deck.empty{opacity:.5}
.deck b,.deck span{background:rgba(0,0,0,.6);padding:2px 8px;border-radius:4px}
.deck b{font:700 15px Georgia,serif}

/* moldy */
.moldfx{position:absolute;left:0;top:0;width:100%;aspect-ratio:var(--ar,.714);z-index:44;pointer-events:none;border-radius:10px;overflow:hidden}
.moldfx .mb{position:absolute;inset:0;mix-blend-mode:multiply;background:radial-gradient(circle at 0 0,rgba(40,120,20,.9),transparent 38%),radial-gradient(circle at 100% 8%,rgba(60,140,20,.85),transparent 34%),radial-gradient(circle at 10% 100%,rgba(30,100,20,.9),transparent 40%),radial-gradient(circle at 100% 100%,rgba(70,130,10,.85),transparent 36%);animation:moldpulse 2.6s ease-in-out infinite}
.moldfx .mg{position:absolute;inset:0;box-shadow:inset 0 0 22px 6px rgba(120,220,50,.75);border-radius:10px;animation:moldglow 2.2s ease-in-out infinite}
.moldfx .sp2{position:absolute;left:var(--x);bottom:-6px;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(#d4ff8a,#58a02a);box-shadow:0 0 6px 1px #7ed321;opacity:0;animation:sporeup var(--t) ease-in infinite;animation-delay:var(--d)}
.moldfx .dr{position:absolute;top:-4px;left:var(--x);width:5px;height:16px;border-radius:3px 3px 6px 6px;background:linear-gradient(#3a8a1a,#a6e22e);opacity:.85;transform-origin:top;animation:drip var(--t) ease-in infinite;animation-delay:var(--d)}
.slot.moldy .c.main .im img{animation:moldimg 2.6s ease-in-out infinite}

@keyframes moldglow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes moldimg{0%,100%{filter:saturate(.75) hue-rotate(28deg) brightness(.88)}50%{filter:saturate(.6) hue-rotate(40deg) brightness(.78)}}
@keyframes sporeup{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:.95}100%{opacity:0;transform:translateY(calc(var(--ht,200px) * -.7)) translateX(var(--sw,10px)) scale(1.2)}}
@keyframes drip{0%{transform:scaleY(.2);opacity:0}20%{opacity:.9;transform:scaleY(1)}70%{opacity:.8;transform:translateY(30px) scaleY(1.3)}100%{opacity:0;transform:translateY(48px) scaleY(.6)}}
.moldfx.q{z-index:48}
.moldfx.q .qg{position:absolute;left:50%;top:50%;width:140%;aspect-ratio:1;margin:-70% 0 0 -70%;border-radius:50%;background:radial-gradient(circle,rgba(60,150,20,.95) 0 28%,rgba(30,90,15,.8) 50%,transparent 70%);mix-blend-mode:multiply;opacity:0;animation:qgrow 2s ease-out var(--qo,0s) both}
.moldfx.q .qs{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(#d4ff8a,#4a9a20);box-shadow:0 0 8px 2px #7ed321;opacity:0;animation:qspore 1.6s ease-out calc(var(--d) + var(--qo,0s)) both}

html{background:#080504}
body{font-family:var(--serif);background:#080504;scrollbar-color:#6d5233 #140d08}

body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 52% 48% at 50% 46%,rgba(255,150,50,.30),rgba(150,60,10,.13) 55%,transparent 78%),url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.8%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.5%200%200%200%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url%28%2523n%29%27/%3E%3C/svg%3E");animation:candle 7s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 45%,rgba(0,0,0,.26) 72%,rgba(0,0,0,.72) 100%)}

<!-- ===== Page body: header, the main screens (menu / builder / play / rules), then the overlays ===== -->
<body>
<!-- Header: title, tab buttons (hidden), Settings and back-to-menu -->
<header>
  <h1>Prescription Deck Manager</h1>
  <nav style="display:none"><button id="tb" class="on">Build</button><button id="tp">Play</button><button id="tr">Rules</button></nav>
  <span class="sp"></span>
  <button id="acc">Sign in</button>
  <button id="sb">Settings</button>
  <button id="mm" class="hide">← Back to menu</button>
</header>
<main>
<!-- Main menu -->
  <section id="menu" class="menu hide">
    <div id="mfloat" aria-hidden="true"></div>
    <div class="mc">
      <h2 class="mt">Prescription</h2>
      <p class="msub">Deck Manager</p>
      <div id="merr" class="warn" role="alert"></div>
      <div class="mbtns">
        <button class="go big hide" data-m="resume">Resume game</button>
        <button class="big" data-m="build">Deck Builder</button>
        <button class="big" data-m="online">Play Online</button>
        <button class="big" data-m="ai">Play Vs. AI</button>
        <button class="big" data-m="profile">Sign In</button>
        <button class="big" data-m="rules">Rules</button>
        <button class="big" data-m="settings">Settings</button>
      </div>
    </div>
  </section>

<!-- Shown instead of the deck builder while a game is running -->
  <section id="lockp" class="picker hide" style="margin:30px auto;text-align:center"><h2 style="margin-top:0">Deck builder is locked</h2><p>A game is in progress. Finish it, or end it to edit your deck.</p><button id="lk-end" class="go">End game &amp; edit deck</button> <button id="lk-back">Back to game</button></section>
<!-- Deck builder: side panel (deck list, rename / export / import) and the card grid -->
  <section id="build" class="build hide">
    <aside class="side">
      <label class="dsel">Deck <select id="decksel"></select></label>
      <h2 id="dname"></h2>
      <div class="stat" id="dtotal"></div>
      <ul class="req" id="req"></ul>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/* ====================================================================================================
   BASICS: helpers, constants and saved data
   ==================================================================================================== */

const $ = s => document.querySelector(s);
// Display order of card types in the deck builder.
const ORDER = ["character","prescription","enchantment","item","envision","infliction","unknown"];
// Deck rules: copies per card, minimum deck size, and the per-group card caps.
const MAX_COPIES = 2, MIN_DECK = 15, MAXD = { character: 15, other: 30 };
// Largest allowed size for a group ("character" or "other").
const maxDeck = g => MAXD[g];
// Copies of one card allowed in a deck: 1 for three-star cards, otherwise MAX_COPIES.
const maxCopies = id => (byId[id] && byId[id].tier === 3) ? 1 : MAX_COPIES;
// Display names for the two card groups.
const GN = { character: "Characters", other: "Other cards" };
// True only inside the hidden AI frame (the page opened with ?bot=1).
const BOT = /[?&]bot=1/.test(location.search); // set only inside the hidden AI frame
let SIM = false; // true while the AI is trying moves out on copies of the game
// localStorage wrapper that never throws; the AI frame never reads or writes saved data.
const store = {
  get(k){ if (BOT) return null; try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ if (BOT) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

// Account state (Supabase). `user` is the signed-in user, `name` their public username.
const ACC = { prof: null, sb: null, user: null, name: "", mode: "in", busy: false, msg: "", ok: false, f: { email: "", user: "" }, cloud: null };
// HTML-escape a string before putting it into innerHTML.
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Sort comparator: by type order, then star tier, then name.
const cardCmp = (a,b) => ORDER.indexOf(a.type)-ORDER.indexOf(b.type) || (a.tier||9)-(b.tier||9) || a.name.localeCompare(b.name);
// Capitalise the first letter.
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// App state: all cards, lookup by id, saved decks, the current deck name, builder filters and the live game (`play`).
let cards = [], byId = {}, decks = store.get("cg-decks") || {}, cur = store.get("cg-cur") || "";
let filter = "all", query = "", starFilter = 0, play = null;
if (!Object.keys(decks).length) decks = { "Main deck": {} };
if (!decks[cur]) cur = Object.keys(decks)[0];

// Write the decks and the current deck name to localStorage.
function save(){ store.set("cg-decks", decks); store.set("cg-cur", cur); }

// In-place Fisher-Yates shuffle.
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// Image source for a card (embedded data URLs pass through, file paths get URL-encoded).
function img(c){ return /^data:/.test(c.art) ? c.art : encodeURI(c.art); }

/* ====================================================================================================
   CARD DATA: built-in token cards, loading cards.json
   ==================================================================================================== */

const MITE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350"><rect width="250" height="350" fill="#1d1630"/><rect x="8" y="8" width="234" height="334" rx="14" fill="none" stroke="#6d4aa0" stroke-width="4" stroke-dasharray="10 6"/><g stroke="#b57bff" stroke-width="6" stroke-linecap="round"><path d="M95 165 L50 135 M90 185 L40 190 M95 205 L52 245 M155 165 L200 135 M160 185 L210 190 M155 205 L198 245"/></g><ellipse cx="125" cy="185" rx="48" ry="40" fill="#5b1f8f"/><circle cx="125" cy="140" r="24" fill="#7a2bbd"/><circle cx="116" cy="136" r="4" fill="#fff"/><circle cx="134" cy="136" r="4" fill="#fff"/><text x="125" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#d9b8ff">MITE</text><text x="125" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8d9bab">placeholder art</text></svg>`;
// Token card: never part of a deck. Lives in byId so it can sit in hand / in play, but vanishes if discarded or shuffled away.
const ZSQ_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350"><rect width="250" height="350" fill="#14231a"/><rect x="8" y="8" width="234" height="334" rx="14" fill="none" stroke="#4c8a2a" stroke-width="4" stroke-dasharray="10 6"/><path d="M165 250 C225 235 225 150 185 135 C205 175 175 190 160 200" fill="#5f7d4a" stroke="#33502a" stroke-width="4"/><ellipse cx="120" cy="205" rx="52" ry="55" fill="#6d8f56"/><circle cx="112" cy="140" r="34" fill="#7da363"/><ellipse cx="90" cy="108" rx="9" ry="16" fill="#6d8f56"/><ellipse cx="130" cy="106" rx="9" ry="16" fill="#6d8f56"/><circle cx="100" cy="136" r="8" fill="#e8f0c0"/><circle cx="126" cy="136" r="8" fill="#e8f0c0"/><path d="M95 131 L105 141 M105 131 L95 141 M121 131 L131 141 M131 131 L121 141" stroke="#1a2a12" stroke-width="3"/><path d="M100 158 L125 158" stroke="#1a2a12" stroke-width="3"/><text x="125" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#bfe39a">ZOMBIE SQUIRREL</text><text x="125" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8d9bab">placeholder art</text></svg>`;
const ZSQ = { id: "token-zombie-squirrel", token: true, name: "Zombie Squirrel", type: "character", tier: 0, attack: 1, health: 1, red_points: 0, green_points: 0, blood_cost: 0, dry_blood_cost: 0, innate_enchantment: [], innate_condition: [], art: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(ZSQ_SVG) };
const MITE = { id: "token-mite", token: true, name: "Mite", type: "character", tier: 0, attack: 1, health: 1, red_points: 0, green_points: 0, blood_cost: 0, dry_blood_cost: 0, innate_enchantment: [], innate_condition: ["Parasitic"], art: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(MITE_SVG) };

// Install a card list: tokens (Mite, Zombie Squirrel) merge into the built-ins and stay out of the builder, decks are trimmed to cards that exist, screens redraw (the AI frame starts booting from here).
function setCards(list, remember, src){
  const toks = list.filter(c => c.token);
  cards = list.filter(c => !c.token).sort(cardCmp);
  byId = {}; cards.forEach(c => byId[c.id] = c); byId[MITE.id] = MITE; byId[ZSQ.id] = ZSQ;
  // Token cards (Mite, Zombie Squirrel) live in cards.json but never show in the deck builder. Without a JSON entry the built-in placeholder is used.
  toks.forEach(t => { const base = t.id === MITE.id ? MITE : t.id === ZSQ.id ? ZSQ : null; if (base) Object.assign(base, t); else { byId[t.id] = t; } });
  for (const k of Object.keys(decks)) decks[k] = sanitize(decks[k]);
  save();
  if (remember) store.set("cg-cards", list);
  $("#merr").textContent = "";
  const fm = {site:"Cards loaded from cards.json on this site", cache:"cards.json could not be loaded, so this is a saved copy from an earlier visit"};
  $("#csrc").textContent = (fm[src] || "") + ` (${cards.length} cards).`;
  renderAll();
  if (BOT) botBoot();
}

// Fetch cards.json; if that fails, fall back to the copy saved from an earlier visit.
async function loadCards(){
  try {
    const r = await fetch("cards.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("bad status");
    setCards(await r.json(), true, "site");
  } catch(e) {
    const cached = store.get("cg-cards");
    if (cached) setCards(cached, false, "cache");
    else { $("#merr").textContent = "Couldn't load cards.json. Check your connection and refresh the page."; renderAll(); }
  }
}

// Read a JSON file the user picked and pass the parsed contents to the callback.
function readFile(file, cb){
  const fr = new FileReader();
  fr.onload = () => { try { cb(JSON.parse(fr.result)); } catch(e){ toast("Couldn't read that file", "It isn't valid JSON."); } };
  fr.readAsText(file);
}

/* ---------- deck helpers ---------- */

/* ====================================================================================================
   DECK BUILDER
   ==================================================================================================== */

const deck = () => decks[cur];
// Which group a card id belongs to: "character" or "other".
const gOf = id => (byId[id] && byId[id].type === "character") ? "character" : "other";
// Number of cards in the current deck that belong to a group.
const groupTotal = g => Object.entries(deck()).reduce((a,[id,n]) => a + (gOf(id)===g ? n : 0), 0);

// Trim a deck so it respects the size and copy limits (used on import).
function sanitize(d){
  const out = {}, used = { character: 0, other: 0 };
  for (const [id,n0] of Object.entries(d || {})){
    const g = gOf(id);
    const n = Math.min(maxCopies(id), Math.max(0, n0 | 0), maxDeck(g) - used[g]);
    if (n > 0){ out[id] = n; used[g] += n; }
  }
  return out;
}

// List of reasons the current deck can't be played yet (empty list = deck is valid).
function problems(){
  const p = [], c = groupTotal("character"), o = groupTotal("other");
  const one = Object.entries(deck()).reduce((a,[id,n]) => a + ((byId[id] && byId[id].tier === 1) ? n : 0), 0);
  if (c < MAXD.character) p.push(`Character deck needs ${MAXD.character} cards (has ${c}).`);
  if (o < MIN_DECK) p.push(`Other cards deck needs at least ${MIN_DECK} cards, up to ${MAXD.other} (has ${o}).`);
  if (one < 3) p.push(`Needs at least 3 one-blood (1-star) cards (has ${one}).`);
  return p;
}

// Timer handle for the deck-builder message line.
let bt;

// Show a short message under the builder toolbar, clearing it after a moment.
function flash(t){ $("#bmsg").textContent = t; clearTimeout(bt); bt = setTimeout(() => $("#bmsg").textContent = "", 3500); }

// Add or remove copies of a card in the current deck, enforcing the limits.
function bump(id, d){
  const have = deck()[id] || 0, n = Math.max(0, have + d), g = gOf(id);
  if (d > 0){
    if (n > maxCopies(id)) return flash(maxCopies(id) === 1 ? "Only 1 copy of each 3-star card is allowed." : `Only ${MAX_COPIES} copies of a card are allowed.`);
    if (groupTotal(g) >= maxDeck(g)) return flash(`The ${GN[g].toLowerCase()} deck is full (${maxDeck(g)} cards).`);
  }
  if (n) deck()[id] = n; else delete deck()[id];
  save(); renderBuild();
}

/* ---------- render: build ---------- */
function renderDeckSelect(){
  const s = $("#decksel");
  s.innerHTML = Object.keys(decks).map(n => `<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("");
}

// Draw the card-type filter chips.
function renderChips(){
  const types = ["all", ...ORDER.filter(t => cards.some(c => c.type === t))];
  $("#chips").innerHTML = types.map(t => `<button data-f="${t}" class="${t===filter?"on":""}">${cap(t)}</button>`).join(" ");
}

// Draw the star-tier filter buttons.
function renderStars(){
  const o = [[0,"All stars"],[1,"★"],[2,"★★"],[3,"★★★"]];
  $("#stars").innerHTML = o.map(([v,l]) => `<button data-s="${v}" class="${v===starFilter?"on":""}" aria-label="${v ? v + " star" : "all stars"}">${l}</button>`).join(" ");
}

// Draw the deck builder: side summary plus the filtered card grid.
function renderBuild(){
  $("#dname").textContent = cur;
  $("#dtotal").textContent = `Characters ${groupTotal("character")}/${MAXD.character} · Other cards ${groupTotal("other")}/${MAXD.other}`;
  const pr = problems();
  $("#req").innerHTML = pr.length ? pr.map(t => `<li class="warn">${esc(t)}</li>`).join("") : `<li class="ok">Ready to play.</li>`;
  const ids = Object.keys(deck()).filter(id => byId[id])
    .sort((a,b) => cardCmp(byId[a], byId[b]));
  $("#dlist").innerHTML = ids.length
    ? ids.map(id => `<li><span>${esc(byId[id].name)} <span class="t">${byId[id].type}${byId[id].tier ? " " + "★".repeat(byId[id].tier) : ""}</span></span><b>×${deck()[id]}</b></li>`).join("")
    : `<li class="empty">No cards yet. Use + on a card.</li>`;
  const list = cards.filter(c => (filter==="all" || c.type===filter) && c.name.toLowerCase().includes(query) && (!starFilter || c.tier === starFilter));
  const gt = { character: groupTotal("character"), other: groupTotal("other") };
  let prevKey = "";
  $("#grid").innerHTML = list.map(c => {
    const key = c.type + (c.tier || ""), head = key === prevKey ? "" : `<h3 class="gh">${c.type === "character" ? "Characters" + (c.tier ? " · " + "★".repeat(c.tier) : "") : cap(c.type) + "s"}</h3>`;
    prevKey = key;
    const n = deck()[c.id] || 0;
    const full = n >= maxCopies(c.id) || gt[gOf(c.id)] >= maxDeck(gOf(c.id));
    return head + `<div class="c ${n?"in":""} ${c.tier===3?"t3":""}" ${c.type === "enchantment" ? `data-ench="${esc(c.name)}"` : ""}><div class="im"><img loading="lazy" decoding="async" src="${esc(img(c))}" alt="${esc(c.name)}" data-zoom="${esc(img(c))}" data-cid="${esc(c.id)}"></div>
      <div class="meta"><span class="st">${"★".repeat(c.tier || 0)}${c.pack ? `<span class="pk">Pack</span>` : ""}</span><span class="nm" title="${esc(c.name)}" data-zoom="${esc(img(c))}" data-cid="${esc(c.id)}" style="cursor:zoom-in">${esc(c.name)}</span>
      <div class="ct"><button data-id="${esc(c.id)}" ${n?"":"disabled"} data-d="-1" aria-label="Remove ${esc(c.name)}">−</button><b>${n}</b><button data-id="${esc(c.id)}" ${full?"disabled":""} data-d="1" aria-label="Add ${esc(c.name)}">+</button></div></div></div>`;
  }).join("") || `<p class="empty">No cards match.</p>`;
}

/* ---------- render: play ---------- */

/* ====================================================================================================
   PLAY STATE: game object, text tables for card rules
   ==================================================================================================== */

let act = null, viewD = null, cmI = null;
// Group label used in toasts and prompts.
const gl = g => g === "character" ? "Character" : "Other";

// Close every in-game popup.
function closeModals(){
  act = null; viewD = null; cmI = null;
  $("#am").classList.remove("on"); $("#dv").classList.remove("on"); $("#cm").classList.remove("on");
}

// Create a fresh `play` object (piles, hand, board, resources) from the current deck.
function newGame(){
  if (problems().length){ play = null; renderPlay(); return; }
  const piles = { character: [], other: [] };
  for (const [id,n] of Object.entries(deck())) if (byId[id]) for (let i=0;i<n;i++) piles[gOf(id)].push(id);
  play = { deckName: cur, sig: JSON.stringify(deck()), blood: 0, dry: 0,
    pile: { character: shuffle(piles.character), other: shuffle(piles.other) },
    discard: [], hand: [], inplay: [], fresh: null, shake: null, pick: null, tgt: null, cl: null, moldq: null, dryMax: 0, dryCur: 0, ts: false, atkSel: null, turnN: 0, turnPlays: 0, sacUsed: false, noPlay: false, persuade: false, control: false };
  if (net.mode === "solo") net.score = 0;
  if (net.mode === "online") msReset();
  $("#msg").textContent = "";
  cancelCast();
  closeModals();
  renderPlay();
}
/* ---------- stats ---------- */
const NUMF = { attack: "Attack", health: "Health", red_points: "Red Points", green_points: "Green Points", blood_cost: "Blood Cost", dry_blood_cost: "Token Cost" };
// Descriptions of the numeric traits.
const NUMT = {
  character: ["attack","health","red_points","green_points","blood_cost","dry_blood_cost"],
  prescription: ["attack","health","red_points","green_points","blood_cost","dry_blood_cost"],
  enchantment: ["blood_cost","dry_blood_cost"],
  item: ["health","blood_cost","dry_blood_cost"],
  envision: ["blood_cost","dry_blood_cost"],
  infliction: ["blood_cost","dry_blood_cost"]
};

// Display names for the non-numeric traits.
const TRAITF = {
  character: [["innate_condition","Innate Condition","Inflicts"],["condition_invulnerability",null,"Immune To"],["pack_bonus",null,"Pack Bonus"],["sci_bonus",null,"Scientist Bonus"],["infl",null,"Inflictions"]],
  prescription: [["condition_add","Adds Condition"],["condition_invulnerability","Condition Immunity"],["pack_add","Adds Pack"]],
  enchantment: []
};

// Enchantment name -> rules text.
const ENCH = {
  Adrenaline: "Increases Health by Red Point amount when attacking. Stacks: each copy adds it again.",
  Bloodlust: "Increases Attack by Red Point amount. Stacks: each copy adds it again.",
  Defender: "Increases Health by Green Point amount when blocking. Stacks: each copy adds it again.",
  Flight: "Can only be blocked by characters with Flight or Reach.",
  Gruesome: "Gain Red Point amount of Blood when this character gets a kill. Stacks: each copy adds that amount again.",
  Merciless: "Start another attack phase (this character only) after killing an opponent's Character.",
  Parallel: "On death, returns to your hand. Cannot be discarded from the field. It is only duplicated if the character has two instances of Parallel (innate + enchantment, or two enchantments).",
  Reach: "Can block characters with Flight.",
  Shield: "Can block one extra attack in one attack phase. Stacks: each copy allows one more.",
  Swift: "Attacks first, without clashing, only if this character can kill the opponent in one hit (its Attack is at least the opponent's Health).",
  Terror: "On kill, steal a copy of the felled character instead of banishing it. Its prescriptions and enchantments are discarded. Stacks: each copy of Terror steals one more copy.",
  Toxic: "Increases Attack by Green Point amount. Stacks: each copy adds it again.",
  Undead: "On death, turns into Green Point amount of Zombie Squirrels, which return to your hand. Stacks: each copy adds that many again."
};

// Rules text for an enchantment, with its numbers filled in.
function enchText(name, o){
  const d = ENCH[name] || "";
  if (!o) return d;
  const kN = (o.en_n || {})[name] || 1, r = (o.red_points || 0) * kN, g = (o.green_points || 0) * kN;
  const w = (o.when || []).find(x => x.label === (name === "Adrenaline" ? "Attacking" : "Blocking"));
  const x = { Adrenaline: `+${r} Health when attacking${w ? ", HP " + w.health : ""}`, Bloodlust: `+${r} Attack`, Defender: `+${g} Health when blocking${w ? ", HP " + w.health : ""}`, Gruesome: `gain ${r} Blood on a kill`, Toxic: `+${g} Attack`, Undead: `${g} Zombie Squirrel${g === 1 ? "" : "s"} on death` }[name];
  return x ? `${d} (${x})` : d;
}

// Put a card id on the discard pile (tokens such as Mite just vanish).
const pushDiscard = id => { if (!(byId[id] && byId[id].token)) play.discard.push(id); }; // tokens (Mite) vanish instead
// Normalise a field that may be null, a string or a list into an array.
const asArr = v => (v == null || v === "") ? [] : [].concat(v);
// All condition names.
const CONDS = ["High","Overdose","Poison","Relapse","Sickly","Compromised","Roided","Parasitic","Beartrap","Frozen","Venom"];
// Condition name -> rules text.
const COND = {
  High: "Reduces Health by the card's Green Points. Stacks: each copy reduces it again.",
  Overdose: "Reduces Attack by 1 for every prescription and enchantment attached. Stacks: each copy reduces it again.",
  Poison: "Overflow damage dealt to this character (damage beyond its remaining Health) goes straight to the points ticker, toward its owner.",
  Relapse: "Deals no damage when blocking (ATK is 0 while blocking).",
  Sickly: "While afflicted, the card loses its innate enchantments, innate condition abilities and Pack bonus. Remove Sickly to restore them.",
  Compromised: "Reduces Health by the number of conditions applied.",
  Roided: "Increases Attack and decreases Health by the number of prescriptions attached.",
  Parasitic: "On death, this card turns into a Mite, which returns to your hand for free.",
  Beartrap: "Reduces Health by 1. Stacks: each Beartrap reduces it by 1.",
  Frozen: "−1/−1 for each Frozen. Each full turn the character neither attacks nor blocks removes one Frozen. If Frozen brings its Health to 0 it dies.",
  Venom: "−1/−1 for each OTHER character on the same team that is also afflicted with Venom (like Pack, but against you)."
};

// Infliction name -> rules text.
const INFL = {
  Burn: "Quick: choose a character, then one of its attached Enchantments or Prescriptions. It returns to the hand of the character's owner.",
  Cleanse: "Quick: grants this character immunity from every Condition it currently has (and cures them).",
  Clone: "Quick: choose a character, then one of its enchantments (innate too) or prescriptions. A copy goes to your hand.",
  Contaminate: "Quick: applies 2 random conditions to the character (never Beartrap).",
  Enfeeble: "Quick: this character cannot attack until it executes a block on an opposing character.",
  Hinder: "Quick: this character cannot block until it executes an attack that deals direct damage to the player (unblocked).",
  Hypnotize: "Quick, enemy characters only: draw cards from your Other deck equal to the character's Attack.",
  Infest: "Quick: applies 3 stacks of Parasitic (Parasitic stacks; each stack leaves a Mite on death).",
  Intimidate: "Quick: lasts 3 of its owner's turns. If this character does not attack once by the end of those 3 turns, its attached Enchantments and Prescriptions are banished.",
  "Just Say No": "Quick: removes all Enchantments and Prescriptions from this character and puts them in your hand, and puts a duplicate of the character card in your hand too.",
  Learn: "While on, every character on your field gains this character's innate enchantments and innate condition perks.",
  Rend: "Quick: the next instance of damage this character takes is increased by 2.",
  Reduce: "While on, this character and any duplicate of it in your hand are worth 0 Blood: the duplicates cost 0 Blood to play, and this character gives no Blood, Dry Blood or Token if it dies.",
  Swap: "While on, this character's Attack and Health are swapped."
};

// Envision name -> rules text.
const ENVD = {
  Backtrack: "Discards the last card you drew, then draws a random card of the same type from your decks (a Tier 2 character gives a Tier 2 character).",
  Control: "On your attack this turn, you choose how the enemy team's characters block. Every enemy character must block at least once (as many as the attack count allows).",
  Dissolve: "Reduces the opponent's Blood by the number of cards in their hand.",
  Decide: "Choose the type of card you want to draw (Tier 1, 2 or 3 character, enchantment, infliction, envision, prescription). Types with no cards left in your decks are greyed out.",
  Double: "The next card you draw is duplicated.",
  Forsee: "View the top 3 cards of both your Character deck and your Other deck.",
  Ignite: "For one turn, every character MUST attack (yours this turn, theirs on their next turn). A character that cannot attack, through Inflictions or otherwise, is killed.",
  Peer: "View your opponent's hand and discard pile. The menu disappears when closed.",
  Persuade: "Until your next turn starts, any damage dealt to you (the points ticker) or to your characters becomes Blood for you instead. Damage your characters deal still goes through.",
  Plague: "Applies one random condition to all characters in play (both teams).",
  Promote: "Gain 1 Blood for every active Tier 1 character on your team.",
  Reset: "Reshuffles all discarded Other cards (everything that is not a character) back into the Other deck.",
  Taste: "Gain 1 Blood for each character on the field (either team) with at least one Condition.",
  Retaliate: "Discards the most expensive card (Blood + Token cost) from each active team. On a tie, you choose which one goes."
};

// Inflictions that stay on the target until they expire (the others act once).
const TOGGLE = ["learn","reduce","swap"];
// "infliction-hinder" -> "hinder".
const inflKey = id => String(id).replace("infliction-", "");
// Display name of an infliction card.
const inflName = id => byId[id] ? byId[id].name : id;
// Find the enchantment card for an enchantment name.
const ENCHCARD = n => Object.values(byId).find(c => c.type === "enchantment" && (c.enchantment_add || c.name) === n);
// Short random id for a card on the board.
const uid = () => Math.random().toString(36).slice(2, 8);
// This player's id in the room.
const me = () => net.myId || "me";
// Does this board card carry the named infliction?
const hasInf = (e, k) => (e.inf || []).some(x => inflKey(x.id) === k);
// Is the card Reduced by this player? (Reduce makes it worth 0 Blood.)
const reduceBy = (x, who) => (x.inf || []).some(i => inflKey(i.id) === "reduce" && (i.by || me()) === who);
// Is a card id worth 0 Blood because a Reduce is active on a copy of it?
const blood0 = id => !!play && (play.inplay.some(x => x.id === id && reduceBy(x, me())) || Object.values(net.players || {}).some(p => p.st && (p.st.inplay || []).some(x => x.id === id && reduceBy(x, me())))); // Reduce: that card and its duplicates in hand are worth 0 Blood
// Special prescriptions: their Condition Add is put on the host card itself instead of being an ability to inflict
const HOST_COND = ["prescription-syringe","prescription-cigarettes","prescription-hospital-flip","prescription-sugar","prescription-weed"];
// Is the card Sickly?
const isSick = e => (e.cond || []).includes("Sickly");
// Match a condition name case-insensitively to its canonical spelling.
const cnorm = s => CONDS.find(x => x.toLowerCase() === String(s).trim().toLowerCase());
// Is the card immune to this condition?
const immuneTo = (o, n) => (o.condition_invulnerability || []).some(x => cnorm(x) === n);
// How many prescription cards are attached.
const nPresc = e => e.att.filter(a => byId[a] && byId[a].type === "prescription").length;

// Rules text for a condition, scaled by how many copies of it the card has.
function condText(n, e, o){
  const p = nPresc(e), k = Math.max(1, (e.cond || []).filter(x => x === n).length), x = k > 1 ? ` ×${k}` : "";
  return ({
    High: `Health −${(o.green_points || 0) * k} (Green Points${x})`,
    Overdose: `Attack −${e.att.length * k} (attached cards${x})`,
    Poison: "Overflow damage goes straight to the points ticker.",
    Relapse: "Attack is 0 while blocking.",
    Compromised: `Health −${(e.cond || []).length * k} (conditions applied${x})`,
    Roided: `Attack +${p * k}, Health −${p * k} (attached prescriptions${x})`,
    Parasitic: "On death, turns into a Mite (returned to your hand, free).",
    Beartrap: `Health −${k}`,
    Frozen: `Attack −${k}, Health −${k}. Not attacking or blocking for a full turn removes one.`,
    Venom: `Attack −${venomPen(e)}, Health −${venomPen(e)} (other Venom characters on the team)`
  })[n] || COND[n] || "";
}
// Learn: the player who cast it gets the target's innate enchantments and condition perks on every character of theirs (the target itself aside).
// It can sit on an enemy character, so look at both sides and match who cast it.
function learnSrc(e){
  const found = [];
  const scan = arr => (arr || []).forEach(x => { const li = (x.inf || []).find(i => inflKey(i.id) === "learn"); if (li && x.uid !== e.uid && byId[x.id] && !isSick(x)) found.push([byId[x.id], li.by]); });
  if (play) scan(play.inplay);
  Object.values(net.players || {}).forEach(p => { if (p.st) scan(p.st.inplay); });
  if (!found.length) return [];
  let owner = me();
  if (!(play && play.inplay.some(x => x.uid === e.uid))) for (const [pid, p] of Object.entries(net.players || {})) if (p.st && (p.st.inplay || []).some(x => x.uid === e.uid)){ owner = pid; break; }
  return found.filter(f => f[1] === owner).map(f => f[0]);
}

/* ====================================================================================================
   STATS AND CONDITIONS: a card's real stats after everything is applied
   ==================================================================================================== */

function effOf(e){
  // c = the base card. Cleanse switches off attachments and conditions.
  const c = byId[e.id], cl = hasInf(e, "cleanse"), atts = cl ? [] : e.att.map(a => byId[a]).filter(Boolean), o = {};
  const cd = cl ? [] : (e.cond || []), strip = cd.includes("Sickly");
  // presc: total of one stat granted by attached prescriptions.
  const presc = k => atts.reduce((t,p) => t + (p.type === "prescription" ? (+p[k] || 0) : 0), 0);
  // Base stats plus prescriptions (items only have Health).
  for (const k of ["attack","health","red_points","green_points"]){
    if (c.type === "item" && k !== "health") continue;
    o[k] = Math.max(0, (+c[k] || 0) + presc(k));
  }
  // Pack bonus: +X / +X for the other Pack characters in play.
  const pb = packBonus(e);
  if (pb){ o.attack = (o.attack || 0) + pb; o.health = (o.health || 0) + pb; o.pack_bonus = `+${pb} / +${pb}`; }
  // Scientists boost every one-star character.
  if (c.type === "character" && c.tier === 1 && scientistN() > 0){ const sn = scientistN(); o.attack = (o.attack || 0) + sn; o.health = (o.health || 0) + sn; o.sci_bonus = `+${sn} / +${sn}`; }
  if (c.type === "character"){
    const u = a => [...new Set(a)];
    // Merge enchantments, conditions and immunities from the card, its attachments and Learn.
    o.innate_enchantment = u([...(strip ? [] : asArr(c.innate_enchantment)), ...atts.flatMap(p => asArr(p.enchantment_add)), ...atts.filter(p => p.type === "enchantment").map(p => p.name)]);
    o.innate_condition = u([...(strip ? [] : asArr(c.innate_condition)), ...atts.flatMap(p => p.type === "prescription" && !HOST_COND.includes(p.id) ? asArr(p.condition_add) : [])]);
    o.condition_invulnerability = u([...atts.flatMap(p => asArr(p.condition_invulnerability)), ...(cl ? [] : asArr(e.imm))]);   // + immunities granted by Cleanse
    learnSrc(e).forEach(lc => { o.innate_enchantment = u([...o.innate_enchantment, ...asArr(lc.innate_enchantment)]); o.innate_condition = u([...o.innate_condition, ...asArr(lc.innate_condition)]); });
    // How many Parallel enchantments there are (decides how many copies return to hand).
    o.parallel_n = (strip ? 0 : asArr(c.innate_enchantment).filter(n => n === "Parallel").length)
      + atts.reduce((t, p) => t + (p.type === "prescription" ? asArr(p.enchantment_add).filter(n => n === "Parallel").length : (p.type === "enchantment" && (p.enchantment_add || p.name) === "Parallel") ? 1 : 0), 0);
    const has = n => o.innate_enchantment.includes(n);
    // every source of an enchantment counts: innate, prescriptions, enchantment cards, Learn
    const en = {};
    const addEn = n => { en[n] = (en[n] || 0) + 1; };
    (strip ? [] : asArr(c.innate_enchantment)).forEach(addEn);
    atts.forEach(p => { asArr(p.enchantment_add).forEach(addEn); });
    atts.filter(p => p.type === "enchantment" && !asArr(p.enchantment_add).length).forEach(p => addEn(p.name));
    learnSrc(e).forEach(lc => asArr(lc.innate_enchantment).forEach(addEn));
    o.en_n = en;
    const nE = n => en[n] || 0;
    // Bloodlust / Toxic add attack from Red / Green Points, once per copy.
    if (has("Bloodlust")) o.attack += o.red_points * nE("Bloodlust");
    if (has("Toxic")) o.attack += o.green_points * nE("Toxic");
    // Situational stats: Adrenaline (while attacking) and Defender (while blocking).
    o.when = [];
    if (has("Adrenaline")) o.when.push({ key: "atk", label: "Attacking", attack: o.attack, health: o.health + o.red_points * nE("Adrenaline") });
    if (has("Defender")) o.when.push({ key: "blk", label: "Blocking", attack: o.attack, health: o.health + o.green_points * nE("Defender") });
    // conditions
    let dA = 0, dH = 0;
    const np = nPresc(e);
    const ck = n => cd.filter(x => x === n).length;
    dH -= o.green_points * ck("High");
    dA -= e.att.length * ck("Overdose");
    dH -= cd.length * ck("Compromised");
    dH -= ck("Beartrap");
    // Frozen: -1/-1 per copy.
    dA -= ck("Frozen"); dH -= ck("Frozen");
    // Venom: -1/-1 for every other Venom character on this team (an evil Pack).
    const vp = venomPen(e, cd); if (vp){ dA -= vp; dH -= vp; o.venom = `−${vp} / −${vp}`; }
    dA += np * ck("Roided"); dH -= np * ck("Roided");
    // Apply the condition changes to the base and situational stats (never below 0).
    const fix = x => { x.attack = Math.max(0, x.attack + dA); x.health = Math.max(0, x.health + dH); };
    fix(o); o.when.forEach(fix);
    // Relapse: attack is 0 while blocking.
    if (cd.includes("Relapse")){
      let b = o.when.find(w => w.key === "blk");
      if (!b){ b = { key: "blk", label: "Blocking", attack: o.attack, health: o.health }; o.when.push(b); }
      b.attack = 0;
    }
    // Swap: attack and health trade places.
    const sw = x => { const t = x.attack; x.attack = x.health; x.health = t; };
    if (hasInf(e, "swap")){ sw(o); o.when.forEach(sw); }
    o.infl = (e.inf || []).map(x => inflName(x.id));
    o.noAttack = hasInf(e, "enfeeble") || !!e.enf; o.noBlock = hasInf(e, "hinder") || !!e.hin;
  }
  if (c.type === "item") o.noBlock = true; // items never block in the attack phase; they only soak damage that gets through
  // Damage taken this turn lowers Health.
  const dd = e.dmg || 0;
  if (dd){ o.health = Math.max(0, (o.health || 0) - dd); (o.when || []).forEach(w => { w.health = Math.max(0, w.health - dd); }); }
  return o;
}

/* ====================================================================================================
   CARD HTML: stat blocks, card faces, overlays
   ==================================================================================================== */

function statsHTML(c, ov, sx){
  const eff = !!ov, signed = c.type === "prescription";
  const val = k => (ov && k in ov) ? ov[k] : c[k];
  const tiles = (NUMT[c.type] || []).map(k => {
    const v0 = +val(k) || 0, sur = k === "blood_cost" ? (sx || 0) : 0, v = v0 + sur;
    if (!v) return "";
    const base = +c[k] || 0;
    const cls = k === "blood_cost" ? "blood" : k === "dry_blood_cost" ? "dry" : (eff && v > base) ? "up" : (eff && v < base) ? "dn" : "";
    return `<div class="${cls}"><i>${NUMF[k]}</i><b>${signed && v > 0 && !/cost/.test(k) ? "+" : ""}${v}</b>${sur ? `<small>${v0} + ${sur} Pack</small>` : ""}</div>`;
  }).join("");
  const trs = (TRAITF[c.type] || []).map(([k,l,l2]) => {
    let label = eff && l2 ? l2 : l;
    if (HOST_COND.includes(c.id) && k === "condition_add") label = "Afflicts Host With";
    if (!label) return "";
    let v = val(k);
    if (v === true) v = "Yes";
    if (Array.isArray(v)) v = v.join(", ");
    return v ? `<div><i>${label}</i><b>${esc(v)}</b></div>` : "";
  }).join("");
  const head = `${cap(c.type)}${c.tier ? " · " + "★".repeat(c.tier) : ""}${c.pack ? " · Pack" : ""}`;
  let names = [];
  if (c.type === "character") names = eff ? asArr(ov.innate_enchantment) : asArr(c.innate_enchantment);
  else if (c.type === "prescription") names = asArr(c.enchantment_add);
  else if (c.type === "enchantment") names = [c.enchantment_add || c.name];
  const en = names.map(n => `<div class="en"><b>${esc(n)}</b><span>${esc(enchText(n, c.type === "character" && eff ? ov : null))}</span></div>`).join("");
  let cn = [], cpre = "Inflicts it. Afflicted characters:";
  if (c.type === "character") cn = eff ? asArr(ov.innate_condition) : asArr(c.innate_condition);
  else if (c.type === "prescription"){ cn = asArr(c.condition_add); cpre = HOST_COND.includes(c.id) ? "Put on the host when attached. Effect:" : "Lets the host inflict it. Afflicted characters:"; }
  const cds = [...new Set(cn.map(cnorm).filter(Boolean))].map(n => `<div class="en cn"><b>${c.type === "character" ? "Innate condition: " : "Condition: "}${esc(n)}</b><span>${esc(cpre + " " + (COND[n] || ""))}</span></div>`).join("");
  const dsc = c.type === "envision" ? ENVD[c.name] : c.type === "infliction" ? INFL[c.name] : "";
  const dscH = dsc ? `<div class="en"><b>${esc(c.name)}</b><span>${esc(dsc)}</span></div>` : "";
  const ins = eff && ov.infl && ov.infl.length ? ov.infl.map(n => `<div class="en inf"><b>Infliction: ${esc(n)}</b><span>${esc(INFL[n] || "")}</span></div>`).join("") : "";
  return `<div class="sh">${head}</div>${tiles ? `<div class="sg">${tiles}</div>` : ""}${trs ? `<div class="sg tr">${trs}</div>` : ""}${dscH}${en}${cds}${ins}`;
}

// Compact stat bar shown on a board slot.
function sbHTML(e){
  const c = byId[e.id];
  if (!c || !["character","item"].includes(c.type)) return { html: "", h: 0 };
  const o = effOf(e);
  const cell = (l, v, ref) => `<span class="${v > ref ? "up" : v < ref ? "dn" : ""}"><i>${l}</i>${v}</span>`;
  const base = k => +c[k] || 0;
  let html = `<div class="sb" title="Attack / Health, including attached cards">${c.type === "character" ? cell("ATK", o.attack, base("attack")) + "<em>/</em>" + cell("HP", o.health, base("health")) : cell("HP", o.health, base("health"))}</div>`;
  let h = 28;
  for (const w of (o.when || [])){
    html += `<div class="sb cond ${w.key}" title="Stats while ${w.label.toLowerCase()}"><i class="cl">${w.label}</i><span class="sv">${cell("ATK", w.attack, o.attack)}<em>/</em>${cell("HP", w.health, o.health)}</span></div>`;
    h += 40;
  }
  return { html, h };
}

// HTML for one card in the hand / discard / builder.
function cardHTML(id, i, zone, g, o = {}){
  const c = byId[id], t = c.tier || 0;
  const fresh = zone === "hand" && play.fresh && i >= play.fresh.from;
  const no = play.shake && play.shake.zone === zone && play.shake.i === i;
  const fx = no ? "fx-no" : fresh ? (t === 3 ? "fx-pop fx-sheen fx-glow" : t === 2 ? "fx-pop fx-sheen" : "fx-pop") : "";
  const sparks = (fresh && t === 3) ? Array.from({length: 9}, () => `<i class="sp" style="--x:${Math.random()*88|0}%;--y:${Math.random()*88|0}%;--d:${(Math.random()*0.9).toFixed(2)}s"></i>`).join("") : "";
  return `<div class="c click ${o.main ? "main" : ""} ${t === 3 ? "t3" : ""} ${fx}" data-zone="${zone}" data-i="${i}" ${g ? `data-g="${g}"` : ""} ${c.type === "enchantment" ? `data-ench="${esc(c.name)}"` : ""} tabindex="0" role="button" aria-label="${esc(c.name)}">
    <div class="im"><img src="${esc(img(c))}" alt="${esc(c.name)}">${sparks}</div>${o.n ? `<span class="badge${o.cb ? " sh" : ""}" title="Attached cards">+${o.n}</span>` : ""}${packSur(id, zone) ? `<span class="badge bb" title="Pack surcharge: +${packSur(id, zone)} Blood for each Pack card in play">+${packSur(id, zone)} Blood</span>` : ""}
    <div class="meta"><span class="nm">${esc(c.name)}</span></div>${o.sb || ""}${o.cb || ""}</div>`;
}

// Small chips for a card's conditions, with x2/x3 counts.
function condChips(cd){
  const m = {}; cd.forEach(n => { m[n] = (m[n] || 0) + 1; });
  return Object.entries(m).map(([n, k]) => `<i>${esc(n)}${k > 1 ? " ×" + k : ""}</i>`).join("");
}

// Condition list shown inside the card detail modal.
function cboxHTML(e, i){
  const cd = e.cond || [];
  if (!cd.length) return "";
  return `<span class="cbox" role="button" tabindex="0" data-cbox="${i}" title="Conditions: ${esc(cd.join(", "))}" aria-label="Show conditions">${condChips(cd)}</span>`;
}

// State of the Gloom overlay animation for a slot.
function gloomInfo(i){
  const g = play.gloom;
  if (!g || g.i !== i) return null;
  const el = Date.now() - g.t;
  return el < 2400 ? el : null;
}

// Gloom (dark sparkles) overlay.
function gloomHTML(){
  const sp = Array.from({length: 14}, (_, k) => `<i class="gs" style="--x:${(k * 37) % 90}%;--y:${(k * 23) % 45}%;--s:${26 + (k % 4) * 10}px;--d:${((k * 0.13) % 1).toFixed(2)}s"></i>`).join("");
  return `<div class="gfx" aria-hidden="true">${sp}</div>`;
}

/* ====================================================================================================
   BOARD RULES: limits, Pack / Scientist bonuses
   ==================================================================================================== */

const MAX_ATT = 3, MAX_ITEMS = 4, DRY_CAP = 3;
// Character slots available (3 once any item is in play, otherwise 4).
const maxChars = () => itemCount() > 0 ? 3 : 4;
// Number of items on the board.
const itemCount = () => play.inplay.filter(e => gOf(e.id) !== "character").length;
// Number of characters on the board.
const charCount = () => play.inplay.length - itemCount();
// Pack / Scientist bonuses: which cards count, and how much they add.
const PACK_SELF = false; // false: a Pack card is boosted by the OTHER Pack cards in play. true: it also counts itself.
// While drawing an opponent's field, bonuses are worked out against that field instead of ours.
let FIELD = null; // while drawing an opponent's field, pack / scientist bonuses are worked out against THEIR cards
// The field currently being evaluated.
const fld = () => FIELD || (play ? play.inplay : []);
// Run fn with FIELD temporarily set to the given board.
const withField = (arr, fn) => { const prev = FIELD; FIELD = arr; try { return fn(); } finally { FIELD = prev; } };
// Number of Scientists on the evaluated field.
const scientistN = () => fld().filter(x => x.id === "item-scientist").length;
// Is this board card a Pack character?
const isPackE = e => { const c = byId[e.id]; return !!c && c.type === "character" && !!((c.pack && !isSick(e)) || e.att.some(a => byId[a] && byId[a].pack_add)); };
// Number of Pack characters on the field.
const packCount = () => fld().filter(isPackE).length;
// Pack bonus for one card (the other Pack cards, unless PACK_SELF).
const packBonus = e => isPackE(e) ? Math.max(0, packCount() - (PACK_SELF ? 0 : 1)) : 0;
// Venom penalty: the number of OTHER Venom-afflicted characters on the same team (the evil twin of Pack).
const venomPen = (e, cd) => {
  cd = cd || e.cond || []; if (!cd.includes("Venom") || hasInf(e, "cleanse")) return 0;
  return Math.max(0, fld().filter(x => x !== e && x.uid !== e.uid && !x.dying && gOf(x.id) === "character" && (x.cond || []).includes("Venom")).length);
};
// Visual scale of Pack glow by Pack size.
const packScale = n => 1 + Math.min(0.2, 0.04 * Math.max(0, n - 1));
// Strength of the Pack aura by Pack size.
const packBoost = n => Math.min(0.3, 0.05 + 0.02 * n);
// Envision and Infliction cards are 'quick': they are cast instead of placed on the board.
const isQuick = id => !!byId[id] && ["envision","infliction"].includes(byId[id].type);

/* ====================================================================================================
   QUICK CAST: overlay for Envision and Infliction cards
   ==================================================================================================== */

const CAST_MS = 4800;
let castTimer = null;

// HTML for the cast overlay of a card.
function castHTML(c){
  const env = c.type === "envision";
  const parts = Array.from({length: env ? 28 : 22}, () => `<i class="cp" style="--x:${Math.random()*100|0}%;--s:${3 + (Math.random()*7|0)}px;--d:${(Math.random()*2.4).toFixed(2)}s;--t:${(2.4 + Math.random()*2.2).toFixed(2)}s"></i>`).join("");
  let art;
  if (env){
    const ticks = Array.from({length: 36}, (_, i) => `<line x1="0" y1="-93" x2="0" y2="${i % 3 ? -89 : -84}" transform="rotate(${i*10})"/>`).join("");

// Begin the cast animation for a quick card; the effect applies when it finishes.

// Are all characters on the board Pack characters?

// Death overlay for a dying card (ink-burn effect, stronger with 3 upgrades).

  }

// Mark a character as dying, count the loss, tell the other player and schedule resolveDeath.
function startDeath(ent, auto){
  if (ent.dying) return;
  // dying is a timestamp: the death animation plays until DEATH_MS has passed.
  ent.dying = Date.now();
  ms(m => { if (gOf(ent.id) === "character") m.lost++; });
  if (auto) toast("Defeated", `${byId[ent.id].name} dropped to 0 HP.`, "info");
  netEvent({ k: "defeat", id: ent.id });
  const pl = play;
  // Remove the card once the animation has finished (unless the game was reset meanwhile).
  setTimeout(() => {
    if (play !== pl) return;
    const i = play.inplay.indexOf(ent);
    if (i < 0) return;
    resolveDeath(i);
    renderPlay();
  }, DEATH_MS);
}

// Remove a defeated card: pay out Blood / Dry Blood, return attachments, then discard it or turn it into Mites / Zombie Squirrels / a Parallel copy.
function resolveDeath(idx){
  const ent = play.inplay[idx];
  if (!ent) return;
  // What the card had on it when it died.
  const eo = gOf(ent.id) === "character" ? effOf(ent) : {}, ens = eo.innate_enchantment || [];
  const clean = hasInf(ent, "cleanse");
  const e = play.inplay.splice(idx, 1)[0];
  const bc = byId[e.id];
  // Pay out: +1 Blood (not for tokens or Reduced cards), and Dry Blood for a character with 3 upgrades.
  if (bc && bc.type === "character" && !bc.token && (+bc.blood_cost || 0) > 0 && !hasInf(e, "reduce")){
    addTk("blood", 1, bc.name + " defeated");
    if (e.att.length >= MAX_ATT){ addDryMax(1, bc.name + " had 3 upgrades"); addTk("dry", 1, bc.name + " had 3 upgrades"); }
  }
  // Attachments always go to the discard pile.
  e.att.forEach(pushDiscard);
  dropInf(e);
  // Where the card itself ends up: stolen (Terror), back to hand (Parallel), Zombie Squirrels (Undead), Mites (Parasitic) or discarded.
  if (e.stolen){ toast("Terror", `${byId[e.id].name} was stolen.`, "info"); }
  else if (ens.includes("Parallel")){ const dup = (eo.parallel_n || 0) >= 2; play.hand.push(e.id); if (dup) play.hand.push(e.id); toast("Parallel", dup ? `${byId[e.id].name} returned to your hand, duplicated (2 copies).` : `${byId[e.id].name} returned to your hand.`, "info"); }
  else if (ens.includes("Undead") && (eo.green_points || 0) > 0){ const g = eo.green_points * ((eo.en_n || {}).Undead || 1); for (let q = 0; q < g; q++) play.hand.push(ZSQ.id); toast("Undead", `${byId[e.id].name} turned into ${g} Zombie Squirrel${g === 1 ? "" : "s"}. ${g === 1 ? "It is" : "They are"} in your hand and free to play.`, "info"); }
  else if (!clean && (e.cond || []).includes("Parasitic")){ const pn = (e.cond || []).filter(x => x === "Parasitic").length; for (let q = 0; q < pn; q++) play.hand.push(MITE.id); toast("Parasitic", `${byId[e.id].name} turned into ${pn} Mite${pn === 1 ? "" : "s"}. ${pn === 1 ? "It is" : "They are"} in your hand and free to play.`, "info"); }
  else pushDiscard(e.id);
  if (act) closeAct();
  cmI = null; play.magic = null; play.gloom = null;
}

// Move a card to the hand or the discard pile.
