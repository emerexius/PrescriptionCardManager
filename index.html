/* =====================================================================================================
   AI opponent
   It runs in a hidden copy of this page (opened by "Play vs AI") that joins your room like any other
   player, so it plays by the same rules code you do. It knows every card in its own random deck, sees only
   what a human would see of your side (board, Blood, hand size), and picks its moves with a lookahead
   search that uses the real combat simulator. Nothing here changes how a normal game works.
   ===================================================================================================== */
const AI = { next: 0, busy: false, plan: null, replans: 0, passive: 0, hostAtk: false, lastThink: 0, lastPlanN: 0 };
// AI valuation weights.
const AIW = { tick: 1.5, blood: 0.45, handBase: 0.3, handCost: 0.35, dryMax: 2.5 };
// Bonus for every card the AI has put into play. Grows with the size of its hand, so a full hand makes it develop the board even when there is no immediate gain.
const aiDev = () => 0.5 + 0.3 * Math.max(0, (AI.hand0 || 0) - 3);
// Time left on the turn clock (Infinity if none).
const aiLeft = () => (inGame() && net.tEnd) ? net.tEnd - Date.now() : Infinity;
// Make the AI wait before its next action (shorter when time is short).
const aiPause = ms => { const l = aiLeft(); AI.next = Date.now() + (l < 6000 ? 120 : l < 15000 ? Math.min(ms, 400) : ms); };
// Opponent id (the human).
const aiOppId = () => oppId();
// What the AI can see of the human's side.
const aiOppSt = () => { const id = aiOppId(); return id && net.players[id] ? net.players[id].st : null; };
// The human's board as the AI sees it.
const aiOppBoard = () => { const s = aiOppSt(); return s ? s.inplay : []; };
// Living characters in a board.
const aiChars = b => b.filter(e => byId[e.id] && gOf(e.id) === "character" && !e.dying);
// Aggression grows while the other side sits back.
const aiAggr = () => Math.min(2.2, 1 + 0.12 * AI.passive); // grows while the other side sits back

/* ---------- random deck: 7 one-star, 5 two-star, 3 three-star characters; 30 random other cards ---------- */
function aiNewDeck(){
  const d = {};
  const fill = (pool, n) => {
    let got = 0, guard = 0;
    while (got < n && guard++ < 4000){
      const c = pool[Math.random() * pool.length | 0];
      const have = d[c.id] || 0;
      if (have >= maxCopies(c.id)) continue;
      if (have >= 1 && Math.random() < 0.65) continue; // prefer variety
      d[c.id] = have + 1; got++;
    }
  };
  const ch = t => cards.filter(c => c.type === "character" && !c.token && c.tier === t);
  fill(ch(1), 7); fill(ch(2), 5); fill(ch(3), 3);
  fill(cards.filter(c => c.type !== "character" && !c.token), 30);
  decks = { "AI deck": sanitize(d) }; cur = "AI deck";
}

/* ---------- lean copies of the state for lookahead ---------- */
const aiCloneP = p => ({ blood: p.blood, dry: p.dry, dryCur: p.dryCur, dryMax: p.dryMax, hand: p.hand.slice(), inplay: structuredClone(p.inplay), pile: p.pile, discard: p.discard.slice(),
  turnPlays: p.turnPlays, noPlay: p.noPlay, persuade: p.persuade, control: p.control, doubleNext: p.doubleNext, sacUsed: p.sacUsed, turnN: p.turnN, lastDrawn: p.lastDrawn });

// Copy a lookahead state.
const aiClone = S => ({ p: aiCloneP(S.p), o: structuredClone(S.o) });
// Lookahead state for the real situation right now.
const aiRoot = () => ({ p: aiCloneP(play), o: structuredClone(aiOppBoard()) });

// Run a function with the real game swapped for a lookahead copy.
function aiWith(S, fn){
  const sp = play, st = aiOppSt(), so = st ? st.inplay : null, ss = SIM;
  play = S.p; if (st) st.inplay = S.o; SIM = true;
  try { return fn(); } finally { if (st) S.o = st.inplay; S.p = play; play = sp; if (st) st.inplay = so; SIM = ss; }
}

/* ---------- valuation ---------- */
function aiEntVal(e, board){
  const c = byId[e.id];
  if (!c || e.dying) return 0;
  return withField(board, () => {
    const o = effOf(e);
    if (c.type === "item"){
      const hp = o.health || 0;
      if (e.id === "item-blood-pump") return 3.2 + hp * 0.2;
      if (e.id === "item-scientist") return 0.8 + hp * 0.2;
      if (e.id === "item-bear-trap") return 1.6;
      return hp * 0.5;
    }
    const A = o.attack || 0, H = o.health || 0, en = o.en_n || {}, ens = o.innate_enchantment || [], cd = e.cond || [];
    let v = A * 1.0 + H * 0.75;
    if (ens.includes("Swift")) v += 2.5;
    if (ens.includes("Terror")) v += 2.2 * (en.Terror || 1);
    if (ens.includes("Merciless")) v += 1.4 * (en.Merciless || 1);
    if (ens.includes("Flight")) v += 1.2;
    if (ens.includes("Reach")) v += 0.4;
    if (ens.includes("Shield")) v += 1.5 * (en.Shield || 1);
    if (ens.includes("Parallel")) v += 2.5;
    if (ens.includes("Undead")) v += Math.min(4, (o.green_points || 0) * (en.Undead || 1)) * 0.7;
    if (ens.includes("Gruesome")) v += Math.min(4, (o.red_points || 0) * (en.Gruesome || 1)) * 0.5;
    if (ens.includes("Defender") || ens.includes("Adrenaline")) v += 0.5;
    if ((o.innate_condition || []).includes("Poison") || cd.includes("Poison")) v += 1.4;
    if (cd.includes("Sickly")) v -= 1.5;
    v += 0.6 * cd.filter(x => x === "Parasitic").length;
    v -= 0.3 * cd.filter(x => x !== "Poison" && x !== "Parasitic").length;
    return v;
  });
}
// rough ticker damage a side could push per turn: attackers beyond the other side's blockers, after item soak
function aiPressure(att, def){
  const A = aiChars(att).map(e => withField(att, () => effOf(e))).filter(o => !o.noAttack).sort((a, b) => (b.attack || 0) - (a.attack || 0));
  // blockers: ground ones can stop anything that doesn't fly, Flight/Reach ones can also stop fliers
  const bl = aiChars(def).map(e => withField(def, () => effOf(e))).filter(o => !o.noBlock);
  let fly = bl.filter(o => hasEns(o, "Flight") || hasEns(o, "Reach")).length, ground = bl.length - fly, open = 0;
  A.forEach(o => {
    if (hasEns(o, "Flight")){ if (fly > 0) fly--; else open += o.attack || 0; }
    else if (ground > 0) ground--; else if (fly > 0) fly--; else open += o.attack || 0;
  });
  const soak = def.filter(e => byId[e.id] && gOf(e.id) !== "character" && !e.dying).reduce((t, e) => t + (withField(def, () => effOf(e)).health || 0), 0);
  return Math.max(0, open - soak);
}

// Value of the cards in hand.
function aiHandVal(S){
  let v = 0;
  S.p.hand.forEach(id => { const c = byId[id]; if (!c) return; v += AIW.handBase + AIW.handCost * ((+c.blood_cost || 0) + (c.type === "character" ? (+c.dry_blood_cost || 0) * 2 : 0)); });
  return v;
}

// Score a whole position.
function aiStatic(S){
  const P = S.p.inplay, O = S.o;
  let v = 0;
  P.forEach(e => { v += aiEntVal(e, P); });
  O.forEach(e => { v -= aiEntVal(e, O); });
  v += ((S.p.blood || 0) + (S.p.dryCur || 0) * 0.9) * AIW.blood / Math.sqrt(aiAggr());
  v += (S.p.dryMax || 0) * AIW.dryMax;
  const needTok = S.p.hand.some(id => (+byId[id].dry_blood_cost || 0) > 0) || S.p.pile.character.some(id => (+byId[id].dry_blood_cost || 0) > 0);
  v += (S.p.dry || 0) * (needTok ? 1.8 : 0.5);
  v += aiHandVal(S);
  v += AIW.tick * 0.6 * (aiPressure(P, O) * aiAggr() - aiPressure(O, P));
  v += aiDev() * P.reduce((t, e) => t + (byId[e.id] && !e.dying ? 1 + (e.att || []).length : 0), 0);   // cards on the board count for something
  return v;
}

/* ---------- combat evaluation (from the attacker's point of view) ---------- */
function aiSim(att, asg, A, D, perAtt, perDef){
  const sv = play.persuade; play.persuade = perAtt;
  try { return simulate(att, asg, A, D, perDef); } finally { play.persuade = sv; }
}
// botAtt: the bot is attacking (so a lethal ticker swing is a win), otherwise the host is attacking
function aiResultVal(R, att, A, D, botAtt){
  const m = myPts(); // points toward the bot (positive) or the host (negative); 30 loses
  const k = botAtt ? aiAggr() : 1;
  let v = AIW.tick * k * (R.toDef - R.toAtt) + AIW.blood * (R.mb - R.tb);
  const nm = botAtt ? m - (R.toDef - R.toAtt) : m + (R.toDef - R.toAtt);
  if (botAtt){ if (nm <= -SC_MAX) v += 1000; else if (nm >= SC_MAX) v -= 1000; else v += 0.04 * Math.max(0, -nm) * Math.max(0, -nm); }
  else { if (nm >= SC_MAX) v += 1000; else if (nm <= -SC_MAX) v -= 1000; else v += 0.04 * Math.max(0, nm) * Math.max(0, nm); }
  const lose = (arr, sign) => arr.forEach(e => {
    if (R.dead.has(e.uid)) v += sign * aiEntVal(e, arr);
    else if (gOf(e.id) !== "character"){ const dm = (sign < 0 ? R.md : R.td)[e.uid] || 0; if (dm) v += sign * 0.3 * dm; }
  });
  lose(A, -1);
  lose(D, +1);
  v += 1.6 * R.mh.length - 1.6 * R.th.length;
  v -= 0.8 * Object.values(R.mc).reduce((t, a) => t + a.length, 0);
  v += 0.8 * Object.values(R.tc).reduce((t, a) => t + a.length, 0);
  return v;
}

// Blocking choices for an attacker.
function aiBlockOpts(attE, A, D){
  const aO = withField(A, () => effOf(attE));
  return D.filter(e => byId[e.id] && gOf(e.id) === "character" && !e.dying).map(e => ({ e, bO: withField(D, () => effOf(e)) })).filter(x => !x.bO.noBlock && blockOK(aO, x.e, x.bO));
}
// every legal assignment of defenders to the attackers (in order), capped
function aiAssignments(att, A, D, cap){
  const opts = att.map(a => aiBlockOpts(a, A, D));
  const out = [], cur = [], use = {};
  (function rec(i){
    if (out.length >= cap) return;
    if (i === att.length){ out.push(cur.slice()); return; }
    cur[i] = null; rec(i + 1);
    for (const x of opts[i]){
      const u = x.e.uid, k = use[u] || 0;
      if (k >= capOf(x.bO, x.e)) continue;
      use[u] = k + 1; cur[i] = u; rec(i + 1); use[u] = k; cur[i] = null;
    }
  })(0);
  return out;
}
// the attacker picks who attacks; the defender then answers with the block that is worst for the attacker
function aiAttackMinimax(A, D, perAtt, perDef, eligible, deadline, botAtt){
  let best = { v: 0, set: [], asg: [] };
  const att0 = eligible.slice().sort((a, b) => ((withField(A, () => effOf(b)).attack || 0) - (withField(A, () => effOf(a)).attack || 0)));
  const n = att0.length;
  for (let mask = 1; mask < (1 << n); mask++){
    if (Date.now() > deadline) break;
    const att = att0.filter((_, i) => mask & (1 << i));
    const asgs = aiAssignments(att, A, D, att.length > 2 ? 150 : 260);
    let worst = Infinity, wasg = null;
    for (const asg of asgs){
      const v = aiResultVal(aiSim(att, asg, A, D, perAtt, perDef), att, A, D, botAtt);
      if (v < worst){ worst = v; wasg = asg; }
    }
    if (worst > best.v + 1e-9) best = { v: worst, set: att.map(e => e.uid), asg: wasg || [] };
  }
  return best;
}

// Can this card attack?
const aiCanAttack = (e, board) => !e.dying && gOf(e.id) === "character" && !withField(board, () => effOf(e)).noAttack && !(inGame() && e.born === net.g.n);

/* ---------- the actions (this version only runs on lookahead copies; the real thing goes through aiDo) ---------- */
function aiRun(a){
  const i = play.hand.indexOf(a.id);
  if (i < 0 || play.noPlay) return false;
  const id = a.id, c = byId[id];
  const mk = () => ({ id, att: [], cond: [], inf: [], uid: uid(), born: inGame() ? net.g.n : -1 });
  if (a.k === "char"){
    if (c.type !== "character" || charCount() >= maxChars() || costLack(id, "hand")) return false;
    payCost(id, "hand"); play.hand.splice(i, 1); play.inplay.push(mk()); return true;
  }
  if (a.k === "item"){
    if (c.type !== "item" || itemCount() >= MAX_ITEMS || charCount() > 3 || costLack(id, "hand")) return false;
    payCost(id, "hand"); play.hand.splice(i, 1); play.inplay.push(mk()); return true;
  }
  if (a.k === "att"){
    const si = play.inplay.findIndex(e => e.uid === a.tuid), e = play.inplay[si];
    if (!isAttach(id) || !e || gOf(e.id) !== "character" || e.dying || e.att.length >= MAX_ATT || costLack(id, "hand")) return false;
    payCost(id, "hand"); play.hand.splice(i, 1); e.att.push(id); purgeImmune(e, true);
    if (HOST_COND.includes(id)) applyHostCond(id, e, si);
    return true;
  }
  if (a.k === "infl"){
    const k = inflKey(id), ent = (a.own ? play.inplay : aiOppBoard()).find(e => e.uid === a.tuid);
    if (!ent || gOf(ent.id) !== "character" || ent.dying || costLack(id)) return false;
    if (k === "contaminate" || k === "infest"){
      payCost(id); play.hand.splice(i, 1); pushDiscard(id);
      withField(a.own ? play.inplay : aiOppBoard(), () => doInfect(ent, k));
      return true;
    }
    if (k === "enfeeble" || k === "hinder"){   // one-shot now: a flag on the target that lasts until it blocks / lands a direct hit
      payCost(id); play.hand.splice(i, 1); pushDiscard(id);
      if (k === "enfeeble") ent.enf = true; else ent.hin = true;
      return true;
    }
    if (!TOGGLE.includes(k)) return false;
    if (k === "learn" && !(asArr(byId[ent.id].innate_enchantment).length || asArr(byId[ent.id].innate_condition).length)) return false;
    payCost(id); play.hand.splice(i, 1);
    ent.inf = ent.inf || []; ent.inf.push({ id, by: me(), exp: expFor(!!a.own) });
    return true;
  }
  if (a.k === "env"){
    const k = id.replace("envision-", "");
    if (!["promote", "persuade", "control"].includes(k) || costLack(id) || envCheck(id, "hand", i)) return false;
    payCost(id); play.hand.splice(i, 1); envApply(id); return true;
  }
  return false;
}

// List every action the AI could take now.
function aiGenActs(){
  const out = [], seen = new Set();
  for (const id of play.hand){
    if (seen.has(id)) continue;
    seen.add(id);
    const c = byId[id];
    if (!c) continue;
    if (c.type === "character") out.push({ k: "char", id });
    else if (c.type === "item") out.push({ k: "item", id });
    else if (isAttach(id)) play.inplay.forEach(e => { if (gOf(e.id) === "character" && !e.dying && e.att.length < MAX_ATT) out.push({ k: "att", id, tuid: e.uid }); });
    else if (c.type === "infliction" && inflKey(id) === "reduce"){
      aiOppBoard().forEach(e => { if (gOf(e.id) === "character" && !e.dying && play.hand.includes(e.id) && !hasInf(e, "reduce") && (+byId[e.id].blood_cost || 0) > 0) out.push({ k: "infl", id, tuid: e.uid, own: false }); });
    }
  }
  return out;
}

/* ---------- the same actions, for real: go through the game's own click handlers ---------- */
function aiDo(a){
  const n0 = play.hand.filter(x => x === a.id).length;
  if (n0 < 1) return false;
  act = { zone: "hand", i: play.hand.indexOf(a.id) };
  try {
    if (a.k === "char" || a.k === "item") doAct("play");
    else if (a.k === "att"){
      doAct("play");
      if (play.pick){ const si = play.inplay.findIndex(e => e.uid === a.tuid); if (si >= 0) finishPick(si); play.pick = null; }
    } else if (a.k === "infl"){
      doAct("activate");
      if (play.tgt){
        if (a.own) finishTgt({ own: true, si: play.inplay.findIndex(e => e.uid === a.tuid) });
        else finishTgt({ own: false, pid: aiOppId(), oi: aiOppBoard().findIndex(e => e.uid === a.tuid) });
        play.tgt = null;
      }
    } else if (a.k === "env") doAct("activate");
  } finally { act = null; closeAct(); }
  return play.cl ? true : play.hand.filter(x => x === a.id).length < n0;
}
// Retaliate / Decide / Peer / Clone leave a choice or a popup open; settle it
function aiSettleEm(){
  const em = play.em; if (!em) return false;
  if (em.k === "retaliate"){
    em.sides.forEach(sd => {
      if (sd.pick !== null) return;
      const board = sd.owner === "me" ? play.inplay : (net.players[sd.owner].st || { inplay: [] }).inplay;
      let bi = 0, bv = sd.owner === "me" ? Infinity : -Infinity;
      sd.c.forEach((x, j) => { const ent = board.find(e => e.uid === x.uid), v = ent ? aiEntVal(ent, board) : 0; if (sd.owner === "me" ? v < bv : v > bv){ bv = v; bi = j; } });
      sd.pick = bi;
    });
    retaliateGo();
  } else if (em.k === "decide"){
    const chars = play.inplay.filter(e => gOf(e.id) === "character" && !e.dying).length, afford = (play.blood || 0) + (play.dryCur || 0);
    const order = [];
    if (chars < 3) order.push(afford >= 5 && play.dry > 0 ? "c3" : null, afford >= 3 ? "c2" : null, "c1");
    order.push(chars ? "enchantment" : null, chars ? "prescription" : null, "c2", "c1", "infliction", "envision", "c3");
    const key = order.find(k => k && countPile(DECIDE.find(d => d[0] === k)[2])) || DECIDE.find(d => countPile(d[2]))[0];
    const id = takeFrom(DECIDE.find(d => d[0] === key)[2]);
    play.em = null;
    if (id){ const b0 = play.hand.length; drawn(id); play.fresh = { from: b0 }; }
  } else if (em.k === "peer"){
    AI.peek = { n: net.g.n, hand: (em.hand || []).slice() };
    play.em = null;
  } else play.em = null;
  return true;
}

// Rank Clone targets.
const aiCloneScore = id => 1 + 0.4 * (+byId[id].blood_cost || 0) + (costLack(id) ? 0 : 1.5);

// Answer the Clone dialog.
function aiSettleCl(){
  const c = play.cl; if (!c) return;
  const list = zl(c.zone);
  let opt = c.opts.find(o => o.id === AI.cloneWant) || c.opts.slice().sort((x, y) => aiCloneScore(y.id) - aiCloneScore(x.id))[0];
  if (!opt || list[c.i] !== c.id || costLack(c.id)){ play.cl = null; return; }
  payCost(c.id); list.splice(c.i, 1); pushDiscard(c.id);
  play.hand.push(opt.id); play.fresh = { from: play.hand.length - 1 };
  play.cl = null;
}
// the clone options a character offers (same list the game builds)
function aiCloneOpts(e, board){
  const c0 = byId[e.id], strip = (e.cond || []).includes("Sickly");
  const out = e.att.filter(a => byId[a] && ["enchantment", "prescription"].includes(byId[a].type));
  if (!strip) asArr(c0.innate_enchantment).forEach(n => { const ec = ENCHCARD(n); if (ec && !out.includes(ec.id)) out.push(ec.id); });
  return out;
}
// free cards worth casting before planning the turn (they change what we hold)
function aiPre(){
  if (play.noPlay) return null;
  const f = AI.preDone && AI.preDone.n === net.g.n ? AI.preDone : (AI.preDone = { n: net.g.n });
  const ok = id => play.hand.includes(id) && !f[id];
  if (ok("envision-decide") && DECIDE.some(d => countPile(d[2]))){ f["envision-decide"] = 1; return { k: "env", id: "envision-decide" }; }
  if (ok("envision-peer") && peerTargets().length){ f["envision-peer"] = 1; return { k: "env", id: "envision-peer" }; }
  if (ok("infliction-clone")){
    let best = null;
    [[play.inplay, true], [aiOppBoard(), false]].forEach(([board, own]) => aiChars(board).forEach(e => aiCloneOpts(e, board).forEach(id => { const s = aiCloneScore(id); if (!best || s > best.s) best = { s, k: "infl", id: "infliction-clone", tuid: e.uid, own, want: id }; })));
    f["infliction-clone"] = 1;
    if (best){ AI.cloneWant = best.want; return best; }
  }
  if (ok("envision-backtrack") && play.lastDrawn && byId[play.lastDrawn] && play.hand.includes(play.lastDrawn)){
    const c = byId[play.lastDrawn], need = (+c.blood_cost || 0), have = (play.blood || 0) + (play.dryCur || 0);
    const stuck = (+c.dry_blood_cost || 0) > (play.dry || 0) || need > have + 3;
    f["envision-backtrack"] = 1;
    if (stuck && countPile(sameKind(c))) return { k: "env", id: "envision-backtrack" };
  }
  return null;
}
/* ---------- the planner ---------- */
const aiSig = acts => acts.map(a => a.k + a.id + (a.tuid || "")).sort().join("|");

// Beam search over action sequences.
function aiBeam(S0, deadline, width){
  const root = { S: S0, acts: [], v: aiWith(S0, () => aiStatic(S0)) };
  let beam = [root]; const all = [root];
  for (let depth = 0; depth < 7 && Date.now() < deadline; depth++){
    const next = [], seen = new Set();
    for (const node of beam){
      const list = aiWith(node.S, () => aiGenActs());
      for (const a of list){
        const S2 = aiClone(node.S);
        if (!aiWith(S2, () => aiRun(a))) continue;
        const acts = [...node.acts, a], sig = aiSig(acts);
        if (seen.has(sig)) continue;
        seen.add(sig);
        next.push({ S: S2, acts, v: aiWith(S2, () => aiStatic(S2)) });
      }
    }
    if (!next.length) break;
    next.sort((x, y) => y.v - x.v);
    beam = next.slice(0, width);
    all.push(...beam);
  }
  return all;
}

// Value of the best attack from a position.
function aiAttackEval(S, deadline){
  return aiWith(S, () => {
    const A = S.p.inplay, D = S.o, st = aiOppSt();
    const elig = A.filter(e => aiCanAttack(e, A));
    if (!elig.length) return { v: 0, set: [], asg: [] };
    return aiAttackMinimax(A, D, !!S.p.persuade, !!(st && st.per), elig, deadline, true);
  });
}
// how much the host could hurt us next turn if we did nothing more (host picks attackers, we defend as well as we can)
function aiThreat(S, deadline){
  return aiWith(S, () => {
    const H = S.o, B = S.p.inplay;
    const elig = H.filter(e => byId[e.id] && gOf(e.id) === "character" && !e.dying && !withField(H, () => effOf(e)).noAttack);
    if (!elig.length) return 0;
    return aiAttackMinimax(H, B, false, !!S.p.persuade, elig, deadline, false).v;
  });
}

// Plan the whole turn.
function aiThink(){
  const t0 = Date.now(), left = aiLeft(), budget = left < 15000 ? 350 : left < 30000 ? 800 : 1500, deadline = t0 + budget;
  const S0 = aiRoot();
  AI.hand0 = play.hand.length;
  const leaves = aiBeam(S0, t0 + budget * 0.5, 12);
  leaves.sort((a, b) => b.v - a.v);
  const cand = [], seen = new Set();
  for (const n of leaves){ const s = aiSig(n.acts); if (seen.has(s)) continue; seen.add(s); cand.push(n); if (cand.length >= 4) break; }
  if (!seen.has("")) cand.push(leaves.find(n => !n.acts.length));
  let best = null;
  for (const n of cand){
    if (!n) continue;
    const atk = aiAttackEval(n.S, deadline);
    let opt = { acts: n.acts.slice(), atk, tot: n.v + atk.v, S: n.S };
    // Hinder the best blocker right before attacking
    const hinder = n.S.p.hand.find(id => id === "infliction-hinder");
    if (hinder && Date.now() < deadline){
      for (const b of aiChars(n.S.o).sort((a, b) => aiEntVal(b, n.S.o) - aiEntVal(a, n.S.o)).slice(0, 2)){
        const S2 = aiClone(n.S), a = { k: "infl", id: hinder, tuid: b.uid, own: false };
        if (!aiWith(S2, () => aiRun(a))) continue;
        const a2 = aiAttackEval(S2, deadline), t2 = aiWith(S2, () => aiStatic(S2)) + a2.v - 0.8;
        if (t2 > opt.tot + 0.5) opt = { acts: [...n.acts, a], atk: a2, tot: t2, S: S2 };
      }
    }
    if (!best || opt.tot > best.tot) best = opt;
  }
  best = best || { acts: [], atk: { v: 0, set: [], asg: [] }, tot: 0, S: S0 };
  const plan = { acts: best.acts, i: 0, attack: best.atk.v > 0.6 && best.atk.set.length ? best.atk : null, extra: [], control: false, persuade: false, sac: null };
  const S1 = best.S;
  // Control: when we are attacking and hold it, would choosing the blocks ourselves clearly beat their best defence?
  if (plan.attack && S1.p.hand.includes("envision-control") && Date.now() < deadline + 300){
    const ctl = aiWith(S1, () => {
      const A = S1.p.inplay, D = S1.o, st = aiOppSt();
      const att = plan.attack.set.map(u => A.find(e => e.uid === u)).filter(Boolean);
      let bv = -Infinity;
      aiAssignments(att, A, D, 200).forEach(asg => {
        if (ctlCheck({ uids: att.map(e => e.uid), asg }, D)) return;
        const v = aiResultVal(aiSim(att, asg, A, D, !!S1.p.persuade, !!(st && st.per)), att, A, D, true);
        if (v > bv) bv = v;
      });
      return bv;
    });
    if (ctl > plan.attack.v + 1.5) plan.control = true;
  }
  // defence tools for the turn after this one
  const threat = aiThreat(S1, deadline + 300);
  const hasCard = id => S1.p.hand.includes(id);
  if (hasCard("envision-persuade") && !plan.control && (plan.attack ? (threat > plan.attack.v + 6 && plan.attack.v < 2) : threat > 3)){
    plan.persuade = true;
    if (plan.attack && plan.attack.v < 2) plan.attack = null;
  }
  if (!plan.persuade && hasCard("infliction-enfeeble") && threat > 2.5){
    let bestT = null, bestD = 0;
    aiChars(S1.o).forEach(e => {
      const S2 = aiClone(S1);
      if (!aiWith(S2, () => aiRun({ k: "infl", id: "infliction-enfeeble", tuid: e.uid, own: false }))) return;
      const d = threat - aiThreat(S2, deadline + 500);
      if (d > bestD){ bestD = d; bestT = e.uid; }
    });
    if (bestT && bestD >= 2.5) plan.extra.push({ k: "infl", id: "infliction-enfeeble", tuid: bestT, own: false });
  }
  if (hasCard("envision-promote") && S1.p.inplay.some(e => gOf(e.id) === "character" && byId[e.id].tier === 1 && !e.dying)) plan.extra.unshift({ k: "env", id: "envision-promote" });
  if (hasCard("infliction-hypnotize") && play.pile.other.length){
    const t = aiChars(S1.o).sort((a, b) => (withField(S1.o, () => effOf(b)).attack || 0) - (withField(S1.o, () => effOf(a)).attack || 0))[0];
    if (t && (withField(S1.o, () => effOf(t)).attack || 0) >= 2) plan.extra.push({ k: "infl", id: "infliction-hypnotize", tuid: t.uid, own: false });
  }
  if (hasCard("envision-retaliate")){
    const top = b => Math.max(0, ...aiChars(b).map(e => cardCost(e.id)));
    if (top(S1.o) >= top(S1.p.inplay) + 3) plan.extra.push({ k: "env", id: "envision-retaliate" });
  }
  aiTools(S1, plan, t0 + budget + 1200);
  if (plan.attack && AI.peek && AI.peek.n === net.g.n && AI.peek.hand.includes("envision-persuade") && plan.attack.v < 4) plan.attack = null; // they can wipe the attack with Persuade
  // Tokens only come from sacrificing a fully loaded character, and 3-star cards need one: do it when the turn has nothing better
  const needTok = !play.dry && play.hand.some(id => (+byId[id].dry_blood_cost || 0) > 0);
  if (!play.sacUsed && !play.turnPlays && (!plan.acts.length || needTok)){
    const cand2 = play.inplay.filter(e => gOf(e.id) === "character" && !e.dying && e.att.length >= MAX_ATT && (+byId[e.id].blood_cost || 0) > 0 && !hasInf(e, "reduce"));
    if (cand2.length && (!plan.acts.length || best.tot < aiWith(S0, () => aiStatic(S0)) + 4)) plan.sac = cand2.sort((a, b) => aiEntVal(a, play.inplay) - aiEntVal(b, play.inplay))[0].uid;
  }
  // Fliers on their side and nothing of ours can block them: if a Flight/Reach character is stuck in hand for lack of a free slot or a Token, sacrifice to make room for it
  if (!play.sacUsed && !play.turnPlays){ const fs = aiFlightSac(); if (fs) plan.sac = fs; }
  if (plan.sac){ plan.acts = []; plan.extra = []; plan.control = false; plan.persuade = false; }
  AI.lastThink = Date.now() - t0;
  return plan;
}

// Who should be sacrificed so that a Flight/Reach blocker can be played next turn? (null if that isn't needed or isn't possible)
function aiFlightSac(){
  const oppB = aiOppBoard();
  const fliers = aiChars(oppB).map(e => withField(oppB, () => effOf(e))).filter(o => !o.noAttack && hasEns(o, "Flight"));
  if (fliers.reduce((t, o) => t + (o.attack || 0), 0) < 3) return null;
  const mine = aiChars(play.inplay);
  if (mine.some(e => { const o = effOf(e); return !o.noBlock && (hasEns(o, "Flight") || hasEns(o, "Reach")); })) return null;
  const stuck = play.hand.map(id => byId[id]).filter(c => c && c.type === "character" && asArr(c.innate_enchantment).some(n => n === "Flight" || n === "Reach"));
  if (!stuck.length) return null;
  const needSlot = charCount() >= maxChars();
  const needTok = stuck.some(c => (+c.dry_blood_cost || 0) > (play.dryCur || 0) + (play.dry || 0) && (+c.blood_cost || 0) <= (play.blood || 0) + 1);
  let cand = [];
  if (needSlot) cand = mine;                                             // any character frees a slot
  else if (needTok) cand = mine.filter(e => e.att.length >= MAX_ATT);    // only a fully loaded one gives a Token
  if (!cand.length) return null;
  return cand.slice().sort((a, b) => aiEntVal(a, play.inplay) - aiEntVal(b, play.inplay))[0].uid;
}

// everything else that alters the board: try each on a copy, keep what makes the position clearly better
function aiTools(S1, plan, deadline){
  const sc = (S, th) => aiWith(S, () => aiStatic(S)) + aiAttackEval(S, deadline).v - (th ? 0.8 * aiThreat(S, deadline) : 0);
  const baseNoTh = sc(S1, false), baseTh = sc(S1, true);
  const had = id => S1.p.hand.includes(id);
  const margin = 0.8;
  const tryInfl = (id, keys) => {
    if (!had(id) || Date.now() > deadline) return;
    let best = null;
    [[S1.p.inplay, true], [S1.o, false]].forEach(([board, own]) => aiChars(board).forEach(e => {
      if (Date.now() > deadline) return;
      const a = { k: "infl", id, tuid: e.uid, own };
      const k = inflKey(id), samples = k === "contaminate" ? 3 : 1;
      let tot = 0, n = 0;
      for (let q = 0; q < samples; q++){
        const S2 = aiClone(S1);
        if (!aiWith(S2, () => aiRun(a))) return;
        tot += sc(S2, keys.perm || !own); n++;
      }
      const gain = tot / n - ((keys.perm || !own) ? baseTh : baseNoTh);
      if (gain > margin && (!best || gain > best.gain)) best = { gain, a };
    }));
    if (best) plan.extra.push(best.a);
  };
  tryInfl("infliction-cleanse", {}); tryInfl("infliction-learn", {}); tryInfl("infliction-swap", {});
  tryInfl("infliction-contaminate", { perm: true }); tryInfl("infliction-infest", { perm: true });
  if (had("envision-plague") && Date.now() < deadline){
    let tot = 0, n = 0;
    CONDS.filter(x => x !== "Beartrap").forEach(cn => {
      const S2 = aiClone(S1);
      aiWith(S2, () => [S2.p.inplay, S2.o].forEach(board => withField(board, () => board.forEach(e => { if (gOf(e.id) === "character" && !e.dying && (cn === "Parasitic" || !(e.cond || []).includes(cn))) giveConds(e, [cn], "Plague", true); }))));
      tot += sc(S2, true); n++;
    });
    if (tot / n - baseTh > margin) plan.extra.push({ k: "env", id: "envision-plague" });
  }
}

/* ---------- turn start, defence, Control ---------- */
function aiTurnStart(){
  const pc = play.pile.character, po = play.pile.other;
  const S0 = aiRoot(), dl = Date.now() + (aiLeft() < 20000 ? 300 : 900);
  AI.hand0 = play.hand.length + 1;
  const val = S => Math.max(...aiBeam(S, dl, 6).map(n => n.v));
  const sampleVal = (pile, copies) => {
    if (!pile.length) return -Infinity;
    const counts = {};
    pile.forEach(id => { counts[id] = (counts[id] || 0) + 1; });
    let tot = 0, wsum = 0;
    for (const id of shuffle(Object.keys(counts)).slice(0, 5)){
      const S = aiClone(S0);
      for (let q = 0; q < copies; q++) S.p.hand.push(id);
      tot += counts[id] * val(S); wsum += counts[id];
    }
    return tot / wsum;
  };
  const copies = play.doubleNext ? 2 : 1;
  const sB = aiClone(S0); sB.p.blood = (sB.p.blood || 0) + 1;
  const vB = val(sB), vC = sampleVal(pc, copies), vO = sampleVal(po, copies);
  let choice = "blood";
  if (vC > vB && vC >= vO) choice = "character"; else if (vO > vB) choice = "other";
  if (choice !== "blood" && !play.pile[choice].length) choice = "blood";
  if (choice === "blood") addTk("blood", 1, "Turn choice");
  else { const b0 = play.hand.length; drawn(play.pile[choice].pop()); play.fresh = { from: b0 }; }
  play.ts = false;
  renderPlay();
}

// Choose blockers when attacked.
function aiDefend(cb){
  const st = aiOppSt(), H = st ? st.inplay : [], B = play.inplay;
  const att = cb.att.map(a => H.find(e => e.uid === a.uid)).filter(Boolean);
  let bestAsg = cb.att.map(() => null);
  if (att.length === cb.att.length){
    let worst = Infinity;
    for (const asg of aiAssignments(att, H, B, 700)){
      const v = aiResultVal(aiSim(att, asg, H, B, !!(st && st.per), !!play.persuade), att, H, B, false);
      if (v < worst){ worst = v; bestAsg = asg; }
    }
  }
  cb.asg = bestAsg; cb.phase = "wait";
  sendCmd(cb.from, { k: "def", asg: cb.asg });
  AI.hostAtk = true; AI.passive = 0;
  renderPlay();
}

// Choose how to assign blocks with Control.
function aiControl(cb){
  const o = net.players[cb.opp], theirs = o && o.st ? o.st.inplay : [], A = play.inplay;
  const att = cb.uids.map(u => A.find(e => e.uid === u)).filter(Boolean);
  let bv = -Infinity, basg = cb.asg;
  aiAssignments(att, A, theirs, 700).forEach(asg => {
    if (ctlCheck({ uids: cb.uids, asg }, theirs)) return;
    const v = aiResultVal(aiSim(att, asg, A, theirs, !!play.persuade, !!(o.st && o.st.per)), att, A, theirs, true);
    if (v > bv){ bv = v; basg = asg; }
  });
  cb.asg = basg;
  runCombat(cb.asg);
}

/* ---------- the loop ---------- */
function aiStep(){
  if (!inGame() || isOver()) return;
  if (net.rp) net.rp = null;
  const cb = net.cb;
  if (cb){
    if (cb.role === "def" && cb.phase === "pick"){ aiDefend(cb); aiPause(1100); }
    else if (cb.role === "att" && cb.phase === "assign"){ aiControl(cb); aiPause(900); }
    return;
  }
  if (net.g.who !== me() || net.g.paused) return;
  if (play.cast) return;
  if (play.inplay.some(e => e.dying)) return;
  if (play.cl){ aiSettleCl(); renderPlay(); aiPause(600); return; }
  if (play.em){ aiSettleEm(); renderPlay(); aiPause(600); return; }
  if (play.ts){ aiTurnStart(); aiPause(1200); return; }
  if (play.turnN !== net.g.n) return;
  if (!AI.plan || AI.plan.n !== net.g.n){
    const pre = aiPre();
    if (pre){ aiDo(pre); renderPlay(); aiPause(1100); return; }
    if (AI.lastPlanN !== net.g.n){ AI.lastPlanN = net.g.n; if (!AI.hostAtk) AI.passive++; AI.hostAtk = false; }
    AI.plan = aiThink(); AI.plan.n = net.g.n; AI.replans = 0;
    aiPause(700);
    return;
  }
  const pl = AI.plan;
  if (pl.done) return;
  if (pl.sac){
    const e = play.inplay.find(x => x.uid === pl.sac); pl.sac = null;
    if (e && !play.sacUsed && !play.turnPlays){
      play.sacUsed = true; play.noPlay = true;
      toast("Sacrifice", `${byId[e.id].name} was sacrificed.`, "info");
      startDeath(e, false); renderPlay(); aiPause(2300); return;
    }
  }
  const fromActs = pl.i < pl.acts.length, queue = fromActs ? pl.acts : pl.extra, qi = fromActs ? pl.i : pl.i - pl.acts.length;
  if (qi < queue.length){
    const a = queue[qi]; pl.i++;
    if (!aiDo(a) && fromActs && AI.replans < 3){ AI.replans++; AI.plan = null; }
    renderPlay(); aiPause(1100); return;
  }
  if (pl.persuade){
    pl.persuade = false;
    if (play.hand.includes("envision-persuade") && !play.persuade){ aiDo({ k: "env", id: "envision-persuade" }); renderPlay(); aiPause(1100); return; }
  }
  // end-of-turn extras: Double makes the next draw a pair, Reset refills the character deck
  if (!pl.tDouble){
    pl.tDouble = true;
    if (play.hand.includes("envision-double") && !play.doubleNext && (play.pile.character.length || play.pile.other.length)){ aiDo({ k: "env", id: "envision-double" }); renderPlay(); aiPause(1000); return; }
  }
  if (!pl.tReset){
    pl.tReset = true;
    if (play.hand.includes("envision-reset") && play.discard.filter(x => byId[x] && byId[x].type !== "character").length >= 3){ aiDo({ k: "env", id: "envision-reset" }); renderPlay(); aiPause(1000); return; }
  }
  if (pl.attack && !pl.attacked){
    const uids = ignActive() ? ignEligible().map(e => e.uid) : pl.attack.set.filter(u => play.inplay.some(e => e.uid === u && !e.dying && !summoned(e)));
    if (uids.length){
      if (pl.control && play.hand.includes("envision-control") && !play.control){ aiDo({ k: "env", id: "envision-control" }); renderPlay(); aiPause(1000); return; }
      pl.attacked = true;
      play.atkSel = uids; declareAttack(); aiPause(1000); return;
    }
    pl.attacked = true;
  }
  pl.done = true;
  endTurn(); aiPause(1500);
}

// Called repeatedly; does a step when it's time.
function aiTick(){
  if (!BOT || !play || !net.ready || AI.busy || Date.now() < AI.next) return;
  AI.busy = true;
  try { aiStep(); }
  catch (err){
    console.error("AI error", err);
    AI.plan = null; AI.next = Date.now() + 1500;
    try { if (inGame() && net.g.who === me() && !net.cb && !play.ts && !play.cast){ AI.plan = { n: net.g.n, acts: [], extra: [], i: 0, done: true }; endTurn(); } } catch(_){}
  }
  finally { AI.busy = false; }
}
setInterval(aiTick, 250);

/* ---------- boot (only inside the hidden frame) ---------- */
function botBoot(){
  if (window.__botBooted) return;
  window.__botBooted = true;
  net.name = "AI";
  aiNewDeck();
  // a stand-in for the network: talks to the page that opened this frame

    guestRecv(e.data.d);
  });

}

$("#ac").onclick = async e => {
  if (e.target.id === "ac" || e.target.closest("#ac-close")){ $("#ac").classList.remove("on"); return; }
  const k = e.target.closest("[data-ac]"); if (!k || ACC.busy) return;
  const a = k.dataset.ac, pw = accRead(), sb = ACC.sb;
  if (a === "prof"){ $("#ac").classList.remove("on"); openProfile(); return; }
  if (a === "m-in" || a === "m-up"){ ACC.mode = a === "m-up" ? "up" : "in"; ACC.msg = ""; renderAcc(); return; }
  const run = async fn => { ACC.busy = true; renderAcc(); try { await fn(); } catch (err){ ACC.msg = "Something went wrong: " + (err && err.message || err); ACC.ok = false; } ACC.busy = false; renderAcc(); };
  const okName = n => !nameErr(n);
  if (a === "in") return run(async () => {
    if (!ACC.f.email || !pw){ ACC.msg = "Enter your email and password."; ACC.ok = false; return; }
    const { error } = await sb.auth.signInWithPassword({ email: ACC.f.email, password: pw });
    if (error){ ACC.msg = /confirm/i.test(error.message) ? "Confirm your email first (check your inbox), then sign in." : error.message === "Invalid login credentials" ? "Wrong email or password." : error.message; ACC.ok = false; }
    else { ACC.msg = ""; toast("Signed in", "Welcome back.", "info"); }
  });
  if (a === "up") return run(async () => {
    if (!ACC.f.email.includes("@")){ ACC.msg = "Enter a valid email."; ACC.ok = false; return; }
    { const ne = nameErr(ACC.f.user); if (ne){ ACC.msg = ne; ACC.ok = false; return; } }
    if (pw.length < 6){ ACC.msg = "Passwords need at least 6 characters."; ACC.ok = false; return; }
    const t = await sb.from("profiles").select("id").ilike("username", ACC.f.user.replace(/[%_]/g, c => "\\" + c)).limit(1);
    if (t.data && t.data.length){ ACC.msg = "That username is taken."; ACC.ok = false; return; }
    const { data, error } = await sb.auth.signUp({ email: ACC.f.email, password: pw, options: { data: { username: ACC.f.user }, emailRedirectTo: location.href.split(/[?#]/)[0] } });
    if (error){ ACC.msg = error.message; ACC.ok = false; return; }
    if (data.session){ ACC.msg = ""; toast("Account created", "You're signed in.", "info"); }
    else { ACC.mode = "in"; ACC.msg = "Almost there: we emailed you a link. Click it, then sign in here."; ACC.ok = true; }
  });
  if (a === "forgot") return run(async () => {
    if (!ACC.f.email.includes("@")){ ACC.msg = "Type your email above first."; ACC.ok = false; return; }
    const { error } = await sb.auth.resetPasswordForEmail(ACC.f.email, { redirectTo: location.href.split(/[?#]/)[0] });
    ACC.msg = error ? error.message : "If that email has an account, a reset link is on its way."; ACC.ok = !error;
  });
  if (a === "newpw") return run(async () => {
    if (pw.length < 6){ ACC.msg = "Passwords need at least 6 characters."; ACC.ok = false; return; }
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error){ ACC.msg = error.message; ACC.ok = false; } else { ACC.mode = "in"; ACC.msg = "Password changed."; ACC.ok = true; }
  });
  if (a === "setname") return run(async () => {
    { const ne = nameErr(ACC.f.user); if (ne){ ACC.msg = ne; ACC.ok = false; return; } }
    ACC.msg = ""; await accProfile(ACC.f.user); if (ACC.name){ ACC.msg = ""; accButton(); }
  });
  if (a === "out") return run(async () => { await sb.auth.signOut(); ACC.user = null; ACC.name = ""; ACC.prof = null; if (!$("#profile").classList.contains("hide")) show("menu"); ACC.cloud = null; ACC.msg = ""; ACC.mode = "in"; accButton(); });
  if (a === "save") return run(async () => {
    const { data: rows, error } = await sb.from("decks").select("id,name"); if (error) throw error;
    const by = {}; (rows || []).forEach(r => by[r.name] = r.id);
    let n = 0;
    for (const [name, d] of Object.entries(decks)){
      const ch = {}, ot = {}; Object.entries(d).forEach(([id, c]) => { if (byId[id]) (byId[id].type === "character" ? ch : ot)[id] = c; });
      const row = { owner: ACC.user.id, name, characters: ch, others: ot, updated_at: new Date().toISOString() };
      const r = by[name] ? await sb.from("decks").update(row).eq("id", by[name]) : await sb.from("decks").insert(row);
      if (r.error) throw r.error; n++;
    }
    ACC.msg = `Saved ${n} deck${n === 1 ? "" : "s"} online.`; ACC.ok = true; await accCount();
  });
  if (a === "load") return run(async () => {
    const { data: rows, error } = await sb.from("decks").select("name,characters,others"); if (error) throw error;
    if (!rows || !rows.length){ ACC.msg = "You have no decks saved online yet."; ACC.ok = false; return; }
    const clash = rows.filter(r => decks[r.name] && Object.keys(decks[r.name]).length);
    if (clash.length && !confirm(`Loading will replace ${clash.length} local deck${clash.length === 1 ? "" : "s"} with the same name (${clash.map(r => r.name).slice(0, 3).join(", ")}${clash.length > 3 ? "…" : ""}). Continue?`)){ ACC.msg = "Cancelled."; ACC.ok = false; return; }
    rows.forEach(r => { decks[r.name] = sanitize({ ...(r.characters || {}), ...(r.others || {}) }); });
    if (!decks[cur]) cur = Object.keys(decks)[0];
    save(); renderAll();
    ACC.msg = `Loaded ${rows.length} deck${rows.length === 1 ? "" : "s"} from online.`; ACC.ok = true;
  });
};
/* ====================================================================================================
   PROFILES, RANKS, MATCH HISTORY, NAME FILTER
   ==================================================================================================== */

const RANKS = [{ n: "Nerd", c: "#aab4c3" }, { n: "Card-Dealer", c: "#6fb3e0" }, { n: "Intermediary", c: "#7ed39a" }, { n: "Trap House", c: "#f0a24a" }, { n: "Malpractitioner", c: "#e0584a" }];
// Placeholder sigils (simple shapes) until real art replaces them.
const SIGIL = [
  '<circle cx="12" cy="23" r="7"/><circle cx="28" cy="23" r="7"/><path d="M19 23h2M5 23l-2-3M35 23l2-3M8 12l7 3M32 12l-7 3"/>',
  '<rect x="11" y="5" width="18" height="30" rx="3"/><path d="M20 13l5 7-5 7-5-7z"/>',
  '<path d="M7 14h24l-6-6M33 26H9l6 6"/>',
  '<path d="M4 21L20 7l16 14M9 18v17h22V18"/><path d="M17 35V26h6v9"/>',
  '<path d="M16 5h8v11h11v8H24v11h-8V24H5v-8h11z"/><path d="M8 33L32 7"/>'
];
// SVG sigil for a rank tier (1 to 5).
function rankSvg(t, px){
  t = Math.max(1, Math.min(5, (t | 0) || 1)); const r = RANKS[t - 1];
  return `<svg class="sigil" viewBox="0 0 40 40" width="${px || 40}" height="${px || 40}" fill="${r.c}33" stroke="${r.c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${r.n}">${SIGIL[t - 1]}</svg>`;
}

// Name filter. The word lists are stored scrambled (ROT13) so the file itself isn't full of slurs; the same lists are in the SQL.
const rot13 = s => s.replace(/[a-z]/g, c => String.fromCharCode((c.charCodeAt(0) - 84) % 26 + 97));
const BAD_SUB = rot13("avttre,avttn,snttbg,shpx,fuvg,ovgpu,phag,juber,fyhg,ergneq,genaal,xvxr,jrgonpx,ornare,enturnq,gbjryurnq,pbbyvr,wvtnobb,cbepuzbaxrl,arteb,uvgyre,anmv,xxx,encvfg,crqbcuvyr,cnrqbcuvyr,zbyrfg,onfgneq,nffubyr,qvpxurnq,pbpxfhpxre,zbgureshpxre,wvmm,oybjwbo,unaqwbo,qvyqb,chffl,cravf,intvan,ohxxnxr,vaprfg,trabpvqr,juvgrcbjre,puvatpubat,mvccreurnq").split(","), BAD_WORD = rot13("fcvp,fcvpx,puvax,tbbx,pbba,qlxr,snt,sntf,gneq,qvpx,pbpx,gjng,phz,xlf,crqb,encr,encrq,abapr,jbc,qntb,wnc,tlc,xlxr,stg,jnax,gvgf,encrl,cnxv,nahf").split(",");
const squash = s => s.replace(/(.)\1+/g, "$1");
// True if the text contains a blocked word. strict = a username (checked as one run, which catches "f_u_c_k"); otherwise free text checked word by word.
function badText(s, strict){
  const leet = { 0: "o", 1: "i", "!": "i", 3: "e", 4: "a", "@": "a", 5: "s", "$": "s", 7: "t" };
  const l = String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[01!34@5$7]/g, c => leet[c]);
  for (const p of strict ? [l] : l.split(/[^a-z0-9]+/)){
    const flat = p.replace(/[^a-z]/g, ""), sq = squash(flat);
    for (const w of BAD_SUB){ const q = squash(w); if (flat.includes(w) || (q.length >= 4 && sq.includes(q))) return true; }
  }
  return l.split(/[^a-z]+/).some(t => BAD_WORD.includes(t));
}
// Why a username can't be used (empty string = fine).
function nameErr(n){
  if (!/^[A-Za-z0-9_.-]{3,16}$/.test(n || "")) return "Usernames are 3–16 letters, numbers, . - or _ (no spaces).";
  if (badText(n, true)) return "That username isn't allowed. Please pick another.";
  return "";
}

/* ---- performance and rating ---- */

// How well I played this match, 0 to 1 (win or lose): points dealt vs taken, damage, and characters defeated vs lost.
function perfScore(){
  const m = MS; if (!m) return 0.5;
  const pf = m.ptsFor || 0, pa = m.ptsAgainst || 0, share = pf + pa ? pf / (pf + pa) : 0.5;
  const dm = (m.dealt || 0) + (m.taken || 0) ? m.dealt / (m.dealt + m.taken) : 0.5;
  const lost = Math.max(0, (m.lost || 0) - (m.sacs || 0)), bat = (m.kills || 0) + lost, ks = bat ? m.kills / bat : 0.5;
  return Math.max(0, Math.min(1, 0.5 * share + 0.25 * dm + 0.25 * ks));
}

// Save the finished online match to my account (and update my hidden rating if ranked). AI games never get here.
async function recordMatch(lose, ff){
  if (BOT || SIM || !ACC.sb || !ACC.user || !ACC.name || net.ai || net.mode !== "online" || !net.g || !net.g.mid || net.rec === net.g.mid) return null;
  const mid = net.g.mid; net.rec = mid;
  const opp = Object.values(net.players)[0] || {}, m = MS || {};
  let perf = perfScore(); if (ff) perf = lose ? 0 : Math.max(perf, 0.5);
  let acc = []; try { acc = m.turns !== undefined ? msAccolades(!lose).map(a => a[0]) : []; } catch (e){}
  const args = {
    p_mid: mid, p_opp: opp.uid || null, p_opp_name: opp.name || net.lastOpp || "Opponent", p_ranked: !!net.ranked && !!opp.uid, p_won: !lose, p_perf: Math.round(perf * 1000) / 1000,
    p_deck: (play && play.deckName) || cur, p_cards: m.cards || {},
    p_summary: { turns: m.turns || 0, kills: m.kills || 0, lost: m.lost || 0, dealt: m.dealt || 0, taken: m.taken || 0, secs: Math.round(((m.t1 || Date.now()) - (m.t0 || Date.now())) / 1000), ff: !!ff, acc }
  };
  try {
    const { data, error } = await ACC.sb.rpc("record_match", args);
    if (error) throw error;
    if (!data || data.duplicate) return data;
    if (ACC.prof && data.tier_after) ACC.prof.tier = data.tier_after;
    if (args.p_ranked){
      const a = data.tier_before || 1, b = data.tier_after || a, nm = RANKS[b - 1].n;
      const msg = b > a ? `Rank up! You are now ${nm}.` : b < a ? `Rank down. You are now ${nm}.` : `Ranked result saved. Rank: ${nm}.`;
      if (END && !ff){ END.rk = rankSvg(b, 26) + esc(msg); endDraw(); }
      if (b !== a || ff) toast(b > a ? "Rank up!" : b < a ? "Rank down" : "Ranked", msg, "info");
    }
    return data;
  } catch (e){
    net.rec = null; console.warn("record_match failed", e);
    toast("Match not saved", "Your result couldn't be saved to your profile.", "info");
    return null;
  }
}

// Tell the other player I'm forfeiting (ranked, leaving mid-game).
function ffSend(){ try { if (net.role === "host") bcast({ t: "ff" }); else if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: "ff" }); } catch (_){} }
// The other player forfeited a ranked game: I win.
function ffReceived(){
  if (!net.ranked || !inGame() || isOver() || net.ffGot) return;
  net.ffGot = true; recordMatch(false, true);
  toast("Opponent forfeited", "You win. Your result is being saved.", "info");
}

let PF = null;   // last fetched { p, ms }
async function openProfile(){
  if (!ACC.sb || !ACC.user || !ACC.name){ accOpen(); return; }
  show("profile"); profDraw(null);
  try {
    const uid = ACC.user.id;
    const [a, b] = await Promise.all([
      ACC.sb.from("profiles").select("*").eq("id", uid).maybeSingle(),
      ACC.sb.from("matches").select("*").eq("user_id", uid).order("created_at", { ascending: false }).limit(60)
    ]);
    if (a.error) throw a.error; if (b.error) throw b.error;
    if (a.data) ACC.prof = a.data;
    PF = { p: a.data || ACC.prof || {}, ms: b.data || [] };
    profDraw(PF);
  } catch (e){ profDraw({ err: (e && e.message) || "Couldn't load your profile." }); }
}

// Top entry of a { key: count } object.
const topOf = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0];

// Draw the profile screen (d = null while loading).
function profDraw(d){
  const el = $("#profile");
  if (!d){ el.innerHTML = `<p class="stat">Loading your profile…</p>`; return; }
  if (d.err){ el.innerHTML = `<h2>Profile</h2><p class="warn">${esc(d.err)}</p><p class="stat">If this keeps happening, the profile tables may not be set up yet (run the SQL file in Supabase).</p><div class="row"><button data-pf="retry" class="go">Try again</button></div>`; return; }
  const p = d.p, ms = d.ms, tier = Math.max(1, Math.min(5, p.tier || 1)), R = RANKS[tier - 1];
  const W = p.wins || 0, L = p.losses || 0, G = W + L, pct = G ? Math.round(100 * W / G) : 0;
  const rw = p.ranked_wins || 0, rl = p.ranked_losses || 0;
  const dc = {}, cc = {}, ac = {};
  ms.forEach(m => {
    if (m.deck) dc[m.deck] = (dc[m.deck] || 0) + 1;
    Object.entries(m.cards || {}).forEach(([id, n]) => cc[id] = (cc[id] || 0) + n);
    ((m.summary || {}).acc || []).forEach(x => ac[x] = (ac[x] || 0) + 1);
  });
  const md = topOf(dc), fc = topOf(cc), ta = topOf(ac), fcard = fc && byId[fc[0]];

  const badges = [
    ["First Blood", "Win an online match", W >= 1], ["Regular", "Play 10 online matches", G >= 10], ["Veteran", "Win 25 matches", W >= 25],
    ["Hot Streak", "Win 3 in a row", (p.best_streak || 0) >= 3], ["Ranked Debut", "Finish a ranked match", rw + rl >= 1], ["Climber", "Reach Card-Dealer or higher", tier >= 2],
    ["Big Time", "Reach Trap House or higher", tier >= 4]
  ];
  const av = p.avatar ? `<img src="${esc(p.avatar)}" alt="Your profile photo">` : esc((p.username || "?").charAt(0).toUpperCase());
  const since = p.created_at ? new Date(p.created_at).toLocaleDateString(undefined, { month: "short", year: "numeric" }) : "";
  el.innerHTML = `
    <div class="pf-top" style="--rk:${R.c}">
      <div><div class="pf-av">${av}</div>
        <label class="mini" style="display:block;text-align:center;margin-top:6px;cursor:pointer"><button type="button" data-pf="photo" class="mini">Change photo</button><input type="file" id="pf-file" accept="image/*" class="hide"></label></div>
      <div style="flex:1 1 260px;min-width:0">
        <h2 class="pf-name">${esc(p.username)}</h2>
        <div class="pf-rank" style="color:${R.c}" title="Your rating is hidden. Win to climb; how well you play matters too.">${rankSvg(tier, 36)} <span>${R.n}</span> <span class="stat" style="font-weight:400">(rank ${tier} of 5)</span></div>
        <div class="stat">${since ? "Member since " + esc(since) + ". " : ""}${esc(ACC.user.email || "")}</div>
        <div class="pf-bio"><input type="text" id="pf-bio" maxlength="80" placeholder="Write a short bio (80 characters)" value="${esc(p.bio || "")}" aria-label="Bio"><button data-pf="bio">Save bio</button></div>
        <div class="warn" id="pf-msg" role="status" style="min-height:1.2em"></div>
      </div>
    </div>
    <div class="pf-grid">
      <div class="pf-card"><small>Record</small><b>${W}–${L}</b><div class="stat">${G ? pct + "% wins over " + G + " online games" : "No online games yet"}</div></div>
      <div class="pf-card"><small>Ranked record</small><b>${rw}–${rl}</b><div class="stat">${rw + rl ? Math.round(100 * rw / (rw + rl)) + "% ranked wins" : "No ranked games yet"}</div></div>
      <div class="pf-card"><small>Win streak</small><b>${p.streak || 0}</b><div class="stat">Best: ${p.best_streak || 0}</div></div>
      <div class="pf-card"><small>Recent form</small><b style="font-size:17px;letter-spacing:.1em">${form || "—"}</b><div class="stat">Last ${lastN.length || 0} games</div></div>
      <div class="pf-card"><small>Most played deck</small><b style="font-size:18px">${md ? esc(md[0]) : "—"}</b><div class="stat">${md ? md[1] + " of your last " + ms.length + " games" : "Play online to find out"}</div></div>
      <div class="pf-card"><small>Favorite card</small>${fcard ? `<div class="pf-fav"><img src="${esc(img(fcard))}" alt=""><div><b style="font-size:17px">${esc(fcard.name)}</b><div class="stat">Played ${fc[1]} times</div></div></div>` : `<b>—</b><div class="stat">Play online to find out</div>`}</div>
      <div class="pf-card"><small>Signature accolade</small><b style="font-size:18px">${ta ? esc(ta[0]) : "—"}</b><div class="stat">${ta ? "Earned in " + ta[1] + " game" + (ta[1] === 1 ? "" : "s") : "Awarded at the end of matches"}</div></div>
    </div>
    <div class="pf-sec">Badges</div>
    <div class="pf-badges">${badges.map(b => `<span class="pf-badge ${b[2] ? "on" : ""}" title="${esc(b[1])}">${esc(b[0])}</span>`).join("")}</div>
    <div class="pf-sec">Battle log <span class="stat" style="font-weight:400;font-size:13px">your last ${Math.min(ms.length, 20) || 0} online games (games against the AI aren't saved)</span></div>
    <div class="pf-log">${ms.length ? ms.slice(0, 20).map(m => {
      const s = m.summary || {}, up = (m.tier_after || 1) > (m.tier_before || 1), dn = (m.tier_after || 1) < (m.tier_before || 1);
      const dt = new Date(m.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      return `<div class="pf-row"><div class="pf-res ${m.won ? "w" : "l"}">${m.won ? "WIN" : "LOSS"}</div>
        <div style="min-width:0"><b>vs ${esc(m.opponent_name)}</b> <span class="stat">${m.ranked ? "Ranked" : "Casual"}${s.ff ? ", forfeit" : ""} · ${esc(m.deck || "?")}</span>
        <div class="stat">${s.turns ? s.turns + " turns" : ""}${s.kills ? ", " + s.kills + " defeated" : ""}${s.secs ? ", " + Math.floor(s.secs / 60) + ":" + String(s.secs % 60).padStart(2, "0") : ""}${(s.acc || []).length ? " · " + esc(s.acc.slice(0, 2).join(", ")) : ""}</div></div>
        <div style="text-align:right"><div class="stat">${esc(dt)}</div>${up ? `<div style="color:#8fe0b6;font-weight:700">▲ ${RANKS[(m.tier_after || 1) - 1].n}</div>` : dn ? `<div style="color:#ff8b7c;font-weight:700">▼ ${RANKS[(m.tier_after || 1) - 1].n}</div>` : ""}</div></div>`;
    }).join("") : `<p class="stat">No online games yet. Play a room with a friend while signed in and it will show up here.</p>`}</div>
    <div class="pf-sec">Ranks</div>
    <div class="pf-badges">${RANKS.map((r, i) => `<span class="pf-badge on" style="border-color:${r.c};color:${r.c};${i + 1 === tier ? "" : "opacity:.55"};display:inline-flex;align-items:center;gap:6px">${rankSvg(i + 1, 22)}${r.n}</span>`).join("")}</div>
    <p class="stat" style="margin-top:8px">Ranked games change a hidden rating. A win moves you up and a loss moves you down, and how well you played changes the size of the move. The higher your rank, the more a loss costs, but a strong performance can always still gain you ground.</p>
    <div class="row" style="margin-top:14px"><button data-pf="acct">Account and decks</button></div>`;
}

// Photo upload: crop to a square, shrink and store it in the profile.
function avatarFrom(file){
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error("That isn't an image."));
    if (file.size > 10e6) return rej(new Error("Pick an image under 10 MB."));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const S = 160, c = document.createElement("canvas"); c.width = c.height = S;
      const x = c.getContext("2d"), m = Math.min(im.width, im.height);
      x.fillStyle = "#1b1f27"; x.fillRect(0, 0, S, S);
      x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Couldn't read that image.")); };
    im.src = url;
  });
}

const pfSay = (t, ok) => { const m = $("#pf-msg"); if (m){ m.textContent = t; m.style.color = ok ? "#8fe0b6" : ""; } };
$("#profile").addEventListener("click", async e => {
  const b = e.target.closest("[data-pf]"); if (!b) return;
  const a = b.dataset.pf;
  if (a === "retry") return openProfile();
  if (a === "acct"){ accOpen(); return; }
  if (a === "photo"){ $("#pf-file").click(); return; }
  if (a === "bio"){
    const v = ($("#pf-bio").value || "").trim().slice(0, 80);
    if (badText(v, false)){ pfSay("That bio isn't allowed. Please reword it."); return; }
    const { error } = await ACC.sb.from("profiles").update({ bio: v }).eq("id", ACC.user.id);
    if (error) pfSay(/not allowed/i.test(error.message) ? "That bio isn't allowed. Please reword it." : "Couldn't save: " + error.message); else { if (PF) PF.p.bio = v; pfSay("Bio saved.", true); }
  }
});
$("#profile").addEventListener("change", async e => {
  if (e.target.id !== "pf-file" || !e.target.files[0]) return;
  try {
    pfSay("Uploading…", true);
    const data = await avatarFrom(e.target.files[0]);
    const { error } = await ACC.sb.from("profiles").update({ avatar: data }).eq("id", ACC.user.id);
    if (error) throw error;
    if (ACC.prof) ACC.prof.avatar = data; if (PF) PF.p.avatar = data;
    profDraw(PF); pfSay("Photo updated.", true);
  } catch (err){ pfSay((err && err.message) || "Couldn't upload that photo."); }
});

accInit();

loadCards();
</script>
