// Text asking the player to pick a target for an infliction.
function tgtPrompt(){
  const k = inflKey(play.tgt.id), n = inflName(play.tgt.id);
  return k === "hypnotize" ? `Choose an ENEMY character to Hypnotize (draw cards equal to its Attack).` : k === "burn" ? `Choose a character to Burn (then pick which attached card goes back to its owner's hand).` : k === "just-say-no" ? `Choose a character: its attachments and a copy of it go to your hand.` : `Choose a character to afflict with ${n}.`;
}

// Opposing characters that can be targeted.
function oppChars(){
  const out = [];
  Object.entries(net.players).forEach(([pid, o]) => { if (o.st) o.st.inplay.forEach((e, oi) => { if (byId[e.id] && gOf(e.id) === "character" && !e.dying) out.push({ pid, oi, e, st: o.st }); }); });
  return out;
}

// Is this card a legal target for the infliction being cast?
function tgtOk(e, own){
  const k = inflKey(play.tgt.id);
  if (gOf(e.id) !== "character" || e.dying) return false;
  if (k === "hypnotize") return !own;
  if (k === "cleanse" && !(e.cond || []).length) return false;
  if (k === "burn" && !e.att.some(a => byId[a] && ["enchantment","prescription"].includes(byId[a].type))) return false;
  if (k === "learn" && !(asArr(byId[e.id].innate_enchantment).length || asArr(byId[e.id].innate_condition).length)) return false;
  return true;
}

// Is there any legal target for this infliction?
function tgtAny(id){
  const sv = play.tgt; play.tgt = { id };
  try { return play.inplay.some(e => tgtOk(e, true)) || oppChars().some(o => tgtOk(o.e, false)); } finally { play.tgt = sv; }
}

// Apply an infliction to the chosen target.
function finishTgt(sel){
  const t = play.tgt, list = zl(t.zone), id = list[t.i];
  if (!id){ play.tgt = null; renderPlay(); return; }
  const k = inflKey(id), nm = inflName(id);
  let ent, own = !!sel.own, o = null;
  if (own) ent = play.inplay[sel.si];
  else { o = net.players[sel.pid]; ent = o && o.st && o.st.inplay[sel.oi]; }
  if (!ent || !byId[ent.id]) return;
  if (!tgtOk(ent, own)){
    toast(k === "hypnotize" ? "Enemy only" : k === "learn" ? "Nothing to learn" : k === "cleanse" ? "Nothing to cleanse" : k === "burn" ? "Nothing to burn" : "Can't target that", k === "hypnotize" ? "Hypnotize only works on enemy characters." : k === "learn" ? `${byId[ent.id].name} has no innate enchantment or condition.` : k === "cleanse" ? `${byId[ent.id].name} has no Conditions.` : k === "burn" ? `${byId[ent.id].name} has no attached Enchantments or Prescriptions.` : "Choose a character.");
    return;
  }
  const lack = costLack(id);
  if (lack){ toast(lack[0], lack[1]); return; }
  const tname = byId[ent.id].name;
  const done = () => { play.tgt = null; list.splice(t.i, 1); };
  netEvent({ k: "infl", id, to: ent.id, uid: ent.uid });
  if (TOGGLE.includes(k)){
    payCost(id); done();
    const xp = expFor(own);
    if (own){ ent.inf = ent.inf || []; ent.inf.push({ id, by: me(), exp: xp }); sparkMold(ent.uid); }
    else sendCmd(sel.pid, { k: "inf", uid: ent.uid, id, by: me(), exp: xp });
    if (k === "learn") toast(nm, `Your characters now gain ${tname}'s innate enchantments and condition perks${asArr(byId[ent.id].innate_enchantment).length ? ": " + asArr(byId[ent.id].innate_enchantment).join(", ") : ""}. It wears off at the end of ${own ? "this" : "their next"} turn.`, "info");
    else toast(nm, xp !== undefined ? `${tname} is inflicted. It wears off at the end of ${own ? "this" : "their next"} turn.` : `${tname} is inflicted. Click the card to turn it off and discard ${nm}.`, "info");
  } else if (["cleanse","enfeeble","hinder","intimidate","rend"].includes(k)){
    payCost(id); done(); pushDiscard(id);
    if (own) inflFx(k, ent); else sendCmd(sel.pid, { k: "ix", op: k, uid: ent.uid, by: me() });
    if (!own) toast(nm, `${tname} was afflicted with ${nm}.`, "info");
  } else if (k === "just-say-no"){
    payCost(id); done(); pushDiscard(id);
    if (own){ const g = jsnTake(ent); jsnGive(g, tname); }
    else sendCmd(sel.pid, { k: "jsn", uid: ent.uid });
  } else if (k === "burn"){
    const opts = ent.att.map((a, ai) => ({ id: a, ai, from: "Attached" })).filter(x => byId[x.id] && ["enchantment","prescription"].includes(byId[x.id].type));
    play.cl = { zone: t.zone, i: t.i, id, opts, who: tname, mode: "burn", own, pid: own ? null : sel.pid, uid: ent.uid };
    play.tgt = null; renderPlay(); renderClone(); return;
  } else if (k === "contaminate" || k === "infest"){
    payCost(id); done(); pushDiscard(id);
    if (own) doInfect(ent, k);
    else sendCmd(sel.pid, { k: k, uid: ent.uid, by: me() });
    if (!own) toast(nm, `${tname} was ${k === "infest" ? "infested" : "contaminated"}.`, "info");
  } else if (k === "hypnotize"){
    payCost(id); done(); pushDiscard(id);
    const n = withField(o.st.inplay, () => effOf(ent)).attack || 0, pile = play.pile.other;
    let got = 0; const b0 = play.hand.length;
    while (got < n && pile.length){ drawn(pile.pop()); got++; }
    if (got) play.fresh = { from: b0 };
    toast("Hypnotize", n ? `${tname} has ${n} Attack: drew ${got} card${got === 1 ? "" : "s"} from your Other deck${got < n ? " (it ran out)" : ""}.` : `${tname} has 0 Attack, so nothing was drawn.`, "info");
  } else if (k === "clone"){
    const src = ent.att.map(a => byId[a]).filter(a => a && ["enchantment","prescription"].includes(a.type)).map(a => ({ id: a.id, from: "Attached" }));
    const c0 = byId[ent.id], strip = (ent.cond || []).includes("Sickly");
    if (!strip) asArr(c0.innate_enchantment).forEach(n => { const ec = ENCHCARD(n); if (ec && !src.some(s => s.id === ec.id)) src.push({ id: ec.id, from: "Innate" }); });
    if (!src.length){ toast("Nothing to duplicate", `${tname} has no enchantments or prescriptions.`); return; }
    play.cl = { zone: t.zone, i: t.i, id, opts: src, who: tname };
    play.tgt = null; renderPlay(); renderClone(); return;
  }
  renderPlay();
}

// The effect of a one-shot infliction on one of MY characters (also used when the other player casts it on it).
function inflFx(k, ent){
  const nm = byId[ent.id].name;
  if (k === "cleanse"){
    const have = [...new Set(ent.cond || [])]; ent.imm = [...new Set([...(ent.imm || []), ...have])];
    purgeImmune(ent, true); sparkMold(ent.uid);
    toast("Cleanse", have.length ? `${nm} is now immune to ${have.join(", ")}.` : `${nm} had no Conditions.`, "info");
  } else if (k === "enfeeble"){ ent.enf = true; sparkMold(ent.uid); toast("Enfeeble", `${nm} cannot attack until it blocks an opposing character.`, "info"); }
  else if (k === "hinder"){ ent.hin = true; sparkMold(ent.uid); toast("Hinder", `${nm} cannot block until it lands an unblocked, direct hit.`, "info"); }
  else if (k === "intimidate"){ ent.intim = { left: 3, hit: false }; ent.atkd = false; sparkMold(ent.uid); toast("Intimidate", `${nm} must attack within 3 turns or lose its attached cards.`, "info"); }
  else if (k === "rend"){ ent.rend = (ent.rend || 0) + 2; sparkMold(ent.uid); toast("Rend", `The next damage ${nm} takes is increased by ${ent.rend}.`, "info"); }
}
// Just Say No on one of MY characters: strip its attachments; returns the cards the caster receives (attachments + a copy of the character).
function jsnTake(ent){ const ids = ent.att.splice(0); purgeImmune(ent, true); return [...ids, ent.id]; }
// Put those cards in my hand.
function jsnGive(ids, who){
  const b0 = play.hand.length; ids.forEach(id => play.hand.push(id)); play.fresh = { from: b0 };
  toast("Just Say No", `${ids.length} card${ids.length === 1 ? "" : "s"} from ${who} ${ids.length === 1 ? "is" : "are"} in your hand.`, "info");
}

// Dialog for choosing what a Clone copies.
function renderClone(){
  const m = $("#cl"), c = play && play.cl;
  if (!c){ m.classList.remove("on"); return; }
  m.querySelector(".box").innerHTML = `<h2>${c.mode === "burn" ? "Burn" : "Clone"}: ${esc(c.who)}</h2><p class="stat">${c.mode === "burn" ? "Choose a card to return to its owner's hand." : "Choose a card to copy into your hand."}</p><div class="attl">${c.opts.map((o, k) => `<button data-clk="${k}"><img src="${esc(img(byId[o.id]))}" alt=""><span>${esc(byId[o.id].name)} <span class="stat">${cap(byId[o.id].type)} · ${o.from}</span></span></button>`).join("")}</div><div class="row"><button data-clcancel="1">Cancel (keeps ${c.mode === "burn" ? "Burn" : "Clone"} in hand)</button></div>`;
  m.classList.add("on");
}

// Infest gives 3 Parasitic; Infect gives two random conditions the character doesn't already have and isn't immune to.
function doInfect(ent, k){
  if (k === "infest") giveConds(ent, ["Parasitic","Parasitic","Parasitic"], "Infest");
  else {
    const o = effOf(ent), pool = CONDS.filter(n => n !== "Beartrap" && !(ent.cond || []).includes(n) && !immuneTo(o, n));
    for (let q = pool.length - 1; q > 0; q--){ const j = Math.random() * (q + 1) | 0; [pool[q], pool[j]] = [pool[j], pool[q]]; }
    const pick = pool.slice(0, 2);
    if (!pick.length) toast("Contaminate", `${byId[ent.id].name} has nothing left to catch.`);
    else giveConds(ent, pick, "Contaminate");
  }
}

// Finish choosing a character to attach a card to (refused if it already has the maximum attachments).
function finishPick(si){
  const pk = play.pick, e = play.inplay[si];
  const list = zl(pk.zone);
  if (e && gOf(e.id) === "character" && e.att.length >= MAX_ATT){ toast("Attachment limit reached", `That character already has ${MAX_ATT} attachments. Choose another one.`); return; }
  const lack = list[pk.i] && costLack(list[pk.i]);
  if (lack){ toast(lack[0], lack[1]); return; }
  play.pick = null;
  if (e && gOf(e.id) === "character" && list[pk.i]){
    payCost(list[pk.i]);
    const aid = list.splice(pk.i, 1)[0];
    e.att.push(aid);
    if (byId[aid].type === "enchantment") play.magic = { i: si, t: Date.now() };
    netEvent({ k: "attach", id: aid, to: e.id });
    if (HOST_COND.includes(aid)) applyHostCond(aid, e, si);
    purgeImmune(e);
  }
  renderPlay();
}

  if (!c) return;
  const zone = c.dataset.zone, i = +c.dataset.i;
  act = { zone, i, g: null };
  openAct();
}

// Why a named deck can't be played.
function deckProblems(name){
  const sv = cur; cur = name;
  try { return problems(); } finally { cur = sv; }
}

// Ask which deck to play with, then continue.
function pickDeck(then){
  const names = Object.keys(decks);
  const rows = names.map(n => {
    const pr = deckProblems(n), c = Object.entries(decks[n] || {}).reduce((a, [id, k]) => a + ((byId[id] && gOf(id) === "character") ? k : 0), 0), o = Object.entries(decks[n] || {}).reduce((a, [id, k]) => a + ((byId[id] && gOf(id) !== "character") ? k : 0), 0);
    return `<div class="dkwrap"><button class="dkrow ${n === cur && !pr.length ? "go" : ""}" data-dk="${esc(n)}" ${pr.length ? "disabled" : ""}><span><b>${esc(n)}</b><br><small>${pr.length ? esc(pr[0]) : `Characters ${c} · Other ${o}`}</small></span><span>${pr.length ? "Not ready" : "Play"}</span></button><button class="danger dkdel" data-dkdel="${esc(n)}" aria-label="Delete deck ${esc(n)}" title="Delete deck">Delete</button></div>`;
  }).join("");
  $("#dk .box").innerHTML = `<h2>Choose a deck</h2><p class="stat">Pick one of your saved decks to play with.</p>${rows || `<p class="warn">You have no saved decks yet.</p>`}<div class="row" style="margin-top:12px"><button data-dkx="build">Open Deck Builder</button><button data-dkx="close">Cancel</button></div>`;
  $("#dk").classList.add("on");
  pickDeck.then = then;
}
$("#dk").onclick = e => {
  const dd = e.target.closest("[data-dkdel]");

  const x = e.target.closest("[data-dkx]"), d = e.target.closest("[data-dk]");
  if (e.target.id === "dk" || (x && x.dataset.dkx === "close")){ $("#dk").classList.remove("on"); return; }

};
/* In-game "are you sure?" box (replaces the browser's own confirm/prompt popups). Resolves true/false, or the typed text / null when input is set. */
function ask(o){
  return new Promise(res => {
    const el = document.createElement("div"); el.className = "ov on"; el.id = "ask"; el.style.zIndex = 40;
    el.innerHTML = `<div class="box askbox" role="alertdialog" aria-modal="true"><h2>${esc(o.title || "Are you sure?")}</h2>${o.text ? `<p>${esc(o.text)}</p>` : ""}${o.input ? `<input type="text" id="askin" maxlength="40" value="${esc(o.value || "")}" style="width:100%">` : ""}<div class="row" style="justify-content:flex-end;margin-top:14px"><button data-a="0">Cancel</button><button class="go" data-a="1">${esc(o.ok || "OK")}</button></div></div>`;
    document.body.appendChild(el);
    const inp = el.querySelector("#askin"), no = o.input ? null : false;
    const done = v => { document.removeEventListener("keydown", kd, true); el.remove(); res(v); };
    const kd = e => { if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); done(no); } else if (e.key === "Enter" && inp && document.activeElement === inp){ e.preventDefault(); e.stopPropagation(); done(inp.value); } };
    document.addEventListener("keydown", kd, true);
    el.onclick = e => { const b = e.target.closest("[data-a]"); if (b) done(b.dataset.a === "1" ? (inp ? inp.value : true) : no); else if (e.target === el) done(no); };
    setTimeout(() => { if (inp){ inp.focus(); inp.select(); } else el.querySelector(o.danger ? '[data-a="0"]' : '[data-a="1"]').focus(); }, 0);
  });
}

};

/* ---- music: four layers always playing in step, only one audible; changes cross-fade ---- */
const MUS = { names: ["theme_1_base", "theme_2_epic", "theme_3_intense", "theme_4_epic_intense", "theme_menu_lofi"], pair: [0, 0, 0, 0, 1], fade: 0.7,
  ac: null, master: null, bufs: [], gains: [], srcs: [], t0: [0, 0], cur: -1, loading: false, ready: false, vol: +(store.get("cg-vol") ?? 70), mute: !!store.get("cg-mute") };

// Set music volume (optionally ramping smoothly).
function musVolume(ramp){
  if (MUS.master){
    const t = MUS.ac.currentTime, v = MUS.mute ? 0 : Math.pow(MUS.vol / 100, 1.6), gp = MUS.master.gain;
    if (ramp){ gp.cancelScheduledValues(t); gp.setValueAtTime(0, t); gp.linearRampToValueAtTime(v, t + ramp); }   // gentle fade-in the first time the music starts
    else if (MUS.started) gp.setTargetAtTime(v, t, 0.05);
  }
  $("#mute").textContent = MUS.mute ? "Music off" : "Music on"; $("#vol").value = MUS.vol; }

// Fetch and decode the music tracks.
async function musLoad(){
  if (MUS.loading || BOT) return; MUS.loading = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    MUS.ac = new AC(); MUS.master = MUS.ac.createGain(); MUS.master.gain.value = 0; MUS.master.connect(MUS.ac.destination);
    const ext = document.createElement("audio").canPlayType('audio/ogg; codecs="vorbis"') ? "ogg" : "mp3";
    MUS.bufs = await Promise.all(MUS.names.map(n => fetch(`music/${n}.${ext}?v=3`).then(r => { if (!r.ok) throw new Error(n); return r.arrayBuffer(); }).then(b => MUS.ac.decodeAudioData(b))));
    MUS.gains = MUS.bufs.map(() => { const g = MUS.ac.createGain(); g.gain.value = 0; g.connect(MUS.master); return g; });
    const now = MUS.ac.currentTime + 0.1;
    MUS.t0 = [now, now];
    MUS.srcs = MUS.bufs.map((b, i) => musSrc(i, now, 0));
    MUS.ready = true; musVolume(); musCheck(); if (MUS.gest) musGo();
    sfxLoad();
  } catch (e) { console.warn("music unavailable", e); MUS.ready = false; }
}

// Create and start one looping track source.
function musSrc(i, when, offset){
  const s = MUS.ac.createBufferSource(); s.buffer = MUS.bufs[i]; s.loop = true; s.connect(MUS.gains[i]); s.start(when, offset); return s;
}

// Which track should be playing (index into MUS.names; -1 = silent). Menus use the lo-fi theme; games step up with tier-3 characters and with how close the score is.
function musWant(){
  if (BOT) return -1;
  if (SIM) return MUS.cur;
  if (!play || !net.mode || !inGame() || isOver() || $("#play").classList.contains("hide")) return 4;   // anywhere outside a running game: the lo-fi menu theme
  const star = a => a.some(e => byId[e.id] && gOf(e.id) === "character" && byId[e.id].tier === 3 && !e.dying);
  let epic = star(play.inplay);
  Object.keys(net.players).forEach(pid => { const st = net.players[pid].st; if (st && star(st.inplay)) epic = true; });
  const intense = Math.abs(net.score || 0) >= 20;
  return (epic ? 1 : 0) + (intense ? 2 : 0);
}

// Cross-fade to the wanted track if it changed.
function musCheck(){
  if (!MUS.ready) return;
  const w = musWant(); if (w === MUS.cur) return;
  const ac = MUS.ac, now = ac.currentTime;
  if (ac.state === "suspended") ac.resume();
  if (w >= 0 && MUS.cur >= 0 && MUS.pair[w] !== MUS.pair[MUS.cur]){
    // the two tempos aren't the same length: line the incoming pair up with where the outgoing one is (it is silent, so no one hears the jump)
    const pc = MUS.pair[MUS.cur], pn = MUS.pair[w], ic = MUS.cur, ins = MUS.pair.map((p, i) => p === pn ? i : -1).filter(i => i >= 0);
    const frac = (((now - MUS.t0[pc]) % MUS.bufs[ic].duration) + MUS.bufs[ic].duration) % MUS.bufs[ic].duration / MUS.bufs[ic].duration;
    const off = 0, when = now + 0.05;   // different tracks: the incoming one simply starts from its beginning
    ins.forEach(i => { try { MUS.srcs[i].stop(); } catch (_) {} MUS.srcs[i] = musSrc(i, when, off); });
    MUS.t0[pn] = when - off;
  }
  MUS.gains.forEach((g, i) => { g.gain.cancelScheduledValues(now); g.gain.setTargetAtTime(i === w ? 1 : 0, now, MUS.fade); });
  MUS.cur = w;
}
// Sound effects (files in music/): they play straight to the speakers, so the music fades and cuts never touch them.
const SFXN = { blood: "P_Blood_draw_1", card: "P_Card_Draw_1", impact: "P_Final_Impact", charge: "P_Final_Charge" };
const SFX = { bufs: {}, busy: {}, live: {}, nextCard: 0 };
// Fetch and decode them (a missing file is simply skipped).
// Tries a few spellings of each name (.mp3 / .ogg, original capitalisation / lower case) and warns in the console if none is found.
async function sfxLoad1(k){
  if (SFX.bufs[k] || SFX.busy[k]) return; SFX.busy[k] = true;
  const n = SFXN[k], tries = [`${n}.mp3`, `${n}.ogg`, `${n.toLowerCase()}.mp3`, `${n.toLowerCase()}.ogg`];
  for (const t of tries){
    try { const r = await fetch(`music/${t}`); if (!r.ok) continue; SFX.bufs[k] = await MUS.ac.decodeAudioData(await r.arrayBuffer()); break; } catch (_) {}
  }
  SFX.busy[k] = false; if (!SFX.bufs[k]) console.warn(`Sound effect not found: music/${n}.mp3`);
}
function sfxLoad(){ return Promise.all(Object.keys(SFXN).map(sfxLoad1)); }
// Play one effect (delay in seconds); returns a handle so it can be cut off.
function sfxPlay(k, delay){
  if (BOT || !MUS.ac || MUS.mute) return null;
  if (!SFX.bufs[k]){ sfxLoad1(k); return null; }   // not loaded yet: fetch it now for next time
  try {
    if (MUS.ac.state !== "running") MUS.ac.resume();
    const s = MUS.ac.createBufferSource(), g = MUS.ac.createGain(); s.buffer = SFX.bufs[k];
    g.gain.value = Math.max(.35, Math.pow(MUS.vol / 100, .8)); s.connect(g); g.connect(MUS.ac.destination);
    s.start(MUS.ac.currentTime + (delay || 0)); const h = { s, g }; SFX.live[k] = h; s.onended = () => { if (SFX.live[k] === h) delete SFX.live[k]; };
    return h;
  } catch (_) { return null; }
}
// Cut an effect off (short fade so it doesn't click).
function sfxStop(k){
  const h = SFX.live[k]; if (!h) return; delete SFX.live[k];
  try { const t = MUS.ac.currentTime; h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(h.g.gain.value, t); h.g.gain.linearRampToValueAtTime(0, t + .04); h.s.stop(t + .05); } catch (_) {}
}
// Card draws: several drawn at once are spaced out so each one is heard.
function sfxCardDraw(){
  if (!MUS.ac) return; const now = MUS.ac.currentTime, at = Math.max(now, SFX.nextCard); SFX.nextCard = at + .11;
  sfxPlay("card", Math.min(at - now, 1.2));
}
// Final-blow effects on the music: slow down (like a slow-motion film), cut dead on impact, then come back at normal speed.
function musSlow(ms){
  if (!MUS.ready || MUS.mute || BOT) return; MUS.fx = true;
  const t = MUS.ac.currentTime;
  MUS.srcs.forEach(s => { try { const p = s.playbackRate; p.cancelScheduledValues(t); p.setValueAtTime(1, t); p.linearRampToValueAtTime(.55, t + ms / 1000); } catch (_) {} });
}
function musCut(){
  if (!MUS.fx || !MUS.ready) return;
  const t = MUS.ac.currentTime, g = MUS.master.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + .03);
  MUS.srcs.forEach(s => { try { s.playbackRate.cancelScheduledValues(t); s.playbackRate.setValueAtTime(1, t + .03); } catch (_) {} });   // back to normal speed while it is silent
}
function musResume(fade){
  if (!MUS.fx || !MUS.ready) return; MUS.fx = false;
  const t = MUS.ac.currentTime, v = MUS.mute ? 0 : Math.pow(MUS.vol / 100, 1.6), g = MUS.master.gain;
  MUS.srcs.forEach(s => { try { s.playbackRate.cancelScheduledValues(t); s.playbackRate.setValueAtTime(1, t); } catch (_) {} });
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + (fade || .8));
}
/* The tracks are fetched and decoded as soon as the page opens (a browser won't make sound before a click, but it can get everything ready); the first click then fades the music in. */
function musGo(){
  if (!MUS.ac || !MUS.ready || MUS.started) return;
  MUS.started = true;
  const go = () => musVolume(2.5);
  if (MUS.ac.state === "suspended") MUS.ac.resume().then(go, go); else go();
}
document.addEventListener("pointerdown", () => { MUS.gest = true; if (!MUS.ac) musLoad(); else { if (MUS.ac.state === "suspended") MUS.ac.resume(); musGo(); } });
document.addEventListener("keydown", () => { MUS.gest = true; musGo(); });
if (!BOT) musLoad();
$("#mute").onclick = () => { MUS.mute = !MUS.mute; store.set("cg-mute", MUS.mute ? 1 : 0); musVolume(); };
$("#vol").oninput = e => { MUS.vol = +e.target.value; MUS.mute = false; store.set("cg-vol", MUS.vol); store.set("cg-mute", 0); musVolume(); };
$("#vol").value = MUS.vol; $("#mute").textContent = MUS.mute ? "Music off" : "Music on";


/* ---- fit the board to the window ---- */
let fitRaf = 0;

// Run fitPlay once at the next animation frame.
function fitSoon(){ if (fitRaf) return; fitRaf = requestAnimationFrame(() => { fitRaf = 0; fitPlay(); fanHand(); }); }

// Work out the card zoom (--cz) so the board fits the window without scrolling.
function fitPlay(){
  /* "Fit to board": only the cards shrink (through --cz), so text and panels keep their normal size */
  const ar = document.querySelector("#zones .arena"), root = document.documentElement;
  // Only on the play screen at desktop width, and only if the setting is on.
  const on = !BOT && SET.fit !== "0" && !!ar && !!play && !!net.mode && !$("#play").classList.contains("hide") && innerWidth > 900;
  document.body.classList.toggle("fit", on);
  if (ar) ar.style.zoom = "";
  if (!ar || !on){ root.style.removeProperty("--cz"); return; }
  const ce = ar.querySelector(".acenter") || ar;   // measure the card column only: the sidebar/log must never drive the zoom
  // Height the card column may use.
  const avail = innerHeight - (ce.getBoundingClientRect().top + scrollY) - 24;
  // Measure the card column's height at a given card zoom.
  const H = z => { root.style.setProperty("--cz", z); return ce.getBoundingClientRect().height; };
  const cur = parseFloat(root.style.getPropertyValue("--cz")) || 1;
  // Measure at full size; if it already fits there is nothing to do.
  const h1 = H(1);
  if (h1 <= avail){ if (cur !== 1) root.style.setProperty("--cz", "1"); return; }
  // C = the part of the height that scales with the cards; the rest (text, bars) stays fixed.
  const C = (h1 - H(0.4)) / 0.6;                       // height that scales with the cards
  // Solve for the card zoom that makes the column fit (never below 0.35 or above 1).
  let cz = C > 1 ? (avail - (h1 - C)) / C : 0.4;
  cz = Math.max(0.35, Math.min(1, cz));
  if (Math.abs(cz - cur) < 0.01) cz = cur;
  H(cz.toFixed(3));
}
if (window.ResizeObserver) new ResizeObserver(fitSoon).observe($("#zones"));
addEventListener("resize", fitSoon);

nt(90deg,#8e2a22,#2a2f3a 50%,#1f7a5a);margin:26px 8px 28px}\n.track i{position:absolute;top:-6px;width:12px;height:38px;border-radius:6px;background:#fff;box-shadow:0 0 8px #000;left:50%;transition:left .5s;transform:translateX(-50%)}\n.track b{position:absolute;top:30px;font-size:11px;color:var(--mu);transform:translateX(-50%)}\n.track em{position:absolute;top:-22px;font:600 12px system-ui;font-style:normal;color:var(--mu)}\n/* flow */\n.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}\n.st{flex:1 1 120px;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font-size:13px;position:relative}\n.st b{display:block;color:var(--gold);font-size:12px;margin-bottom:2px}\n.st.o{border-style:dashed}\n.st:not(:last-child)::after{content:\"\u25b8\";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--gold);z-index:2}\n/* cards */\n.cd{width:62px;height:88px;border-radius:8px;border:2px solid var(--ln);background:var(--pn2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;position:relative;flex:0 0 auto}\n.cd small{color:var(--mu);font-size:10px}\n.cd.ch{border-color:var(--blu)}.cd.it{border-color:var(--org)}.cd.pr{border-color:var(--grn)}.cd.en{border-color:var(--pur)}.cd.in{border-color:var(--red)}.cd.ev{border-color:var(--gold)}\n.cd.ghost{opacity:.35;border-style:dashed}\n.cd.dead{filter:grayscale(1);opacity:.4}\n.cd .n{position:absolute;top:-8px;left:-8px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#000;font:800 11px/20px system-ui}\n.slots{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:700 12px system-ui;border:1px solid}\n.pill.b{color:#ff8b7c;border-color:#8e2a22;background:#3a1612}\n.pill.d{color:#ffcf6a;border-color:#8a6a1c;background:#38290a}\n.pill.t{color:#e8e6df;border-color:#555;background:#000}\ntable{width:100%;border-collapse:collapse;font-size:13.5px}\ntd,th{border-bottom:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}\nth{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}\ninput[type=range]{width:220px;accent-color:var(--gold)}\n.ok{color:var(--grn);font-weight:700}.no{color:var(--red);font-weight:700}\n.heart{display:inline-flex;align-items:center;gap:4px;background:#12301f;border:1px solid #2d7a54;color:#8fe0b6;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}\n.note{font-size:12.5px;color:var(--mu);margin-top:6px}\n\n:root{--bg:#0a0605;--pn:#4b3626;--pn2:#3a281a;--ln:#2b190d;--tx:#f1e0b4;--mu:#bfa77c;--gold:#f0a24a}\nbody{font-family:Charter,'Bitstream Charter','Iowan Old Style','Palatino Linotype',Georgia,serif;background:#080504;position:relative}\nbody::before{content:\"\";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 55% 50% at 50% 40%,rgba(255,150,50,.22),transparent 75%)}\nheader h1{color:#ffc46a;text-shadow:0 0 14px rgba(255,160,60,.5)}\nsection{background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%),linear-gradient(100deg,#6d5233,#58412a 50%,#664b30);border:0;border-radius:0;clip-path:polygon(0 1%,3% 0,35% .8%,68% 0,100% 1%,99.5% 45%,100% 99%,62% 100%,28% 99%,0 100%,.5% 50%)}\nnav a:hover{background:rgba(75,54,38,.9)}\nnav a.on{color:#ffc46a}<\/style><\/head><body>\n<header><h1>How to play<\/h1><span>Mockup of a Rules tab \u2014 nothing here is wired to the game<\/span><\/header>\n<div class=\"wrap\">\n<nav>\n<a href=\"#win\">Win conditions<\/a><a href=\"#start\">Game start<\/a><a href=\"#turns\">Turns &amp; blocking<\/a><a href=\"#blood\">Blood<\/a><a href=\"#chars\">Characters<\/a><a href=\"#types\">Card types<\/a><a href=\"#conds\">Conditions<\/a><a href=\"#items\">Items<\/a>\n<\/nav>\n<main>\n\n<section id=\"win\"><h2>Win conditions<\/h2><div class=\"sub\">First to 30 points<\/div>\n<p>The game ends at 30 points in either player's favor. Deal damage to the opponent directly to tip the scales. When damage is dealt to a player, the damage amount pushes the game further toward that player's loss.<\/p>\n<div class=\"vis\"><h4>Try it: points ticker<\/h4>\n<div class=\"track\" id=\"trk\"><em style=\"left:0\">You lose at \u221230<\/em><em style=\"right:0\">Opponent loses at +30<\/em><i id=\"mk\"><\/i><b style=\"left:0%\">\u221230<\/b><b style=\"left:25%\">\u221215<\/b><b style=\"left:50%\">0<\/b><b style=\"left:75%\">+15<\/b><b style=\"left:100%\">+30<\/b><\/div>\n<div class=\"row\"><button data-p=\"3\">Opponent takes 3<\/button><button data-p=\"8\">Opponent takes 8<\/button><button data-p=\"-5\">You take 5<\/button><button data-p=\"0\">Reset<\/button><span id=\"ptx\" class=\"note\"><\/span><\/div><\/div><\/section>\n\n<section id=\"start\"><h2>Game start<\/h2>\n<ul><li>The starting player is picked with a coin flip.<\/li><li>The host selects how many Character and Other cards both players start with.<\/li><\/ul>\n<div class=\"vis\"><h4>Setup<\/h4><div class=\"row\"><span class=\"pill d\">\ud83e\ude99 Coin flip \u2192 first player<\/span><span class=\"st\" style=\"flex:0 1 auto\">Host picks: <b style=\"display:inline;color:var(--blu)\">N Character<\/b> + <b style=\"display:inline;color:var(--org)\">N Other<\/b> cards each<\/span><\/div><\/div><\/section>\n\n<section id=\"turns\"><h2>Turns<\/h2><div class=\"sub\">Everything happens in this order<\/div>\n<div class=\"vis\"><h4>Turn flow<\/h4><div class=\"flow\">\n<div class=\"st\"><b>1 \u00b7 Passive<\/b>Gain 1 Blood<\/div>\n<div class=\"st\"><b>2 \u00b7 Draw<\/b>1 Character, 1 Other, or 1 extra Blood<\/div>\n<div class=\"st\"><b>3 \u00b7 Play<\/b>Any number of cards you can afford<\/div>\n<div class=\"st\"><b>4 \u00b7 Attack?<\/b>Attack or abstain<\/div>\n<div class=\"st o\"><b>5 \u00b7 Block<\/b>Opponent may block<\/div>\n<div class=\"st o\"><b>6 \u00b7 After combat<\/b>Conditions take effect<\/div><\/div><\/div>\n<ul><li>Choose which Characters attack. If the opponent has Characters, they may block.<\/li><li>One blocker may block one attacker, and each Character can block only once per attacking turn.<\/li><\/ul>\n<div class=\"vis\"><h4>Blocking: one-to-one<\/h4>\n<svg viewBox=\"0 0 600 190\" width=\"100%\" role=\"img\" aria-label=\"Three attackers: two are blocked one-to-one, the third is unblocked\">\n<defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8z\" fill=\"#e0b040\"/><\/marker><\/defs>\n<g font-family=\"system-ui\" font-size=\"12\" text-anchor=\"middle\">\n<text x=\"300\" y=\"14\" fill=\"#9aa3b2\">Attacking player<\/text>\n<rect x=\"60\" y=\"24\" width=\"70\" height=\"44\" rx=\"8\" fill=\"#232a36\" stroke=\"#4a86c8\" stroke-width=\"2\"/><text x=\"95\" y=\"51\" fill=\"#e8e6df\">Attacker 1<\/text>\n<rect x=\"265\" y=\"24\" width=\"70\" height=\"44\" rx=\"8\" fill=\"#232a36\" stroke=\"#4a86c8\" stroke-width=\"2\"/><text x=\"300\" y=\"51\" fill=\"#e8e6df\">Attacker 2<\/text>\n<rect x=\"470\" y=\"24\" width=\"70\" height=\"44\" rx=\"8\" fill=\"#232a36\" stroke=\"#4a86c8\" stroke-width=\"2\"/><text x=\"505\" y=\"51\" fill=\"#e8e6df\">Attacker 3<\/text>\n<rect x=\"60\" y=\"120\" width=\"70\" height=\"44\" rx=\"8\" fill=\"#232a36\" stroke=\"#d9503f\" stroke-width=\"2\"/><text x=\"95\" y=\"147\" fill=\"#e8e6df\">Blocker A<\/text>\n<rect x=\"265\" y=\"120\" width=\"70\" height=\"44\" rx=\"8\" fill=\"#232a36\" stroke=\"#d9503f\" stroke-width=\"2\"/><text x=\"300\" y=\"147\" fill=\"#e8e6df\">Blocker B<\/text>\n<line x1=\"95\" y1=\"70\" x2=\"95\" y2=\"116\" stroke=\"#e0b040\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n<line x1=\"300\" y1=\"70\" x2=\"300\" y2=\"116\" stroke=\"#e0b040\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/>\n<line x1=\"505\" y1=\"70\" x2=\"505\" y2=\"116\" stroke=\"#d9503f\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\" marker-end=\"url(#ar)\"/>\n<text x=\"505\" y=\"140\" fill=\"#ff8b7c\">Unblocked \u2192<\/text><text x=\"505\" y=\"156\" fill=\"#ff8b7c\">items, then player<\/text>\n<text x=\"300\" y=\"184\" fill=\"#9aa3b2\">Defending player<\/text><\/g><\/svg><\/div><\/section>\n\n<section id=\"blood\"><h2>Blood rules<\/h2>\n<ul><li>Gain 1 <span class=\"pill b\">Blood<\/span> when your Character is killed, unless otherwise specified or it is worth zero Blood.<\/li>\n<li>Gain 1 <span class=\"pill d\">Dry Blood<\/span> and 1 <span class=\"pill t\">Token<\/span> <b>only<\/b> when a fully upgraded Character (3 attached upgrades) you control is killed, unless it is worth zero Blood.<\/li>\n<li>You still get the Token even if you are at max Dry Blood.<\/li>\n<li>Dry Blood refreshes every turn, even after you use it.<\/li>\n<li>Tokens pay for cards that cost a Token.<\/li><\/ul>\n<div class=\"vis\"><h4>When your Character dies<\/h4>\n<div class=\"row\"><div class=\"cd ch dead\">Character<small>0\u20132 upgrades<\/small><\/div><span style=\"font-size:22px;color:var(--gold)\">\u2192<\/span><span class=\"pill b\">+1 Blood<\/span><\/div>\n<div class=\"row\" style=\"margin-top:10px\"><div class=\"cd ch dead\">Character<small>3 upgrades<\/small><\/div><span style=\"font-size:22px;color:var(--gold)\">\u2192<\/span><span class=\"pill b\">+1 Blood<\/span><span class=\"pill d\">+1 Dry Blood <small>(refreshes each turn)<\/small><\/span><span class=\"pill t\">+1 Token <small>(kept)<\/small><\/span><\/div>\n<div class=\"note\">Worth-zero-Blood Characters give none of these.<\/div><\/div><\/section>\n\n<section id=\"chars\"><h2>Character cards<\/h2>\n<ul><li>Played during your turn, before combat. They cannot attack on their first turn alive.<\/li><li>Only 4 Characters on the field at a time.<\/li><li>You can remove Prescriptions from your Characters on your turn; the Prescription returns to your hand.<\/li><li>You can sacrifice a Character on your turn if you played no cards that turn.<\/li><li>A killed Character is banished along with its upgrades, unless otherwise specified.<\/li><li>At the start of each turn, all living Characters' Health refreshes.<\/li><\/ul>\n<div class=\"vis\"><h4>Field: 4 Character slots<\/h4><div class=\"slots\">\n<div class=\"cd ch\"><span class=\"n\">1<\/span>Character<small>+2 cards<\/small><\/div><div class=\"cd ch\"><span class=\"n\">2<\/span>Character<\/div><div class=\"cd ch\"><span class=\"n\">3<\/span>Character<\/div><div class=\"cd ghost\"><span class=\"n\">4<\/span>empty<\/div><\/div>\n<div class=\"note\">Each Character can carry attached upgrades (Enchantments, Prescriptions).<\/div><\/div><\/section>\n\n<section id=\"types\"><h2>Card types<\/h2><div class=\"sub\">Colors match the borders used above<\/div>\n<div class=\"vis\" style=\"padding:6px 10px\"><table>\n<tr><th><\/th><th>Type<\/th><th>Where it goes<\/th><th>Rules<\/th><\/tr>\n<tr><td><div class=\"cd ch\" style=\"width:38px;height:52px\"><\/div><\/td><td><b>Character<\/b><\/td><td>Field (max 4)<\/td><td>Before combat. Can't attack the turn it arrives.<\/td><\/tr>\n<tr><td><div class=\"cd en\" style=\"width:38px;height:52px\"><\/div><\/td><td><b>Enchantment<\/b><\/td><td>On a Character<\/td><td>Upgrades abilities. <span class=\"no\">Cannot be removed.<\/span><\/td><\/tr>\n<tr><td><div class=\"cd pr\" style=\"width:38px;height:52px\"><\/div><\/td><td><b>Prescription<\/b><\/td><td>On a Character<\/td><td>Upgrades stats or inflicts Conditions on attacked Characters. <span class=\"ok\">Removable on your turn.<\/span> Immunity <span class=\"heart\">\u2665 Condition<\/span> blocks that Condition.<\/td><\/tr>\n<tr><td><div class=\"cd in\" style=\"width:38px;height:52px\"><\/div><\/td><td><b>Infliction<\/b><\/td><td>Directly on a Character<\/td><td>Before combat. Not an upgrade. Changes how Characters function: hurt their weaknesses or boost your own.<\/td><\/tr>\n<tr><td><div class=\"cd ev\" style=\"width:38px;height:52px\"><\/div><\/td><td><b>Envision<\/b><\/td><td>Not on a Character<\/td><td>Before combat. Alters information and the flow of the game rather than a player's power.<\/td><\/tr>\n<tr><td><div class=\"cd it\" style=\"width:38px;height:52px\"><\/div><\/td><td><b>Item<\/b><\/td><td>Item lane (max 4)<\/td><td>Before combat. See Items below.<\/td><\/tr><\/table><\/div><\/section>\n\n<section id=\"conds\"><h2>Conditions<\/h2>\n<ul><li>Conditions apply their effect <b>after<\/b> combat, except Parasitic and Poison, which have kill effects.<\/li><li>Conditions stack: each copy applies its effect again (two Beartraps are \u22122 Health).<\/li><li>Conditions can only be removed with Prescriptions.<\/li><\/ul>\n<div class=\"vis\"><h4>Timing<\/h4><div class=\"flow\"><div class=\"st\"><b>During combat<\/b>Parasitic \u00b7 Poison act immediately<\/div><div class=\"st\"><b>After combat<\/b>All other Conditions take effect<\/div><\/div><\/div>\n<div class=\"vis\"><h4>Immunity heart<\/h4><div class=\"row\"><div class=\"cd pr\">Vaccine<small>Prescription<\/small><\/div><span class=\"heart\">\u2665 Sickly<\/span><span class=\"note\" style=\"flex:1 1 200px\">A Character wearing this cannot be given Sickly. Attaching it also cures an existing Sickly.<\/span><\/div><\/div><\/section>\n\n<section id=\"items\"><h2>Items<\/h2>\n<ul><li>Played before combat. Up to 4 Items, only while you control fewer than 4 Characters.<\/li><li>Damage that gets past your Characters hits Items first (oldest to newest), then the player.<\/li><li>Overflow from a destroyed Item carries to the next Item, then to the player.<\/li><li>Items can't be sacrificed, give no Blood when destroyed, and can't have Conditions applied.<\/li><\/ul>\n<div class=\"vis\"><h4>Try it: can I play an Item?<\/h4><div class=\"row\"><label>Characters in play: <b id=\"nc\">2<\/b><\/label><input type=\"range\" id=\"ncs\" min=\"0\" max=\"4\" value=\"2\"><span id=\"ncr\"><\/span><\/div><\/div>\n<div class=\"vis\"><h4>Try it: unblocked damage<\/h4><div class=\"row\"><label>Incoming damage: <b id=\"dm\">5<\/b><\/label><input type=\"range\" id=\"dms\" min=\"0\" max=\"12\" value=\"5\"><\/div>\n<div class=\"slots\" id=\"itl\" style=\"margin-top:12px\"><\/div><div class=\"note\" id=\"itn\"><\/div><\/div><\/section>\n<\/main><\/div>\n<script>\ndocument.querySelectorAll('nav a[href^=\"#\"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const t=document.getElementById(a.getAttribute('href').slice(1));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});}));\nconst $=s=>document.querySelector(s);\nlet pts=0;\nconst showPts=()=>{ $(\"#mk\").style.left=(50+pts/30*50)+\"%\"; $(\"#ptx\").textContent=pts===0?\"Even\":pts>0?`${pts} toward opponent (30 = they lose)`:`${-pts} toward you (30 = you lose)`; };\ndocument.querySelectorAll(\"[data-p]\").forEach(b=>b.onclick=()=>{ const v=+b.dataset.p; pts=v===0?0:Math.max(-30,Math.min(30,pts+v)); showPts(); }); showPts();\nconst ncs=$(\"#ncs\"), nc=()=>{ const n=+ncs.value; $(\"#nc\").textContent=n; $(\"#ncr\").innerHTML=n<4?'<span class=\"ok\">Items allowed<\/span>':'<span class=\"no\">Field full \u2014 no Items<\/span>'; }; ncs.oninput=nc; nc();\nconst HP=[2,3,1], dms=$(\"#dms\");\nfunction dm(){ let d=+dms.value; $(\"#dm\").textContent=d; let h=\"\", left=d, ov=\"\";\n  HP.forEach((hp,i)=>{ const hit=Math.min(left,hp), dead=left>=hp; left-=hit; h+=`<div class=\"cd it ${dead?\"dead\":\"\"}\"><span class=\"n\">${i+1}<\/span>Item<small>HP ${hp}<\/small><small style=\"color:${hit?\"#ff8b7c\":\"inherit\"}\">${hit?`\u2212${hit}${dead?\" \u2715\":\"\"}`:\"\u2014\"}<\/small><\/div>`; });\n  h+=`<span style=\"font-size:22px;color:var(--gold)\">\u2192<\/span><div class=\"cd\" style=\"border-color:#fff\">Player<small>${left>0?`+${left} pts`:\"safe\"}<\/small><\/div>`;\n  $(\"#itl\").innerHTML=h; $(\"#itn\").textContent=left>0?`${left} overflow reached the player and moves the ticker.`:\"Absorbed by Items.\"; }\ndms.oninput=dm; dm();\n<\/script><\/body><\/html>\n";

// Switch between the main screens (menu, build, play, rules).
function show(tab){
  $("#menu").classList.toggle("hide", tab!=="menu"); $("#menu").style.display = tab==="menu" ? "" : "none";
  $("#mm").classList.toggle("hide", tab==="menu");
  $("#sb").classList.toggle("hide", tab==="menu");
  document.body.classList.toggle("onmenu", tab==="menu");
  $("#build").classList.toggle("hide", tab!=="build");
  $("#play").classList.toggle("hide", tab!=="play");
  $("#rules").classList.toggle("hide", tab!=="rules");
  $("#profile").classList.toggle("hide", tab!=="profile");
  $("#tr").classList.toggle("on", tab==="rules");
  if (tab==="rules" && !$("#rules").firstChild){ const f = document.createElement("iframe"); f.title = "Rules"; f.style.cssText = "width:100%;height:calc(100vh - 62px);border:0;display:block"; f.srcdoc = RULES_HTML; $("#rules").appendChild(f); }
  $("#tb").classList.toggle("on", tab==="build");
  $("#tp").classList.toggle("on", tab==="play");
  updateLock();
  if (tab==="menu") renderMenu();
  musCheck(); fitSoon();
  if (tab==="play"){ syncPlayView(); if (!net.mode) renderLobby(); else if (!play || play.deckName !== cur || play.sig !== JSON.stringify(deck())) newGame(); }
}

/* ---------- online play (peer to peer: the room creator's browser is the host) ---------- */

/* ====================================================================================================
   NETWORKING AND ROOM
   ==================================================================================================== */

const net = { score: 0, mode: null, role: null, code: "", peer: null, conns: {}, hostConn: null, myId: null, players: {}, log: [], stage: "choose", err: "", busy: "", ready: false, n: 0, name: store.get("cg-name") || "Player" };
// Room-code alphabet, PeerJS id prefix and the player limit.
const CODE_CH = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", PEER_PREFIX = "pdmcg-", MAX_PLAYERS = 2;
// Make a random room code.
const genCode = () => Array.from({ length: 5 }, () => CODE_CH[Math.random() * CODE_CH.length | 0]).join("");

// Load the PeerJS library on demand.
function loadPeerJS(){
  return new Promise((res, rej) => {
    if (window.Peer) return res();
    const urls = ["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js", "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"];
    let i = 0;
    const next = () => {
      if (i >= urls.length) return rej(new Error("Could not load the online play library. Check your internet connection and try again."));
      const sc = document.createElement("script");
      sc.src = urls[i++];
      sc.onload = () => window.Peer ? res() : next();
      sc.onerror = next;
      document.head.appendChild(sc);
    };
    next();
  });
}

// Open a PeerJS connection with the given id.
function openPeer(id){
  return new Promise((res, rej) => {
    let p;
    try { p = id ? new Peer(id) : new Peer(); } catch(e){ return rej(e); }
    p.on("open", () => res(p));
    p.on("error", rej);
  });
}

// Show the lobby or the game depending on the state.
function syncPlayView(){
  $("#lobby").classList.toggle("hide", !!net.mode);
  $("#zones").classList.toggle("hide", !net.mode);
}

// Draw the online lobby (create / join room).
function renderLobby(){
  if (!net.mode && net.stage === "choose" && !$("#play").classList.contains("hide")){ show("menu"); return; }
  syncPlayView();
  const L = $("#lobby");
  const pr = problems();
  if (net.stage === "busy"){ L.innerHTML = `<h2>${esc(net.busy)}</h2><p class="stat">This can take a few seconds.</p>`; return; }
  if (net.stage === "online"){
    L.innerHTML = `<h2>Play online</h2>
      ${ACC.user && ACC.name ? `<div class="rkb">${rankSvg(ACC.prof && ACC.prof.tier, 38)}<div><b>${esc(RANKS[((ACC.prof && ACC.prof.tier) || 1) - 1].n)}</b><br><span class="stat">Ranked is open to you</span></div></div>` : `<p class="stat">Sign in (top right) to play ranked and keep a match history.</p>`}
      <p class="stat">Create a room or join a friend's room with their code.</p>
      <div class="lrow"><label>Your name <input type="text" id="pname" maxlength="16" value="${esc(net.name)}" ${ACC.name ? `readonly title="Your account name"` : ""}></label></div>
      ${pr.length ? `<p class="warn">Your deck isn't ready yet: ${esc(pr[0])}</p>` : ""}
      <div class="lrow"><button class="go big" data-lb="create" ${pr.length ? "disabled" : ""}>Create a casual room</button><button class="go big" data-lb="createR" ${pr.length || !(ACC.user && ACC.name) ? "disabled" : ""} title="${ACC.user ? "" : "Sign in to play ranked"}">Create a ranked room</button></div>
      <div class="lrow"><input type="text" id="jcode" maxlength="5" placeholder="CODE" aria-label="Room code" autocomplete="off"><button class="go" data-lb="join" ${pr.length ? "disabled" : ""}>Join room</button></div>
      <div class="warn" role="alert">${esc(net.err)}</div>
      <p class="stat" style="font-size:12px">Ranked rooms are for two signed-in players with fixed rules, and they change your hidden rating. Online games you play while signed in appear in your match history; games against the AI are never saved. </p>
      <p class="stat" style="font-size:12px">The person who creates the room hosts it from their own browser, so they need to keep this page open. Everyone plays with the deck you picked: <b>${esc(cur)}</b>.</p>
      <div class="lrow"><button data-lb="back">Back</button></div>`;
    return;
  }
  L.innerHTML = `<h2>How do you want to play?</h2>
    <p class="stat">Playing as <b>${esc(cur)}</b></p>
    <div class="lrow"><button class="go big" data-lb="solo">Solo</button><button class="go big" data-lb="online">Online</button><button class="go big" data-lb="ai" ${pr.length ? "disabled" : ""}>Play vs AI</button></div>
    ${pr.length ? `<p class="warn">Your deck isn't ready yet: ${esc(pr[0])}</p>` : `<p class="stat" style="font-size:12px">Play vs AI: a computer opponent with a random deck that follows the same rules and turn clock. Needs no internet.</p>`}`;
}

// Handle lobby buttons.
async function lobbyClick(e){
  const b = e.target.closest("[data-lb]");
  if (!b) return;
  const a = b.dataset.lb;
  if (a === "solo"){ net.mode = "solo"; net.ready = false; syncPlayView(); newGame(); return; }
  if (a === "online"){ net.stage = "online"; net.err = ""; renderLobby(); return; }
  if (a === "back"){ net.stage = "choose"; net.err = ""; renderLobby(); return; }
  if (a === "ai"){ if (problems().length) return; createAiRoom(); return; }
  if (a !== "create" && a !== "createR" && a !== "join") return;
  if (a === "createR" && !(ACC.user && ACC.name)){ net.err = "Sign in to play ranked."; renderLobby(); return; }
  const nm = ACC.name || ($("#pname") ? $("#pname").value.trim().slice(0, 16) : "");
  net.name = nm || "Player"; store.set("cg-name", net.name);
  const code = a === "join" ? ($("#jcode").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "") : "";
  if (a === "join" && code.length !== 5){ net.err = "Room codes are 5 characters."; renderLobby(); return; }
  net.err = ""; net.stage = "busy"; net.busy = a !== "join" ? "Creating your room…" : "Joining room " + code + "…"; renderLobby();
  try { if (a === "join") await joinRoom(code); else await createRoom(a === "createR"); }
  catch(err){
    dropPeer();
    net.stage = "online"; net.err = (err && err.message) || "Something went wrong. Please try again.";
    renderLobby();
  }
}

// Close the PeerJS connection.
function dropPeer(){
  try { if (net.peer) net.peer.destroy(); } catch(_){}
  net.peer = null; net.hostConn = null; net.conns = {}; net.players = {}; net.ready = false;
}

// Switch into the room view after connecting.
function enterRoom(){
  lastSnapStr = "";
  net.mode = "online"; net.stage = "choose"; net.ready = true;
  syncPlayView(); newGame();
}

// Leave the room and clean everything up.
function leaveRoom(){
  if (net.mode === "online" && net.ranked && !net.ai && !net.leaveQuiet && inGame() && !isOver()){ ffSend(); recordMatch(true, true); }
  net.leaveQuiet = false;
  stopAi();
  const conns = Object.values(net.conns), hc = net.hostConn, peer = net.peer;
  net.mode = null; net.ready = false;
  try { conns.forEach(c => c.close()); if (hc) hc.close(); if (peer) peer.destroy(); } catch(_){}
  Object.assign(net, { ranked: false, rec: null, ffGot: false, g: null, seen: null, cb: null, rp: null, tEnd: null, score: 0, role: null, code: "", peer: null, conns: {}, hostConn: null, myId: null, players: {}, log: [], stage: "choose", err: "", busy: "" });
  play = null; cancelCast(); closeModals(); renderLobby(); updateLock();
}

// Host: open a room and wait for a guest.
async function createRoom(ranked){
  await loadPeerJS();
  let peer = null, code = "";
  for (let i = 0; i < 6 && !peer; i++){
    code = genCode();
    try { peer = await openPeer(PEER_PREFIX + code); }
    catch(e){ if (e && e.type === "unavailable-id") continue; throw e; }
  }
  if (!peer) throw new Error("Couldn't reserve a room code. Try again.");
  Object.assign(net, { peer, role: "host", code, ranked: !!ranked, rec: null, ffGot: false, leaveQuiet: false, players: {}, conns: {}, log: [], n: 0, myId: "host", g: { phase: "lobby", secs: 120, hc: 3, ho: 2, who: null, first: null, n: 0, paused: false, coin: false, remain: 0 }, seen: { phase: "lobby", n: 0 }, cb: null, rp: null });
  peer.on("connection", conn => {
    conn.on("data", d => hostRecv(conn, d));
    conn.on("close", () => hostDrop(conn));
    conn.on("error", () => hostDrop(conn));
  });
  peer.on("error", e => { if (net.mode === "online") toast("Connection problem", (e && e.type) || "Network error"); });
  // if the broker connection drops, keep the room joinable instead of silently going dark
  peer.on("disconnected", () => { try { if (net.peer === peer && !peer.destroyed) peer.reconnect(); } catch(_){} });
  enterRoom();
}
/* ---------- Play vs AI: host side ---------- */
let aiFrame = null, aiConn = null;

// Messages from the AI frame go through here as if they came from a network guest.
function aiMsg(e){
  if (!aiFrame || e.source !== aiFrame.contentWindow || !e.data || !e.data.bot || !aiConn) return;
  hostRecv(aiConn, e.data.d);
}

// Close the AI frame.
function stopAi(){
  window.removeEventListener("message", aiMsg);
  if (aiFrame){ try { aiFrame.remove(); } catch(_){} }
  aiFrame = null; aiConn = null; net.ai = false;
}

// Start a game against the AI (a local room whose guest is a hidden frame).
function createAiRoom(){
  stopAi();
  Object.assign(net, { peer: { destroyed: false, destroy(){}, on(){ return this; } }, role: "host", code: "AI", ai: true, ranked: false, rec: null, players: {}, conns: {}, log: [], n: 0, myId: "host", g: { phase: "lobby", secs: 120, hc: 3, ho: 2, who: null, first: null, n: 0, paused: false, coin: false, remain: 0 }, seen: { phase: "lobby", n: 0 }, cb: null, rp: null });
  enterRoom();
  const f = document.createElement("iframe");
  f.title = "AI opponent"; f.setAttribute("aria-hidden", "true"); f.tabIndex = -1;
  f.style.cssText = "position:fixed;left:-3000px;top:0;width:1200px;height:900px;border:0;opacity:0;pointer-events:none";
  aiFrame = f;
  aiConn = { open: true, send(d){ try { if (aiFrame && aiFrame.contentWindow) aiFrame.contentWindow.postMessage({ bot: 1, d }, "*"); } catch(_){} }, close(){} };
  window.addEventListener("message", aiMsg);
  f.src = location.href.split(/[?#]/)[0] + "?bot=1";
  document.body.appendChild(f);
}

// Guest: join a room by its code.
async function joinRoom(code){
  await loadPeerJS();
  const peer = await openPeer(null);
  net.peer = peer;
  const conn = await new Promise((res, rej) => {
    const c = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: "json" });
    const to = setTimeout(() => rej(new Error("Couldn't reach that room. Check the code and make sure the host still has the page open.")), 15000);
    peer.on("error", e => { if (e && e.type === "peer-unavailable"){ clearTimeout(to); rej(new Error("No room found with that code.")); } });
    c.on("open", () => { clearTimeout(to); res(c); });
    c.on("error", e => { clearTimeout(to); rej(e); });
  });
  Object.assign(net, { hostConn: conn, role: "guest", code, ranked: false, rec: null, ffGot: false, leaveQuiet: false, players: {}, log: [] });
  conn.on("data", guestRecv);
  const hostGone = () => { if (net.mode === "online" && net.hostConn === conn){
    if (isOver()){ endCheck(); if (END && !END.hostGone){ END.left = "The host"; END.hostGone = true; endDraw(); toast("Room closed", "The host left the room.", "info"); } return; }
    toast("Room closed", "The host left the room."); net.leaveQuiet = true; leaveRoom(); } };
  conn.on("close", hostGone);
  conn.on("error", hostGone);
  await new Promise((res, rej) => {
    net.welcomeRes = res; net.welcomeRej = rej;
    net.welcomeTo = setTimeout(() => rej(new Error("The room didn't respond.")), 8000);
    conn.send({ t: "hello", name: net.name, uid: ACC.user ? ACC.user.id : null });
  });
}

// Store a player's name and latest snapshot.
function setSt(pid, st, name){
  const p = net.players[pid] || (net.players[pid] = { name: name || "Player", st: null });
  if (name) p.name = name;
  if (!st) return;
  (st.inplay || []).forEach(e => { if (e.dying) e.dying = Date.now() - e.dying; });
  p.st = st;
  if (st.name) p.name = st.name;
}

// Host: send a message to every connection (except one).
function bcast(msg, except){ Object.entries(net.conns).forEach(([id, c]) => { if (id !== except && c.open) c.send(msg); }); }

// Host: handle a message from the guest.
function hostRecv(conn, d){
  if (!d || typeof d !== "object") return;
  // A guest introduces itself: add them and send the current room state.
  if (d.t === "hello"){
    if (Object.keys(net.conns).length >= MAX_PLAYERS - 1 || (net.g && net.g.phase === "play")){ conn.send({ t: "full" }); setTimeout(() => { try { conn.close(); } catch(_){} }, 400); return; }
    if (net.ranked && !d.uid){ conn.send({ t: "needsign" }); setTimeout(() => { try { conn.close(); } catch(_){} }, 400); return; }
    const id = "p" + (++net.n), nm = String(d.name || "Player").slice(0, 16);
    conn._pid = id; net.conns[id] = conn; net.players[id] = { name: nm, st: null, uid: d.uid ? String(d.uid).slice(0, 40) : null };
    const list = { host: { name: net.name, st: play ? mySnap() : null, uid: ACC.user ? ACC.user.id : null } };
    Object.entries(net.players).forEach(([pid, pl]) => { if (pid !== id) list[pid] = { name: pl.name, st: pl.st ? stForWire(pl.st) : null }; });
    conn.send({ t: "welcome", id, players: list, score: net.score, g: net.g, ranked: !!net.ranked });
    bcast({ t: "join", id, name: nm }, id);
    netLog(nm + " joined the room");
    renderRoomBar(); renderOpps(); if (net.g && net.g.phase === "lobby") renderPlay();
    return;
  }
  // Everything below needs a known player.
  const pid = conn._pid;
  if (!pid || !net.players[pid]) return;
  // Turn control, score, relayed commands, state snapshots and events (the host passes them on to everyone else).
  if (d.t === "endturn"){ if (net.g && net.g.phase === "play" && net.g.who === pid) hostEndTurn(); }
  else if (d.t === "pause"){ if (net.g && net.g.who === pid) hostPause(); }
  else if (d.t === "tolobby"){ toLobby(); }
  else if (d.t === "ff"){ ffReceived(); }
  else if (d.t === "score"){ net.score = Math.max(-SC_MAX, Math.min(SC_MAX, +d.s || 0)); if (play) renderPlay(); }
  else if (d.t === "cmd"){
    if (d.to === "host") applyCmd(pid, d.cmd);
    else if (net.conns[d.to] && net.conns[d.to].open) net.conns[d.to].send({ t: "cmd", from: pid, cmd: d.cmd });
  }
  else if (d.t === "st"){ setSt(pid, d.st); bcast({ t: "st", id: pid, st: stForWire(net.players[pid].st) }, pid); renderOpps(); }
  else if (d.t === "ev"){ applyEv(pid, d.ev); bcast({ t: "ev", id: pid, ev: d.ev }, pid); }
}

// Host: the guest's connection closed; mark them gone.
function hostDrop(conn){
  const pid = conn._pid;
  if (!pid || net.conns[pid] !== conn) return;
  const nm = net.players[pid] ? net.players[pid].name : "A player";
  delete net.conns[pid]; delete net.players[pid];
  bcast({ t: "left", id: pid });
  netLog(nm + " left the room");
  net.cb = null; net.rp = null;
  if (isOver()){ endCheck(); if (END){ END.left = nm; endDraw(); } toast("Opponent left", nm + " left the room.", "info"); }
  else if (net.g && net.g.phase === "play"){ toast("Opponent left", nm + " left, so the game ended.", "info"); toLobby(); }
  renderRoomBar(); renderOpps(); if (net.g && net.g.phase === "lobby") renderPlay();
}

// Guest: handle a message from the host.
function guestRecv(d){
  if (!d || typeof d !== "object") return;
  // The host accepted us: take our id, the players and the score, then enter the room.
  if (d.t === "welcome"){
    clearTimeout(net.welcomeTo);
    net.myId = d.id; net.score = +d.score || 0; net.g = d.g || { phase: "lobby", secs: 120, hc: 3, ho: 2, who: null, n: 0, paused: false, remain: 0 }; net.seen = { phase: net.g.phase, n: net.g.n };
    Object.entries(d.players || {}).forEach(([pid, pl]) => { setSt(pid, pl.st, pl.name); if (pl.uid && net.players[pid]) net.players[pid].uid = String(pl.uid).slice(0, 40); });
    net.ranked = !!d.ranked;
    enterRoom();
    if (net.welcomeRes) net.welcomeRes();
  // Room is full.
  } else if (d.t === "full"){
    clearTimeout(net.welcomeTo);
    if (net.welcomeRej) net.welcomeRej(new Error("That room is full."));
  } else if (d.t === "needsign"){
    clearTimeout(net.welcomeTo);
    if (net.welcomeRej) net.welcomeRej(new Error("That is a ranked room. Sign in to join it."));
  } else if (d.t === "join"){ setSt(d.id, null, d.name); netLog(d.name + " joined the room"); renderRoomBar(); renderOpps(); if (net.g && net.g.phase === "lobby") renderPlay(); }
  else if (d.t === "st"){ setSt(d.id, d.st); renderOpps(); }
  else if (d.t === "left"){ const nm = net.players[d.id] ? net.players[d.id].name : "A player"; delete net.players[d.id]; netLog(nm + " left the room"); renderRoomBar(); renderOpps(); }
  else if (d.t === "ev") applyEv(d.id, d.ev);
  else if (d.t === "ff") ffReceived();
  else if (d.t === "score"){ net.score = Math.max(-SC_MAX, Math.min(SC_MAX, +d.s || 0)); if (play) renderPlay(); }
  // The host's game state: phase, whose turn, clocks.
  else if (d.t === "game"){ net.g = d.g; if (d.score !== undefined) net.score = d.score; applyGame(d.g); }
  else if (d.t === "cmd") applyCmd(d.from, d.cmd);
}

// Send a command to one player (e.g. 'discard this card').
function sendCmd(to, cmd){
  if (SIM) return;
  if (!to || to === me()) return;
  if (net.mode !== "online" || !net.ready) return;
  if (net.role === "host"){ const c = net.conns[to]; if (c && c.open) c.send({ t: "cmd", from: "host", cmd }); }
  else if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: "cmd", to, cmd });
}

// Apply a command someone sent me (longer toasts while doing so).
function applyCmd(from, cmd){
  toastMs = 5500; try { applyCmd2(from, cmd); } finally { toastMs = 3800; }
}

// The commands themselves: results of battles, discards, inflictions and so on.
function applyCmd2(from, cmd){
  if (!play || !cmd) return;
  // Who sent it, and which of my board cards it concerns.
  const who = from === "host" ? net.name : ((net.players[from] || {}).name || "An opponent");
  const ent = play.inplay.find(e => e.uid === cmd.uid);
  // Battle flow: attack declared -> I choose blockers -> the attacker runs the fight -> I get the result.
  if (cmd.k === "attack"){ if (cmd.extra) toast("Merciless", "A Merciless character attacks again.", "info"); net.cb = { role: "def", phase: cmd.control ? "wait" : "pick", ctl: !!cmd.control, from, att: cmd.att || [], asg: (cmd.att || []).map(() => null) }; closeAct(); play.tgt = null; play.pick = null; renderPlay(); return; }
  if (cmd.k === "def"){ runCombat(cmd.asg || []); return; }
  if (cmd.k === "res"){ applyRes(cmd); return; }
  // Effects the other player used on me (Peer, Plague, Retaliate, inflictions).
  if (cmd.k === "peer"){ sendCmd(from, { k: "peerr", name: net.name, hand: play.hand.slice(), discard: play.discard.slice() }); toast("Peer", `${who} is looking at your hand.`, "info"); return; }
  if (cmd.k === "peerr"){ play.em = { k: "peer", name: cmd.name || who, hand: (cmd.hand || []).filter(x => byId[x]), discard: (cmd.discard || []).filter(x => byId[x]) }; renderPlay(); return; }
  if (cmd.k === "plague"){ applyPlague(cmd.n); toast("Plague", `${who}'s Plague afflicted your characters with ${cmd.n}.`, "info"); renderPlay(); return; }
  if (cmd.k === "rdisc"){ const i = play.inplay.findIndex(e => e.uid === cmd.uid); if (i >= 0){ const e = play.inplay.splice(i, 1)[0]; discardEnt(e); toast("Retaliate", `${who}'s Retaliate discarded your ${byId[e.id].name}.`, "info"); } renderPlay(); return; }
  if (cmd.k === "infend"){ pushDiscard(cmd.id); renderPlay(); return; }
  if (cmd.k === "dissolve"){ const n = play.hand.length; addTk("blood", -n, "Dissolve"); toast("Dissolve", `${who}'s Dissolve cost you ${n} Blood (cards in hand).`, "info"); renderPlay(); return; }
  if (cmd.k === "ignite"){ play.ignN = [cmd.n]; toast("Ignite", `${who} ignited the field: every character must attack on your next turn.`, "info"); renderPlay(); return; }
  if (cmd.k === "gift"){ jsnGive((cmd.ids || []).filter(x => byId[x]), who); renderPlay(); return; }
  if (cmd.k === "infoff"){
    if (ent){ const j = (ent.inf || []).findIndex(x => x.id === cmd.id && x.by === from); if (j >= 0) ent.inf.splice(j, 1); toast(inflName(cmd.id), `${who} turned it off on your ${byId[ent.id].name}.`, "info"); }
    renderPlay(); return;
  }
  // Everything after this targets one of my characters.
  if (!ent || gOf(ent.id) !== "character") return;
  if (cmd.k === "ix"){ inflFx(cmd.op, ent); renderPlay(); return; }
  if (cmd.k === "burn"){ const j = ent.att.findIndex(a => a === cmd.id); if (j >= 0){ ent.att.splice(j, 1); play.hand.push(cmd.id); play.fresh = { from: play.hand.length - 1 }; purgeImmune(ent, true); toast("Burn", `${who}'s Burn returned ${byId[cmd.id].name} from your ${byId[ent.id].name} to your hand.`, "info"); } renderPlay(); return; }
  if (cmd.k === "jsn"){ const ids = jsnTake(ent); sendCmd(from, { k: "gift", ids }); toast("Just Say No", `${who} took the cards off your ${byId[ent.id].name}.`, "info"); renderPlay(); return; }
  if (cmd.k === "inf"){ ent.inf = ent.inf || []; ent.inf.push({ id: cmd.id, by: cmd.by || from, exp: cmd.exp }); sparkMold(ent.uid); toast(inflName(cmd.id), `${who} afflicted your ${byId[ent.id].name} with ${inflName(cmd.id)}.`, "info"); }
  else if (cmd.k === "infest" || cmd.k === "contaminate"){ doInfect(ent, cmd.k); }
  renderPlay();
}
// opponents' "dying" is stored as a timestamp locally; on the wire it is an age in ms
function stForWire(st){ return Object.assign({}, st, { inplay: st.inplay.map(e => Object.assign({}, e, { dying: e.dying ? Math.max(1, Date.now() - e.dying) : 0 })) }); }

// What the other player may see of my side (board, resources, hand size).
function mySnap(){
  return {
    name: net.name, deck: cur, blood: play.blood || 0, dry: play.dry || 0, dc: play.dryCur || 0, dm: play.dryMax || 0, per: !!play.persuade, hand: play.hand.length,
    piles: { character: play.pile.character.length, other: play.pile.other.length }, discard: play.discard.length,
    inplay: play.inplay.map(e => ({ id: e.id, uid: e.uid, dmg: e.dmg || 0, inf: (e.inf || []).map(x => ({ id: x.id, by: x.by, exp: x.exp })), att: e.att.slice(), cond: (e.cond || []).slice(), enf: !!e.enf, hin: !!e.hin, rend: e.rend || 0, imm: (e.imm || []).slice(), dying: e.dying ? Math.max(1, Date.now() - e.dying) : 0 }))
  };
}

// Throttled state broadcasting.
let nq;

// Schedule sending my state (batched).
function netQueue(){
  if (net.mode !== "online" || !net.ready || !play) return;
  clearTimeout(nq); nq = setTimeout(sendState, 70);
}

// The last snapshot sent (skip identical ones).
let lastSnapStr = "";

// Send my state if it changed.
function sendState(){
  if (net.mode !== "online" || !net.ready || !play) return;
  const st = mySnap(), str = JSON.stringify(st);
  if (str === lastSnapStr) return;
  lastSnapStr = str;
  if (net.role === "host") bcast({ t: "st", id: "host", st });
  else if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: "st", st });
}

// Name of a card id for log text.
const cardName = id => byId[id] ? byId[id].name : "a card";
// Log markers: B_ wraps a card name, W_ wraps a player name (logFmt turns them into bold HTML).
const B_ = id => "\u0001" + cardName(id) + "\u0002", W_ = who => "\u0003" + who + "\u0004";

// Log text for a game event.
// One-line effect text for the room log, taken from the card's own description.
function fxDesc(id){
  const c = byId[id]; if (!c) return "";
  let d = (c.type === "infliction" ? INFL : ENVD)[c.name] || ""; d = d.replace(/^Quick: /, "");
  const m = d.match(/^.*?[.!](?=\s|$)/); d = m ? m[0] : d;
  return d.length > 150 ? d.slice(0, 147) + "…" : d;
}
function evText(who, ev){
  if (ev.k === "play") return `${W_(who)} played ${B_(ev.id)}`;
  if (ev.k === "attach") return `${W_(who)} attached ${B_(ev.id)} to ${B_(ev.to)}`;
  if (ev.k === "cast") return `${W_(who)} activated ${B_(ev.id)}${fxDesc(ev.id) ? ` — ${fxDesc(ev.id)}` : ""}`;
  if (ev.k === "infl") return `${W_(who)} used ${B_(ev.id)} on ${B_(ev.to)}${fxDesc(ev.id) ? ` — ${fxDesc(ev.id)}` : ""}`;
  if (ev.k === "defeat") return `${B_(ev.id)} (${W_(who)}) was defeated`;
  if (ev.k === "cond") return `${B_(ev.id)} (${W_(who)}) was afflicted with \u0005${(ev.conds || []).join(", ")}\u0006${ev.why ? ` — ${ev.why}` : ""}`;
  if (ev.k === "cure") return `${B_(ev.id)} (${W_(who)}) was cured of \u0005${(ev.conds || []).join(", ")}\u0006`;
  if (ev.k === "immune") return `${B_(ev.id)} (${W_(who)}) was immune to \u0005${(ev.conds || []).join(", ")}\u0006`;
  return "";
}

// Colour category for an event in the log.
const evKind = ev => ({ play: "pl", attach: "pl", cast: "fx", infl: "fx", cond: "cd", cure: "cd", immune: "cd", defeat: "df" })[ev.k] || "";

// Tell the other player about something I did (shown in their log and floating notes).
function netEvent(ev){
  if (SIM) return;
  if (net.mode !== "online" || !net.ready) return;
  netLog(evText("You", ev), evKind(ev));
  if (net.role === "host") bcast({ t: "ev", id: "host", ev });
  else if (net.hostConn && net.hostConn.open) net.hostConn.send({ t: "ev", ev });
}

// Timer for the event banner.
let evTimer;

// Show an event the other player sent.
function applyEv(pid, ev){
  if (!ev) return;
  const nm = net.players[pid] ? net.players[pid].name : "Someone";
  netLog(evText(nm, ev), evKind(ev));
  const c = byId[ev.id];
  if (ev.k === "infl"){ net.fx = net.fx || {}; net.fx[ev.uid] = Date.now(); setTimeout(renderOpps, 60); }
  if ((ev.k === "cast" || ev.k === "infl") && c){
    const el = $("#evb");
    el.innerHTML = `<img src="${esc(img(c))}" alt=""><span>${esc(nm)} activated <b>${esc(c.name)}</b></span>`;

  }
}

// Add a line to the room activity log.
function netLog(t, kind = ""){ if (!t) return; net.log.unshift({ t, kind, at: Date.now() }); net.log = net.log.slice(0, 14); renderLog(); }

// Turn log markers into HTML.
const logFmt = t => esc(t).replace(/\u0001/g, "<b class='lc'>").replace(/\u0002/g, "</b>").replace(/\u0003/g, "<em class='lw'>").replace(/\u0004/g, "</em>").replace(/\u0005/g, "<b class='lk'>").replace(/\u0006/g, "</b>");

// Draw the top bar: names, points ticker, settings and leave.

// HTML for one of the opponent's board slots.
function oppSlotHTML(e, pid, i){
  const c = byId[e.id];

  return `<div class="slot oppslot${flc}${dyn}${(e.inf || []).length ? " moldy" : ""}${mq !== null ? " moldq" : ""}${tg ? " pick tg" : ""}" data-pid="${esc(pid)}" data-oi="${i}" ${isChar ? 'data-char="1"' : ""} style="--n:${e.att.length};--S:${sbr.h}px;--ar:${artAR(c)}${mq !== null ? `;--qo:-${(mq / 1000).toFixed(2)}s` : ""}${dst}${flh}">${att}<div class="c main click ${c.tier === 3 ? "t3" : ""}" tabindex="0" role="button" aria-label="${esc(c.name)}"><div class="im"><img src="${esc(img(c))}" alt="${esc(c.name)}"></div>${e.att.length ? `<span class="badge${cb ? " sh" : ""}">+${e.att.length}</span>` : ""}<div class="meta"><span class="nm">${esc(c.name)}</span></div>${sbr.html}${cb}</div>${itagsHTML(e)}${moldHTML(e, mq)}${popHTML(e)}${e.dying ? deathHTML(e) : ""}</div>`;
}
/* empty placeholders keep four character slots reserved so the board never jumps when a card arrives */
const eslots = (n, lock) => { const m = Math.max(0, 4 - n); return Array.from({ length: m }, (_, k) => lock && k === m - 1 ? `<div class="eslot locked"><i>item slot in use</i></div>` : `<div class="eslot"><i>empty</i></div>`).join(""); };
// Empty item placeholders.
const islots = n => Array.from({ length: Math.max(0, MAX_ITEMS - n) }, () => `<div class="eslot isl"><i>item</i></div>`).join("");

// HTML for the opponent's area (bar, characters, items).
function oppHTML(pid){
  const o = net.players[pid], st = o.st;
  if (!st) return `<div class="oppbox"><div class="oppbar"><b>${esc(o.name)}</b><span class="mut">connecting…</span></div></div>`;
  const backs = Array.from({ length: Math.min(st.hand, 14) }, () => `<i class="cb"></i>`).join("");

// Control: work out which of the opponent's cards can block each attacker, to check a block assignment.
function ctlCheck(cb, theirs){
  const live = theirs.filter(e => !e.dying && byId[e.id] && !withField(theirs, () => effOf(e)).noBlock);
  const bo = {}; live.forEach(e => { bo[e.uid] = withField(theirs, () => effOf(e)); });
  const isC = u => { const e = live.find(x => x.uid === u); return e && gOf(e.id) === "character"; };
  const info = cb.uids.map(u => { const A = play.inplay.find(e => e.uid === u), aO = A ? effOf(A) : {}; return live.filter(e => blockOK(aO, e, bo[e.uid])); });
  const use = {};
  for (let i = 0; i < cb.asg.length; i++){ const u = cb.asg[i]; if (!u) continue; if (!info[i].some(e => e.uid === u)) return "That block isn't allowed (Flight attackers need a Flight or Reach blocker)."; use[u] = (use[u] || 0) + 1; if (use[u] > capOf(bo[u], live.find(e => e.uid === u))) return `${byId[live.find(e => e.uid === u).id].name} can only block ${capOf(bo[u], live.find(e => e.uid === u))} attack${capOf(bo[u], live.find(e => e.uid === u)) > 1 ? "s" : ""}.`; }
  let best = 0;
  (function rec(i, cnt, set){
    if (i === info.length){ best = Math.max(best, set.size); return; }
    rec(i + 1, cnt, set);
    info[i].forEach(e => { if (!isC(e.uid)) return; const c = cnt[e.uid] || 0; if (c >= capOf(bo[e.uid], e)) return; cnt[e.uid] = c + 1; const had = set.has(e.uid); set.add(e.uid); rec(i + 1, cnt, set); cnt[e.uid] = c; if (!had) set.delete(e.uid); });
  })(0, {}, new Set());
  const got = new Set(cb.asg.filter(u => u && isC(u))).size;
  return got >= best ? null : `Control: every enemy character must block at least once (${best} different character${best === 1 ? "" : "s"} should block).`;
}
